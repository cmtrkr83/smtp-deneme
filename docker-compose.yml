services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "4004:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - smtp-otp-login

  smtp-otp-login:
    build: .
    container_name: smtp-otp-login
    restart: unless-stopped
    expose:
      - "4004"
    environment:
      - PORT=4004
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TRUST_PROXY=true
    volumes:
      - smtp-data:/app/data

volumes:
  smtp-data:
