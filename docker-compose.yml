services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "4004:80"
    depends_on:
      - smtp-otp-login
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf << 'EOF'
        server {
            listen 80;
            location / {
                proxy_pass http://smtp-otp-login:4004;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        EOF
        nginx -g 'daemon off;'

  smtp-otp-login:
    build: .
    container_name: smtp-otp-login
    restart: unless-stopped
    environment:
      - PORT=4004
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      - smtp-data:/app/data

volumes:
  smtp-data:
