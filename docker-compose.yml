services:
  smtp-otp-login:
    build: .
    container_name: smtp-otp-login
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      - smtp-data:/app/data

volumes:
  smtp-data:
