services:
  smtp-otp-login:
    build: .
    container_name: smtp-otp-login
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=4004
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      - smtp-data:/app/data

volumes:
  smtp-data:
