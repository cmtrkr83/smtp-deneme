<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <title>Giriş Yap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/style.css?v=3" />
  <script>
    // Giriş (e-posta + OTP) ekranları her zaman açık tema kullanır.
    document.documentElement.dataset.theme = "light";
  </script>
</head>
<body>
    <div class="container">
    <div class="card">
      <div class="card-header">
        <div style="width:128px;height:128px;margin:0 auto 1px;display:flex;align-items:center;justify-content:center;border:none;background:none;box-shadow:none;border-radius:0;">
          <img src="/assets/logo-kodm.png" alt="KODM" style="width:128px;height:128px;display:block;" />
        </div>
        <h1>Giriş Yap</h1>
        <p>Yalnızca Resmi Kurum eposta adresinizle giriş kodu alabilirsiniz</p>
      </div>

      <form id="emailForm" class="fade-in">
        <div class="form-group">
          <label for="email">E-posta Adresi</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" id="email" class="form-control" placeholder="ornek@meb.k12.tr" required />
          </div>
          <div id="emailTypoWarn" class="message warning" style="display:none;margin-top:6px;"></div>
        </div>
        <div class="form-group">
          <label for="captcha">Güvenlik Kodu</label>
          <div id="captchaContainer" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div id="captchaSvg" style="border:1px solid #d1d5db;border-radius:6px;overflow:hidden;flex-shrink:0;width:160px;height:54px;background:#f9fafb;"></div>
            <button type="button" class="btn btn-ghost" id="refreshCaptchaBtn" style="width:auto;padding:8px 12px;font-size:16px;" title="Yeni Kod">
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield icon"></i>
            <input type="text" id="captcha" class="form-control" placeholder="Kodu girin" maxlength="5" inputmode="numeric" pattern="[0-9]*" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="sendOtpBtn" style="background:#b91c1c;border-color:#b91c1c;">
          <i class="fa-solid fa-paper-plane"></i> OTP Gönder
        </button>
        <div id="emailMessage" class="message"></div>
      </form>

      <form id="otpForm" style="display:none" class="fade-in">
        <div class="timer" id="timerDisplay">
          <div class="timer-label">Kodun Süresi</div>
          <div class="timer-value" id="countdown">03:00</div>
        </div>
        <div class="form-group">
          <label for="otp">OTP Kodu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key icon"></i>
            <input type="text" id="otp" class="form-control" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]*" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="verifyOtpBtn">
          <i class="fa-solid fa-check"></i> Doğrula
        </button>
        <div id="otpMessage" class="message"></div>
        <div id="cooldownMessage" class="message"></div>
        <div class="form-footer">
          <button type="button" class="btn btn-link" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i> Geri
          </button>
          <button type="button" class="btn btn-link" id="resendBtn" style="display:none">
            <i class="fa-solid fa-rotate"></i> Yeni Kod
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (token) {
      window.location.href = "/dashboard.html";
    }

    let currentEmail = "";
    let captchaId = "";
    let countdownInterval = null;

    function showMessage(el, text, type) {
      el.textContent = text;
      el.className = "message " + type + " show";
    }

    function hideMessage(el) {
      el.textContent = "";
      el.className = "message";
    }

    // MEB adresi typo yakalama: meb.k12.tr'ye benzeyip tam eşleşmeyen domainleri bayrakla
    function suggestMebFix(email) {
      const norm = String(email || "").toLowerCase().trim();
      const at = norm.lastIndexOf("@");
      if (at < 1) return null;
      const local = norm.slice(0, at);
      const domain = norm.slice(at + 1);
      if (!local || !domain) return null;
      if (domain === "meb.k12.tr") return null;
      // Noktasız/kaymış yazımlar için normalize karşılaştırma: örn "meb.k12tr" -> "mebk12tr"
      const flat = (s) => s.replace(/[^a-z0-9]/g, "");
      if (flat(domain) === "mebk12tr") return local + "@meb.k12.tr";
      // meb veya k12 içeren ama doğru olmayan her şey typo adayıdır
      if (domain.includes("meb") || domain.includes("k12") || domain.includes("k.12") || domain.replace(/\./g, "") === "mebk12tr") {
        return local + "@meb.k12.tr";
      }
      return null;
    }

    function refreshTypoWarn() {
      const input = document.getElementById("email");
      const warn = document.getElementById("emailTypoWarn");
      const suggestion = suggestMebFix(input.value);
      if (suggestion && input.value.trim() !== "") {
        warn.style.display = "block";
        warn.innerHTML = "";
        const txt = document.createTextNode("Adres yanlış gibi görünüyor. Doğrusu " + suggestion + " olabilir mi? ");
        const fix = document.createElement("button");
        fix.type = "button";
        fix.className = "btn btn-link";
        fix.style.padding = "0";
        fix.textContent = "Düzelt";
        fix.addEventListener("click", () => {
          input.value = suggestion;
          refreshTypoWarn();
          input.focus();
        });
        warn.appendChild(txt);
        warn.appendChild(fix);
        return suggestion;
      }
      warn.style.display = "none";
      warn.innerHTML = "";
      return null;
    }

    document.getElementById("email").addEventListener("input", refreshTypoWarn);
    document.getElementById("email").addEventListener("blur", refreshTypoWarn);

    async function loadCaptcha() {
      try {
        const res = await fetch("/api/captcha");
        const data = await res.json();
        captchaId = data.id;
        document.getElementById("captchaSvg").innerHTML = data.svg;
        document.getElementById("captcha").value = "";
      } catch {}
    }

    document.getElementById("refreshCaptchaBtn").addEventListener("click", loadCaptcha);

    function startCountdown(expiresInMs) {
      const timerEl = document.getElementById("countdown");
      const timerDisplay = document.getElementById("timerDisplay");
      const resendBtn = document.getElementById("resendBtn");
      let remaining = Math.floor(expiresInMs / 1000);

      clearInterval(countdownInterval);

      function tick() {
        if (remaining <= 0) {
          timerEl.textContent = "00:00";
          timerDisplay.classList.add("expired");
          resendBtn.style.display = "inline";
          clearInterval(countdownInterval);
          return;
        }
        const mins = String(Math.floor(remaining / 60)).padStart(2, "0");
        const secs = String(remaining % 60).padStart(2, "0");
        timerEl.textContent = mins + ":" + secs;
        timerDisplay.classList.remove("expired");
        resendBtn.style.display = "none";
        remaining--;
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    document.getElementById("emailForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const captcha = document.getElementById("captcha").value;
      const btn = document.getElementById("sendOtpBtn");
      const msg = document.getElementById("emailMessage");

      const suggestion = refreshTypoWarn();
      if (suggestion) {
        showMessage(msg, "E-posta adresi hatalı görünüyor. Doğrusu " + suggestion + " olabilir mi? Kontrol edip tekrar deneyin.", "error");
        document.getElementById("email").focus();
        return;
      }

      if (!captchaId) {
        showMessage(msg, "Güvenlik kodu yüklenemedi. Lütfen sayfayı yenileyin.", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gönderiliyor...';
      hideMessage(msg);

      try {
        const res = await fetch("/api/send-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, captchaId, captcha }),
        });
        const data = await res.json();
        if (res.ok) {
          currentEmail = email;
          showMessage(msg, data.message, "success");
          document.getElementById("emailForm").style.display = "none";
          document.getElementById("otpForm").style.display = "block";
          hideMessage(document.getElementById("cooldownMessage"));
          hideMessage(document.getElementById("otpMessage"));
          document.getElementById("otp").value = "";
          document.getElementById("otp").focus();
          startCountdown(data.expiresIn);
        } else {
          if (data.captchaExpired) {
            showMessage(msg, data.error, "error");
            loadCaptcha();
          } else if (data.cooldown) {
            showMessage(msg, data.cooldown + " saniye sonra tekrar deneyin.", "warning");
          } else {
            showMessage(msg, data.error, "error");
            loadCaptcha();
          }
        }
      } catch {
        showMessage(msg, "Bağlantı hatası.", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> OTP Gönder';
      }
    });

    document.getElementById("otpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const otp = document.getElementById("otp").value;
      const btn = document.getElementById("verifyOtpBtn");
      const msg = document.getElementById("otpMessage");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Doğrulanıyor...';
      hideMessage(msg);

      try {
        const res = await fetch("/api/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentEmail, otp }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("token", data.token);
          showMessage(msg, "Giriş başarılı! Yönlendiriliyor...", "success");
          setTimeout(() => window.location.replace("/dashboard.html"), 800);
        } else {
          if (data.lockout) {
            showMessage(msg, data.lockout + " saniye bekleyin.", "warning");
          } else {
            showMessage(msg, data.error, "error");
          }
        }
      } catch {
        showMessage(msg, "Bağlantı hatası.", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Doğrula';
      }
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      clearInterval(countdownInterval);
      document.getElementById("otpForm").style.display = "none";
      document.getElementById("emailForm").style.display = "block";
      hideMessage(document.getElementById("emailMessage"));
      hideMessage(document.getElementById("otpMessage"));
      hideMessage(document.getElementById("cooldownMessage"));
      document.getElementById("otp").value = "";
    });

    document.getElementById("resendBtn").addEventListener("click", () => {
      clearInterval(countdownInterval);
      document.getElementById("otpForm").style.display = "none";
      document.getElementById("emailForm").style.display = "block";
      hideMessage(document.getElementById("emailMessage"));
      hideMessage(document.getElementById("otpMessage"));
      document.getElementById("otp").value = "";
      loadCaptcha();
      document.getElementById("email").focus();
    });

    loadCaptcha();
  </script>
</body>
</html>
