<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> KODM PANEL </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="dashboard-body">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">K</div>
        <div class="logo-text">
          KOCAELİ ODM
          <small>Yönetim Paneli</small>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="mobileLogoutBtn" style="display:none;">
          <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div style="flex:1"></div>
        <div class="topbar-user">
          <div class="avatar" id="userAvatar">K</div>
          <div>
            <div class="user-name" id="userName">Yükleniyor...</div>
            <div class="user-role" id="userRole">-</div>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Çıkış
        </button>
      </header>

      <!-- Content -->
      <div class="content-area" id="contentArea">
        <!-- Dynamic content loaded here -->
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "/login.html";
    }

    let currentUser = null;
    let dashboardData = null;

    function buildSidebar(role) {
      const nav = document.getElementById("sidebarNav");
      const items = [];

      const allItems = [
        { page: "dashboard", icon: "fa-gauge-high", label: "Genel Bakış", roles: ["admin", "lise", "ortaokul"] },
        { page: "users", icon: "fa-users", label: "Kullanıcılar", roles: ["admin"] },
        { page: "announcements", icon: "fa-bullhorn", label: "Duyurular", roles: ["admin", "lise", "ortaokul"] },
        { page: "surveys", icon: "fa-square-poll-vertical", label: "Anketler", roles: ["admin", "lise", "ortaokul"] },
        { page: "files", icon: "fa-folder-open", label: "Dosyalar", roles: ["admin", "lise", "ortaokul"] },
        { page: "logs", icon: "fa-clipboard-list", label: "Log Kayıtları", roles: ["admin"] },
        { separator: true, roles: ["admin", "lise", "ortaokul"] },
        { page: "school-profile", icon: "fa-school", label: "Okul Bilgilerim", roles: ["lise", "ortaokul"] },
        { page: "schools", icon: "fa-school", label: "Okullar", roles: ["admin"] },
        { page: "reports", icon: "fa-chart-bar", label: "Raporlar", roles: ["admin"] },
        { page: "settings", icon: "fa-sliders", label: "Ayarlar", roles: ["admin"] },
      ];

      allItems.forEach((item) => {
        if (!item.roles.includes(role)) return;
        if (item.separator) {
          items.push('<div class="nav-section-title">İşlemler</div>');
          return;
        }
        items.push(`<button class="nav-item" data-page="${item.page}"><i class="fa-solid ${item.icon}"></i> ${item.label}</button>`);
      });

      nav.innerHTML = items.join("");

      // Re-bind click events
      nav.querySelectorAll(".nav-item").forEach((item) => {
        item.addEventListener("click", () => {
          nav.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
          item.classList.add("active");
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("show");

    const page = item.dataset.page;
    if (page === "dashboard") renderDashboard();
    else if (page === "users") renderUsers();
    else if (page === "announcements") renderAnnouncements();
    else if (page === "logs") renderLogs();
    else if (page === "schools") renderSchools();
    else if (page === "school-profile") { showSchoolProfileForm(); document.querySelector('.nav-item.active')?.classList.remove('active'); }
    else if (page === "surveys") { renderSurveys(); }
    else if (page === "files") { renderFiles(); }
    else if (page === "reports") { renderReports(); }
    else renderPlaceholder(page);
        });
      });
    }

    const roleLabels = {
      admin: "Sistem Yöneticisi",
      lise: "Lise Grubu",
      ortaokul: "Ortaokul Grubu",
    };

    // Sidebar toggle
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarBackdrop").classList.toggle("show");
    });
    document.getElementById("sidebarBackdrop").addEventListener("click", () => {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarBackdrop").classList.remove("show");
    });

    // Logout
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("mobileLogoutBtn")?.addEventListener("click", logout);

    // Fetch profile and dashboard data
    async function init() {
      try {
        const [profileRes, dashRes] = await Promise.all([
          fetch("/api/profile", { headers: { Authorization: "Bearer " + token } }),
          fetch("/api/dashboard", { headers: { Authorization: "Bearer " + token } }),
        ]);

        if (!profileRes.ok || !dashRes.ok) throw new Error("Unauthorized");

        currentUser = await profileRes.json();
        dashboardData = await dashRes.json();

        // Update topbar
        const initial = currentUser.email.charAt(0).toUpperCase();
        document.getElementById("userAvatar").textContent = initial;
        document.getElementById("userName").textContent = currentUser.email;
        document.getElementById("userRole").textContent = roleLabels[currentUser.role] || currentUser.role;

        buildSidebar(currentUser.role);

        const firstNav = document.querySelector(".nav-item");
        if (firstNav) firstNav.click();
        else renderDashboard();
      } catch {
        localStorage.removeItem("token");
        window.location.href = "/login.html";
      }
    }

    function renderDashboard() {
      const area = document.getElementById("contentArea");
      const data = dashboardData;
      if (!data) return;

      const roleLabel = roleLabels[data.role] || data.role;

      let html = `
        <div class="content-header">
          <h2>Genel Bakış</h2>
          <p>${roleLabel} paneline hoş geldiniz.</p>
        </div>
      `;

      // Stats
      if (data.stats) {
        html += `<div class="stats-grid">`;
        data.stats.forEach((s) => {
          html += `
            <div class="stat-card">
              <div class="stat-icon" style="background:${s.color}15;color:${s.color}">
                <i class="fa-solid ${s.icon}"></i>
              </div>
              <div class="stat-info">
                <div class="stat-value">${s.value}</div>
                <div class="stat-label">${s.label}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // Links
      if (data.links) {
        html += `<div class="section-title"><i class="fa-solid fa-link"></i> Hızlı Erişim</div>`;
        html += `<div class="cards-grid" id="quickLinks">`;
        data.links.forEach((l) => {
          const isNav = l.url.startsWith("/navigate/");
          const badge = l.badge > 0 ? `<span class="card-badge">${l.badge}</span>` : "";
          html += `
            <a href="${isNav ? 'javascript:void(0)' : l.url}" class="link-card" data-nav="${isNav ? l.url.replace('/navigate/', '') : ''}">
              <div class="card-icon"><i class="fa-solid ${l.icon}"></i>${badge}</div>
              <h4>${l.title}</h4>
              <p>${l.desc}</p>
            </a>
          `;
        });
        html += `</div>`;
      }

      // Announcements (only for admin)
      if (currentUser.role === "admin" && data.announcements && data.announcements.length > 0) {
        html += `<div class="section-title"><i class="fa-solid fa-bullhorn"></i> Duyurular</div>`;
        html += `<div class="announcements-list">`;
        const targetLabels = { all: "Tümü", lise: "Lise", ortaokul: "Ortaokul" };
        data.announcements.forEach((a) => {
          const isRead = a.read;
          const date = new Date(a.createdAt).toLocaleDateString("tr-TR");
          html += `
            <div class="announcement-item" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
              <div style="flex:1;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                  <span class="ann-tag ${a.target}">${targetLabels[a.target] || a.target}</span>
                  ${isRead
                    ? '<span style="font-size:11px;color:#16a34a;"><i class="fa-solid fa-check"></i> Okundu</span>'
                    : '<span style="font-size:11px;color:#d97706;"><i class="fa-solid fa-circle"></i> Okunmadı</span>'}
                </div>
                <h4>${a.title}</h4>
                <p>${a.content}</p>
                <div class="ann-date">${date}</div>
              </div>
              ${!isRead ? `<button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:12px;flex-shrink:0;" onclick="markAsRead('${a.id}')"><i class="fa-solid fa-check"></i> Okundu İşaretle</button>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      area.innerHTML = html;

      // Quick link navigation
      document.querySelectorAll("#quickLinks .link-card[data-nav]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          const page = el.dataset.nav;
          const navBtn = document.querySelector(`.nav-item[data-page="${page}"]`);
          if (navBtn) navBtn.click();
        });
      });
    }

    function escHtml(s) {
      if (!s) return "";
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function markAsRead(id, source) {
      try {
        await fetch("/api/announcements/" + id + "/read", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
        });
        if (source === "announcements") {
          await renderSchoolAnnouncements();
        } else {
          const dashRes = await fetch("/api/dashboard", {
            headers: { Authorization: "Bearer " + token },
          });
          if (dashRes.ok) {
            dashboardData = await dashRes.json();
            renderDashboard();
          }
        }
      } catch {}
    }

    function renderPlaceholder(page) {
      const area = document.getElementById("contentArea");
      const titles = {
        users: "Kullanıcı Yönetimi",
        announcements: "Duyuru Yönetimi",
        logs: "Log Kayıtları",
        schools: "Okul Yönetimi",
        reports: "Raporlar",
        settings: "Ayarlar",
      };
      if (page === "users") { renderUsers(); return; }
      if (page === "announcements") { renderAnnouncements(); return; }
      if (page === "logs") { renderLogs(); return; }
      if (page === "schools") { renderSchools(); return; }
      area.innerHTML = `
        <div class="content-header">
          <h2>${titles[page] || page}</h2>
          <p>Bu bölüm hazırlanıyor.</p>
        </div>
        <div style="text-align:center;padding:60px 0;color:#ccc;">
          <i class="fa-solid fa-wrench" style="font-size:48px;margin-bottom:16px;display:block;"></i>
          <div style="font-size:14px;">Sayfa yapım aşamasındadır.</div>
        </div>
      `;
    }

    // ---- User Management ----

    async function renderUsers() {
      const area = document.getElementById("contentArea");
      area.innerHTML = `
        <div class="content-header" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h2>Kullanıcı Yönetimi</h2>
            <p>Sisteme erişebilecek kullanıcıları yönetin.</p>
          </div>
          <button class="btn btn-primary" style="width:auto;padding:10px 20px;font-size:13px;" onclick="showAddUserModal()">
            <i class="fa-solid fa-plus"></i> Kullanıcı Ekle
          </button>
        </div>
        <div class="users-table-wrapper">
          <table class="users-table">
            <thead>
              <tr>
                <th>E-posta</th>
                <th>Rol</th>
                <th>Kayıt Tarihi</th>
                <th>Son Giriş</th>
                <th style="text-align:right;">İşlemler</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.2);padding:40px;">Yükleniyor...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="modal-overlay" id="userModal" style="display:none" onclick="if(event.target===this)closeUserModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 id="modalTitle">Kullanıcı Ekle</h3>
              <button class="modal-close" onclick="closeUserModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="modalEmail">E-posta Adresi</label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-envelope icon"></i>
                  <input type="email" id="modalEmail" class="form-control" placeholder="ornek@mail.com" />
                </div>
              </div>
              <div class="form-group">
                <label for="modalRole">Rol</label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-user-tag icon"></i>
                  <select id="modalRole" class="form-control" style="padding-left:44px;-webkit-appearance:none;appearance:none;">
                    <option value="admin">Sistem Yöneticisi</option>
                    <option value="lise">Lise Grubu</option>
                    <option value="ortaokul">Ortaokul Grubu</option>
                  </select>
                </div>
              </div>
              <div id="modalMessage" class="message"></div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" style="width:auto;" onclick="closeUserModal()">İptal</button>
              <button class="btn btn-primary" style="width:auto;" id="modalSaveBtn" onclick="saveUser()">Kaydet</button>
            </div>
          </div>
        </div>
        <div class="modal-overlay" id="deleteModal" style="display:none" onclick="if(event.target===this)closeDeleteModal()">
          <div class="modal" style="max-width:400px;">
            <div class="modal-header">
              <h3>Kullanıcıyı Sil</h3>
              <button class="modal-close" onclick="closeDeleteModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
              <p style="color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:8px;">
                <span id="deleteEmail" style="color:#fff;font-weight:500;"></span> kullanıcısını silmek istediğinize emin misiniz?
              </p>
              <div id="deleteMessage" class="message"></div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" style="width:auto;" onclick="closeDeleteModal()">İptal</button>
              <button class="btn btn-danger" style="width:auto;" id="deleteConfirmBtn" onclick="confirmDelete()">Sil</button>
            </div>
          </div>
        </div>
      `;
      await loadUsersTable();
    }

    let editEmail = null;
    let deleteTarget = null;

    async function loadUsersTable() {
      const tbody = document.getElementById("usersTableBody");
      try {
        const res = await fetch("/api/users", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const users = await res.json();
        tbody.innerHTML = users.map((u) => {
          const roleLabel = roleLabels[u.role] || u.role;
          const created = u.created ? new Date(u.created).toLocaleDateString("tr-TR") : "-";
          const lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleDateString("tr-TR") + " " + new Date(u.lastLogin).toLocaleTimeString("tr-TR", {hour:"2-digit",minute:"2-digit"}) : "-";
          const canDelete = u.email !== currentUser.email;
          return `
            <tr>
              <td class="cell-email">${u.email}</td>
              <td>
                <select class="role-select" data-email="${u.email}" onchange="updateRole('${u.email}',this.value)">
                  <option value="admin" ${u.role==="admin"?"selected":""}>Sistem Yöneticisi</option>
                  <option value="lise" ${u.role==="lise"?"selected":""}>Lise Grubu</option>
                  <option value="ortaokul" ${u.role==="ortaokul"?"selected":""}>Ortaokul Grubu</option>
                </select>
              </td>
              <td class="cell-date">${created}</td>
              <td class="cell-date">${lastLogin}</td>
              <td class="cell-actions">
                ${canDelete ? `<button class="btn-icon btn-icon-danger" onclick="showDeleteModal('${u.email}')" title="Sil"><i class="fa-solid fa-trash-can"></i></button>` : '<span style="color:rgba(255,255,255,0.15);font-size:12px;">(siz)</span>'}
              </td>
            </tr>
          `;
        }).join("");
      } catch {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ef4444;padding:40px;">Kullanıcılar yüklenirken hata oluştu.</td></tr>';
      }
    }

    function showAddUserModal() {
      editEmail = null;
      document.getElementById("modalTitle").textContent = "Kullanıcı Ekle";
      document.getElementById("modalSaveBtn").textContent = "Kaydet";
      document.getElementById("modalEmail").value = "";
      document.getElementById("modalEmail").disabled = false;
      document.getElementById("modalRole").value = "admin";
      document.getElementById("modalMessage").textContent = "";
      document.getElementById("modalMessage").className = "message";
      document.getElementById("userModal").style.display = "flex";
      setTimeout(() => document.getElementById("modalEmail").focus(), 100);
    }

    function closeUserModal() {
      document.getElementById("userModal").style.display = "none";
    }

    async function saveUser() {
      const email = document.getElementById("modalEmail").value.trim();
      const role = document.getElementById("modalRole").value;
      const msg = document.getElementById("modalMessage");
      const btn = document.getElementById("modalSaveBtn");

      if (!email) {
        msg.textContent = "E-posta adresi girin.";
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      btn.textContent = " Kaydediliyor...";

      try {
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ email, role }),
        });
        const data = await res.json();
        if (res.ok) {
          closeUserModal();
          await loadUsersTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        btn.textContent = "Kaydet";
      }
    }

    async function updateRole(email, role) {
      try {
        await fetch("/api/users/" + encodeURIComponent(email), {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ role }),
        });
      } catch {}
    }

    function showDeleteModal(email) {
      deleteTarget = email;
      document.getElementById("deleteEmail").textContent = email;
      document.getElementById("deleteMessage").textContent = "";
      document.getElementById("deleteMessage").className = "message";
      document.getElementById("deleteModal").style.display = "flex";
    }

    function closeDeleteModal() {
      document.getElementById("deleteModal").style.display = "none";
      deleteTarget = null;
    }

    async function confirmDelete() {
      if (!deleteTarget) return;
      const msg = document.getElementById("deleteMessage");
      const btn = document.getElementById("deleteConfirmBtn");

      btn.disabled = true;
      btn.textContent = " Siliniyor...";

      try {
        const res = await fetch("/api/users/" + encodeURIComponent(deleteTarget), {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });
        const data = await res.json();
        if (res.ok) {
          closeDeleteModal();
          await loadUsersTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
          btn.disabled = false;
          btn.textContent = "Sil";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
        btn.disabled = false;
        btn.textContent = "Sil";
      }
    }

    // ---- Announcement Management ----

    let editingAnnId = null;

    async function renderAnnouncements() {
      const area = document.getElementById("contentArea");
      const isAdmin = currentUser.role === "admin";

      if (isAdmin) {
        area.innerHTML = `
          <div class="content-header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h2>Duyuru Yönetimi</h2>
              <p>Duyuruları oluşturun, düzenleyin ve yönetin.</p>
            </div>
            <button class="btn btn-primary" style="width:auto;padding:10px 20px;font-size:13px;" onclick="showAnnModal()">
              <i class="fa-solid fa-plus"></i> Duyuru Ekle
            </button>
          </div>
          <div class="users-table-wrapper">
            <table class="users-table">
              <thead>
                <tr>
                  <th>Başlık</th>
                  <th>Hedef</th>
                  <th>Bitiş</th>
                  <th>Okunma</th>
                  <th style="text-align:right;">İşlemler</th>
                </tr>
              </thead>
              <tbody id="annTableBody">
                <tr><td colspan="5" style="text-align:center;color:#aaa;padding:40px;">Yükleniyor...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="modal-overlay" id="annModal" style="display:none" onclick="if(event.target===this)closeAnnModal()">
            <div class="modal" style="max-width:560px;">
              <div class="modal-header">
                <h3 id="annModalTitle">Duyuru Ekle</h3>
                <button class="modal-close" onclick="closeAnnModal()"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="modal-body">
                <div class="form-group">
                  <label for="annTitle">Başlık</label>
                  <div class="input-wrapper">
                    <i class="fa-solid fa-heading icon"></i>
                    <input type="text" id="annTitle" class="form-control" placeholder="Duyuru başlığı" />
                  </div>
                </div>
                <div class="form-group">
                  <label for="annContent">İçerik</label>
                  <textarea id="annContent" class="form-control" style="padding-left:16px;min-height:100px;resize:vertical;" placeholder="Duyuru içeriği"></textarea>
                </div>
                <div class="form-group">
                  <label for="annTarget">Hedef Kitle</label>
                  <div class="input-wrapper">
                    <i class="fa-solid fa-bullseye icon"></i>
                    <select id="annTarget" class="form-control" style="padding-left:44px;">
                      <option value="all">Tüm Kullanıcılar</option>
                      <option value="lise">Lise Grubu</option>
                      <option value="ortaokul">Ortaokul Grubu</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label for="annExpiry">Geçerlilik Süresi (gün)</label>
                  <div class="input-wrapper">
                    <i class="fa-solid fa-calendar icon"></i>
                    <input type="number" id="annExpiry" class="form-control" style="padding-left:44px;" value="7" min="1" max="365" />

    async function loadAnnouncementsTable() {
      const tbody = document.getElementById("annTableBody");
      try {
        const res = await fetch("/api/announcements", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        readData = list;
        const targetLabels = { all: "Tümü", lise: "Lise", ortaokul: "Ortaokul" };
        tbody.innerHTML = list.map((a) => {
          const expires = new Date(a.expiresAt).toLocaleDateString("tr-TR");
          const expired = a.expiresAt < Date.now();
          const readCount = a.readCount || (a.readBy ? a.readBy.length : 0);
          const readDetail = a.readBy && a.readBy.length > 0
            ? a.readBy.join(", ")
            : "Henüz okunmadı";
          return `
            <tr style="${expired ? 'opacity:0.4;' : ''}">
              <td class="cell-email">${a.title}</td>
              <td><span class="ann-tag ${a.target === 'all' ? 'admin' : a.target}" style="font-size:11px;">${targetLabels[a.target] || a.target}</span></td>
              <td class="cell-date">${expired ? 'Süresi doldu' : expires}</td>
              <td class="cell-date">
                ${readCount > 0
                  ? `<a href="#" onclick="showReadDetail('${a.id}');return false;" style="color:#6366f1;text-decoration:none;">${readCount} kişi</a>`
                  : '0 kişi'}
              </td>
              <td class="cell-actions">
                <button class="btn-icon" onclick="editAnn('${a.id}')" title="Düzenle"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-icon btn-icon-danger" onclick="deleteAnn('${a.id}')" title="Sil"><i class="fa-solid fa-trash-can"></i></button>
              </td>
            </tr>
          `;
        }).join("");
      } catch {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#dc2626;padding:40px;">Duyurular yüklenirken hata oluştu.</td></tr>';
      }
    }

    async function renderSchoolAnnouncements() {
      const container = document.getElementById("schoolAnnouncements");
      container.innerHTML = '<p style="color:#aaa;text-align:center;padding:40px;">Yükleniyor...</p>';
      try {
        const res = await fetch("/api/announcements", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const targetLabels = { all: "Tümü", lise: "Lise", ortaokul: "Ortaokul" };

        if (list.length === 0) {
          container.innerHTML = '<p style="color:#aaa;text-align:center;padding:40px;">Henüz duyuru bulunmuyor.</p>';
          return;
        }

        container.innerHTML = '<div class="announcements-list">' + list.map((a) => {
          const isRead = a.read;
          const date = new Date(a.createdAt).toLocaleDateString("tr-TR");
          return `

              <div style="flex:1;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">

                  ${isRead

                    : '<span style="font-size:11px;color:#d97706;"><i class="fa-solid fa-circle"></i> Okunmadı</span>'}
                </div>
                <h4>${a.title}</h4>
                <p>${a.content}</p>
                <div class="ann-date">${date}</div>

    function showAnnModal() {

      document.getElementById("annModalTitle").textContent = "Duyuru Ekle";
      document.getElementById("annSaveBtn").textContent = "Kaydet";
      document.getElementById("annTitle").value = "";

    async function editAnn(id) {
      try {
        const res = await fetch("/api/announcements", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const ann = list.find((a) => a.id === id);
        if (!ann) return;
        editingAnnId = id;
        document.getElementById("annModalTitle").textContent = "Duyuru Düzenle";
        document.getElementById("annSaveBtn").textContent = "Güncelle";
        document.getElementById("annTitle").value = ann.title;
        document.getElementById("annContent").value = ann.content;
        document.getElementById("annTarget").value = ann.target;
        const remainingDays = Math.ceil((ann.expiresAt - Date.now()) / (24 * 60 * 60 * 1000));
        document.getElementById("annExpiry").value = Math.max(1, remainingDays);
        document.getElementById("annModalMessage").textContent = "";
        document.getElementById("annModalMessage").className = "message";
        document.getElementById("annModal").style.display = "flex";
        setTimeout(() => document.getElementById("annTitle").focus(), 100);
      } catch {}
    }

    async function saveAnnouncement() {
      const title = document.getElementById("annTitle").value.trim();
      const content = document.getElementById("annContent").value.trim();
      const target = document.getElementById("annTarget").value;
      const expiresInDays = parseInt(document.getElementById("annExpiry").value) || 7;
      const msg = document.getElementById("annModalMessage");
      const btn = document.getElementById("annSaveBtn");

      if (!title || !content) {
        msg.textContent = "Başlık ve içerik gerekli.";
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      btn.textContent = " Kaydediliyor...";

      try {
        const method = editingAnnId ? "PUT" : "POST";
        const url = editingAnnId ? "/api/announcements/" + editingAnnId : "/api/announcements";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ title, content, target, expiresInDays }),
        });
        const data = await res.json();
        if (res.ok) {
          closeAnnModal();
          await loadAnnouncementsTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        btn.textContent = editingAnnId ? "Güncelle" : "Kaydet";
      }
    }

    async function deleteAnn(id) {
      if (!confirm("Bu duyuruyu silmek istediğinize emin misiniz?")) return;
      try {
        await fetch("/api/announcements/" + id, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });
        await loadAnnouncementsTable();
      } catch {}
    }

    function getActionColor(action) {
      const colors = {
        login: "#22c55e",
        otp_request: "#6366f1",
        user_create: "#22c55e",
        user_delete: "#ef4444",
        user_role_change: "#f59e0b",
        announcement_create: "#22c55e",
        announcement_edit: "#f59e0b",

      };
      return colors[action] || "#888";

    async function exportLogs() {
      try {
        const res = await fetch("/api/logs/export", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "sistem-log-" + Date.now() + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch {
        alert("Loglar indirilirken hata oluştu.");
      }
    }

        schoolCode: schoolCodeEl ? schoolCodeEl.value.trim() : "",

        msg.className = "message error show";
        return;

      btn.disabled = true;
      btn.textContent = " Kaydediliyor...";

      try {
        const res = await fetch("/api/profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },

          closeSchoolProfileForm();
          renderDashboard();

          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";

    async function uploadFile() {
      const msg = document.getElementById("uploadMsg");
      const fileInput = document.getElementById("fileInput");
      const desc = document.getElementById("fileDesc");
      const expiresAt = document.getElementById("fileExpiresAt");
      const targetType = document.getElementById("fileTargetType");
      const targetGroup = document.getElementById("fileTargetGroup");
      const targetUsers = document.getElementById("fileTargetUsers");

      if (!fileInput.files || !fileInput.files[0]) {
        msg.className = "message error show"; msg.textContent = "Lütfen bir ZIP dosyası seçin."; return;
      }
      if (!desc.value.trim()) {
        msg.className = "message error show"; msg.textContent = "Açıklama zorunlu."; return;
      }
      if (!expiresAt.value) {
        msg.className = "message error show"; msg.textContent = "İndirme süresi zorunlu."; return;
      }
      if (fileInput.files[0].size > 10 * 1024 * 1024) {
        msg.className = "message error show"; msg.textContent = "Dosya boyutu 10 MB'i geçemez."; return;
      }
      if (!fileInput.files[0].name.toLowerCase().endsWith(".zip")) {
        msg.className = "message error show"; msg.textContent = "Sadece ZIP dosyası kabul edilir."; return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("description", desc.value.trim());
      formData.append("expiresAt", new Date(expiresAt.value).getTime());
      formData.append("targetType", targetType.value);
      if (targetType.value === "group") formData.append("targetGroup", targetGroup.value);
      if (targetType.value === "users") formData.append("targetUsers", targetUsers.value);

      try {
        const res = await fetch("/api/files", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "message success show";
          msg.textContent = "Dosya başarıyla yüklendi!";
          setTimeout(() => renderAdminFiles(), 1000);
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Yükleme başarısız.";
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata oluştu: " + e.message;
      }
    }

    async function deleteFile(id) {
      if (!confirm("Bu dosyayı silmek istediğinize emin misiniz?")) return;
      try {
        const res = await fetch("/api/files/" + id, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });
        if (res.ok) {
          loadAdminFilesTable();
        }
      } catch (_) {}
    }

    async function downloadFile(id) {
      try {
        const res = await fetch("/api/files/" + id + "/download", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || "Dosya indirilemedi.");
          return;
        }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const match = cd.match(/filename="?(.+?)"?$/);
        const filename = match ? match[1] : "dosya.zip";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("İndirme sırasında hata: " + e.message);
      }
    }

      html += '</div></div></div>';

      // Third row
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;">';

      // 5) Survey response rates
      html += '<div class="report-card"><h4><i class="fa-solid fa-square-poll-vertical"></i> Anket Yanitlama Oranlari</h4><div style="margin-top:8px;">';
      if (d.surveyStats.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:#ccc;font-size:13px;">Henuz anket bulunmuyor.</div>';
      } else {
        d.surveyStats.forEach((s) => {
          const barColor = s.rate >= 70 ? "#22c55e" : s.rate >= 40 ? "#f59e0b" : "#ef4444";
          html += '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">'
            + '<span style="color:#555;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(s.title) + '</span>'
            + '<span style="color:#888;">' + s.respCount + '/' + s.targetCount + '</span></div>'
            + '<div style="height:20px;background:#f0f0f5;border-radius:6px;overflow:hidden;">'
            + '<div style="height:100%;width:' + s.rate + '%;background:' + barColor + ';border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;min-width:fit-content;padding:0 6px;">' + s.rate + '%</div></div></div>';
        });

      html += '</div></div>';

      html += '<div class="report-card"><h4><i class="fa-solid fa-file-zipper"></i> En Cok Indirilen Dosyalar</h4><div style="margin-top:8px;">';
      if (d.topFiles.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:#ccc;font-size:13px;">Henuz dosya yuklenmemis.</div>';
      } else {

    function drawUserPieChart(users) {
      const canvas = document.getElementById("userPieChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      const cx = w / 2, cy = h / 2, r = 68;

      ctx.clearRect(0, 0, w, h);

      const segments = [
        { count: users.admin, color: "#6366f1", label: "Admin" },
        { count: users.lise, color: "#22c55e", label: "Lise" },
        { count: users.ortaokul, color: "#f59e0b", label: "Ortaokul" },
      ];
      const total = users.total || 1;
      let startAngle = -Math.PI / 2;

      segments.forEach((s) => {
        if (s.count === 0) return;
        const sliceAngle = (s.count / total) * 2 * Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        startAngle += sliceAngle;
      });

      // Center hole (donut)
      ctx.beginPath();
      ctx.arc(cx, cy, 36, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.fill();

      // Center text
      ctx.fillStyle = "#1a1a2e";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(total, cx, cy - 6);
      ctx.font = "10px sans-serif";
      ctx.fillStyle = "#888";
      ctx.fillText("Kullanıcı", cx, cy + 14);
    }

    function renderQuestionBlock(q, idx) {

      const options = q.options || [];
      const optionsHtml = options.length > 0
        ? options.map((o, oi) => `
            <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
              <input type="text" class="q-option" value="${escHtml(o)}" style="flex:1;padding:8px 12px;font-size:13px;border:1px solid #e2e4e9;border-radius:6px;outline:none;font-family:inherit;" />
              <button class="btn-icon btn-icon-danger" onclick="removeOption(this)" style="width:28px;height:28px;font-size:12px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `).join("")
        : '<p class="options-placeholder" style="font-size:12px;color:#aaa;margin-top:4px;">Çoktan seçmeli veya dereceli sorularda seçenek ekleyin.</p>';

      return `
        <div class="announcement-item question-block">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
            <div style="flex:1;">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
                <span style="font-size:11px;font-weight:600;color:#888;">Soru ${idx + 1}</span>
                <select class="q-type" onchange="changeQuestionType(this)" style="padding:4px 8px;font-size:12px;border:1px solid #e2e4e9;border-radius:4px;outline:none;font-family:inherit;">
                  <option value="open_ended" ${q.type === "open_ended" ? "selected" : ""}>Açık Uçlu</option>
                  <option value="multiple_choice" ${q.type === "multiple_choice" ? "selected" : ""}>Çoktan Seçmeli</option>
                  <option value="likert" ${q.type === "likert" ? "selected" : ""}>Dereceli (1-5)</option>
                </select>
                <label style="font-size:12px;color:#888;display:flex;align-items:center;gap:4px;cursor:pointer;">
                  <input type="checkbox" class="q-required" ${q.required !== false ? "checked" : ""} /> Zorunlu
                </label>
                <select class="q-validation" onchange="changeValidationType(this)" style="padding:4px 8px;font-size:12px;border:1px solid #e2e4e9;border-radius:4px;outline:none;font-family:inherit;display:${q.type === "open_ended" ? "" : "none"};">
                  ${Object.entries(validationLabels).map(([v, l]) => `<option value="${v}" ${(q.validation || "none") === v ? "selected" : ""}>${l}</option>`).join("")}
                </select>
              </div>
              <input type="text" class="q-title" value="${escHtml(q.title)}" placeholder="Soruyu yazın..." style="width:100%;padding:8px 12px;font-size:14px;border:1px solid #e2e4e9;border-radius:6px;outline:none;font-family:inherit;font-weight:500;" />
              <div class="q-options-container" style="${q.type === "open_ended" ? 'display:none;' : 'margin-top:8px;'}">
                ${optionsHtml}

    function addQuestion() {
      const container = document.getElementById("questionsContainer");
      const qCount = container.querySelectorAll(".question-block").length;
      container.insertAdjacentHTML("beforeend", renderQuestionBlock({ type: "open_ended", title: "", required: true, options: [] }, qCount));
    }

    function removeQuestion(btn) {
      const block = btn.closest(".question-block");
      const container = document.getElementById("questionsContainer");
      if (container.querySelectorAll(".question-block").length <= 1) return;
      block.remove();
      reindexQuestions();
    }

    function reindexQuestions() {
      const container = document.getElementById("questionsContainer");
      container.querySelectorAll(".question-block").forEach((block, i) => {
        const label = block.querySelector("span:first-child");
        if (label) label.textContent = "Soru " + (i + 1);
      });
    }

    function changeQuestionType(sel) {
      const block = sel.closest(".question-block");
      const container = block.querySelector(".q-options-container");
      const validation = block.querySelector(".q-validation");
      if (!container) return;
      const isOpen = sel.value === "open_ended";
      container.style.display = isOpen ? "none" : "block";
      if (validation) validation.style.display = isOpen ? "" : "none";
      if (sel.value === "likert") {
        const placeholder = container.querySelector(".options-placeholder, p");
        const addBtn = container.querySelector(".add-option-btn");
        if (placeholder) placeholder.remove();
        const existingMsg = container.querySelector(".likert-info");
        if (!existingMsg) {
          const info = document.createElement("p");
          info.className = "likert-info";
          info.style.cssText = "font-size:12px;color:#aaa;margin-top:4px;";
          info.textContent = "Dereceli sorular 1 (En Düşük) - 5 (En Yüksek) arası otomatik puanlanır.";
          container.insertBefore(info, addBtn);
        }
        container.querySelectorAll(".q-option").forEach((el) => el.closest("div")?.remove());
      }
    }

    function changeValidationType(sel) {
    }

    function addOption(btn) {
      const container = btn.closest(".q-options-container");
      if (!container) return;
      const placeholder = container.querySelector(".options-placeholder");
      if (placeholder) placeholder.remove();
      const optionCount = container.querySelectorAll(".q-option").length;
      const div = document.createElement("div");
      div.style.cssText = "display:flex;gap:8px;align-items:center;margin-top:6px;";
      div.innerHTML = `
        <input type="text" class="q-option" value="" style="flex:1;padding:8px 12px;font-size:13px;border:1px solid #e2e4e9;border-radius:6px;outline:none;font-family:inherit;" placeholder="Seçenek ${optionCount + 1}" />
        <button class="btn-icon btn-icon-danger" onclick="removeOption(this)" style="width:28px;height:28px;font-size:12px;"><i class="fa-solid fa-xmark"></i></button>
      `;
      container.insertBefore(div, btn);
      div.querySelector(".q-option").focus();
    }

    function removeOption(btn) {
      btn.closest("div").remove();
    }

    function collectSurveyData() {
      const questions = [];
      document.querySelectorAll(".question-block").forEach((block) => {
        const title = block.querySelector(".q-title")?.value?.trim();
        if (!title) return;
        const type = block.querySelector(".q-type")?.value || "open_ended";
        const required = block.querySelector(".q-required")?.checked !== false;
        const validation = block.querySelector(".q-validation")?.value || "none";
        const options = [];
        if (type !== "open_ended") {
          block.querySelectorAll(".q-option").forEach((o) => {
            const v = o.value.trim();
            if (v) options.push(v);
          });
        }
        questions.push({ title, type, required, validation, options });
      });
      return {
        title: document.getElementById("svTitle")?.value?.trim(),
        description: document.getElementById("svDesc")?.value?.trim(),
        targetType: document.getElementById("svTargetType")?.value || "all",
        targetGroup: document.getElementById("svTargetGroup")?.value || null,
        targetUsers: (document.getElementById("svTargetUsers")?.value || "").split(",").map((s) => s.trim()).filter(Boolean),
        expiresInDays: parseInt(document.getElementById("svExpiry")?.value) || 7,
        allowEdit: document.getElementById("svAllowEdit")?.value === "true",
        questions,
      };
    }

    function toggleTargetFields() {
      const type = document.getElementById("svTargetType")?.value;
      document.getElementById("svTargetGroupWrap").style.display = type === "group" ? "" : "none";
      document.getElementById("svTargetUsersWrap").style.display = type === "users" ? "" : "none";
    }

    async function saveSurvey() {
      const data = collectSurveyData();
      const msg = document.getElementById("surveyMessage");
      if (!data.title) {
        msg.textContent = "Anket başlığı gerekli.";
        msg.className = "message error show";
        return;
      }
      if (data.questions.length === 0) {
        msg.textContent = "En az bir soru ekleyin.";
        msg.className = "message error show";
        return;
      }
      for (const q of data.questions) {
        if (!q.title) {
          msg.textContent = "Tüm sorulara başlık girin.";
          msg.className = "message error show";
          return;
        }
        if (q.type !== "open_ended" && q.options.length < 1) {
          msg.textContent = "Çoktan seçmeli ve dereceli sorulara en az bir seçenek ekleyin.";
          msg.className = "message error show";
          return;
        }
      }

      try {
        const method = editSurveyId ? "PUT" : "POST";
        const url = editSurveyId ? "/api/surveys/" + editSurveyId : "/api/surveys";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          renderAdminSurveys();
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      }
    }

    // ---- Survey Status (Admin) ----

    async function renderSurveyStatus(id) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">Yükleniyor...</div>';
      try {
        const [statusRes, responsesRes] = await Promise.all([
          fetch("/api/surveys/" + id + "/status", { headers: { Authorization: "Bearer " + token } }),
          fetch("/api/surveys/" + id + "/responses", { headers: { Authorization: "Bearer " + token } }),
        ]);
        if (!statusRes.ok || !responsesRes.ok) throw new Error();
        const status = await statusRes.json();
        const respData = await responsesRes.json();
        const survey = respData.survey;
        const responses = respData.responses;

        area.innerHTML = `
          <div class="content-header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h2>${escHtml(survey.title)}</h2>
              <p>${status.submitted} / ${status.total} yanıtlandı — Bitiş: ${new Date(survey.expiresAt).toLocaleDateString("tr-TR")}</p>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-ghost" style="width:auto;padding:10px 20px;font-size:13px;" onclick="renderAdminSurveys()"><i class="fa-solid fa-arrow-left"></i> Geri</button>
              <button class="btn btn-primary" style="width:auto;padding:10px 20px;font-size:13px;" onclick="exportSurveyCSV('${id}')"><i class="fa-solid fa-download"></i> CSV İndir</button>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">
            <div class="stat-card" style="border-color:#22c55e;">
              <div class="stat-icon" style="background:#22c55e15;color:#22c55e;"><i class="fa-solid fa-check"></i></div>
              <div class="stat-info">
                <div class="stat-value" style="color:#22c55e;">${status.submitted}</div>
                <div class="stat-label">Yanıtlayan</div>
              </div>
            </div>
            <div class="stat-card" style="border-color:#ef4444;">
              <div class="stat-icon" style="background:#ef444415;color:#ef4444;"><i class="fa-solid fa-clock"></i></div>
              <div class="stat-info">
                <div class="stat-value" style="color:#ef4444;">${status.total - status.submitted}</div>
                <div class="stat-label">Yanıtlamayan</div>
              </div>
            </div>
          </div>

          <div class="section-title"><i class="fa-solid fa-users"></i> Kullanıcı Durumu</div>
          <div class="users-table-wrapper">
            <table class="users-table">
              <thead>
                <tr>
                  <th>Okul</th>
                  <th>E-posta</th>
                  <th>Grup</th>
                  <th>Durum</th>
                  <th>Tarih</th>
                </tr>
              </thead>
              <tbody>
                ${status.users.length === 0
                  ? '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:40px;">Henüz kullanıcı yok.</td></tr>'
                  : status.users.map((u) => `
                    <tr>
                      <td class="cell-email">${escHtml(u.schoolName || "-")}</td>
                      <td class="cell-email">${escHtml(u.email)}</td>
                      <td><span class="ann-tag ${u.role}" style="font-size:10px;">${roleLabels[u.role] || u.role}</span></td>
                      <td>${u.submitted
                        ? '<span style="color:#22c55e;font-size:13px;"><i class="fa-solid fa-check-circle"></i> Yanıtladı</span>'
                        : '<span style="color:#ef4444;font-size:13px;"><i class="fa-solid fa-circle"></i> Yanıtlamadı</span>'}</td>
                      <td class="cell-date">${u.submittedAt ? new Date(u.submittedAt).toLocaleDateString("tr-TR") : "-"}</td>
                    </tr>
                  `).join("")}
              </tbody>
            </table>
          </div>

          ${responses.length > 0 ? `
            <div class="section-title"><i class="fa-solid fa-list"></i> Yanıtlar</div>
            ${responses.map((r) => `
              <div class="announcement-item" style="margin-bottom:10px;">
                <div style="font-size:12px;color:#888;margin-bottom:8px;">
                  <strong>${escHtml(r.schoolName || r.userEmail)}</strong> — ${new Date(r.submittedAt).toLocaleDateString("tr-TR")} ${new Date(r.submittedAt).toLocaleTimeString("tr-TR", {hour:"2-digit",minute:"2-digit"})}
                </div>
                ${(survey.questions || []).map((q) => {
                  const ans = r.answers?.find((a) => a.questionId === q.id);
                  return `
                    <div style="margin-bottom:6px;font-size:13px;">
                      <span style="color:#555;font-weight:500;">${escHtml(q.title)}</span><br/>
                      <span style="color:#1a1a2e;">${escHtml(ans ? ans.value : "-")}</span>
                    </div>
                  `;
                }).join("")}
              </div>
            `).join("")}
          ` : ""}
        `;
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">Durum yüklenirken hata oluştu.</div>';
      }
    }

    async function exportSurveyCSV(id) {
      try {
        const res = await fetch("/api/surveys/" + id + "/responses/export", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "anket-" + id + "-" + Date.now() + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch {
        alert("CSV indirilirken hata oluştu.");
      }
    }

    // ---- User Surveys ----

    async function renderUserSurveys() {
      const area = document.getElementById("contentArea");
      area.innerHTML = `
        <div class="content-header">
          <h2>Anketler</h2>
          <p>Size gönderilen anketleri görüntüleyin ve yanıtlayın.</p>
        </div>
        <div id="userSurveysContent" style="text-align:center;padding:40px;color:#aaa;">Yükleniyor...</div>
      `;
      try {
        const res = await fetch("/api/surveys", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const container = document.getElementById("userSurveysContent");
        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:60px 0;color:#ccc;"><i class="fa-solid fa-file-circle-question" style="font-size:48px;margin-bottom:16px;display:block;"></i><div style="font-size:14px;">Size atanmış aktif anket bulunmuyor.</div></div>';
          return;
        }
        container.innerHTML = '<div class="announcements-list">' + list.map((s) => {
          const expires = new Date(s.expiresAt).toLocaleDateString("tr-TR");
          return `
            <div class="announcement-item" style="display:flex;justify-content:space-between;align-items:center;gap:16px;">
              <div style="flex:1;">
                <h4>${escHtml(s.title)}</h4>
                ${s.description ? `<p>${escHtml(s.description)}</p>` : ''}
                <div class="ann-date" style="margin-top:4px;">Son: ${expires}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
                ${s.submitted
                  ? `<span style="font-size:12px;color:#22c55e;"><i class="fa-solid fa-check-circle"></i> Yanıtlandı</span>
                     ${s.canEdit ? `<button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:12px;" onclick="renderSurveyFill('${s.id}')"><i class="fa-solid fa-pen"></i> Düzelt</button>` : ''}`
                  : `<button class="btn btn-primary" style="width:auto;padding:8px 14px;font-size:12px;" onclick="renderSurveyFill('${s.id}')"><i class="fa-solid fa-pen-to-square"></i> Yanıtla</button>`}
              </div>
            </div>
          `;
        }).join('') + '</div>';
      } catch {
        document.getElementById("userSurveysContent").innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">Anketler yüklenirken hata oluştu.</div>';
      }
    }

    async function renderSurveyFill(id) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">Yükleniyor...</div>';
      try {
        const [surveyRes, myRespRes] = await Promise.all([
          fetch("/api/surveys/" + id, { headers: { Authorization: "Bearer " + token } }),
          fetch("/api/surveys/" + id + "/response", { headers: { Authorization: "Bearer " + token } }).catch(() => ({ ok: false })),
        ]);
        if (!surveyRes.ok) throw new Error();
        const survey = await surveyRes.json();
        let existingAnswers = [];
        if (myRespRes.ok) {
          const myResp = await myRespRes.json();
          existingAnswers = myResp.answers || [];
        }

        const questionsHtml = (survey.questions || []).map((q, i) => {
          const existing = existingAnswers.find((a) => a.questionId === q.id);
          const val = existing ? existing.value : "";
          const valLabels = { none: "", number: "Sadece sayı girin (örn: 12, 3, 45)", only_text: "Sadece metin girin (örn: açıklama, not)", uppercase: "Büyük harfle yazın (örn: İSTANBUL)", email: "Geçerli bir e-posta girin (örn: ornek@mail.com)", phone: "Geçerli bir telefon girin (örn: 05321234567)" };
          return `
            <div class="announcement-item" style="margin-bottom:12px;" data-qid="${q.id}" data-validation="${q.validation || "none"}" data-required="${q.required ? "true" : "false"}">
              <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;">
                <span style="font-weight:600;font-size:14px;color:#1a1a2e;">${i + 1}.</span>
                <div style="flex:1;">
                  <span style="font-weight:600;font-size:14px;color:#1a1a2e;">${escHtml(q.title)}</span>
                  ${q.required ? '<span style="color:#ef4444;font-size:12px;">*</span>' : ''}
                  ${q.validation && q.validation !== "none" ? `<span style="color:#888;font-size:11px;margin-left:8px;">(${valLabels[q.validation] || q.validation})</span>` : ''}
                </div>
              </div>
              ${q.type === "open_ended"
                ? `<textarea class="survey-answer" data-qid="${q.id}" data-validation="${q.validation || "none"}" style="width:100%;padding:10px 14px;font-size:14px;border:1px solid #e2e4e9;border-radius:8px;outline:none;font-family:inherit;min-height:80px;resize:vertical;" placeholder="${valLabels[q.validation] || "Cevabınız..."}">${escHtml(val)}</textarea>`
                : q.type === "multiple_choice"
                  ? `<div style="display:flex;flex-direction:column;gap:6px;">${(q.options || []).map((o, oi) => `
                    <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#444;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #e2e4e9;${val === o ? 'background:#f0f0ff;border-color:#6366f1;' : ''}">
                      <input type="radio" name="q_${q.id}" class="survey-answer-radio" data-qid="${q.id}" value="${escHtml(o)}" ${val === o ? "checked" : ""} style="accent-color:#6366f1;" />
                      ${escHtml(o)}
                    </label>
                  `).join("")}</div>`
                  : `<div style="display:flex;gap:8px;flex-wrap:wrap;">${[1,2,3,4,5].map((n) => `
                    <label style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;border-radius:8px;border:1px solid #e2e4e9;cursor:pointer;${val == n ? 'background:#f0f0ff;border-color:#6366f1;' : ''}">
                      <input type="radio" name="q_${q.id}" class="survey-answer-radio" data-qid="${q.id}" value="${n}" ${val == n ? "checked" : ""} style="accent-color:#6366f1;" />
                      <span style="font-size:12px;color:#888;">${n === 1 ? 'En Düşük' : n === 5 ? 'En Yüksek' : n}</span>
                    </label>
                  `).join("")}</div>`}
            </div>
          `;
        }).join("");

        area.innerHTML = `
          <div class="content-header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h2>${escHtml(survey.title)}</h2>
              ${survey.description ? `<p>${escHtml(survey.description)}</p>` : ''}
              <p style="font-size:12px;color:#888;margin-top:4px;">Son: ${new Date(survey.expiresAt).toLocaleDateString("tr-TR")}</p>
            </div>
            <button class="btn btn-ghost" style="width:auto;padding:10px 20px;font-size:13px;" onclick="renderUserSurveys()">
              <i class="fa-solid fa-arrow-left"></i> Geri
            </button>
          </div>
          <form id="surveyForm" onsubmit="return false;">
            ${questionsHtml}
            <div style="display:flex;gap:12px;margin-top:20px;">
              <button type="submit" class="btn btn-primary" style="width:auto;padding:12px 28px;font-size:14px;" onclick="submitSurvey('${id}')">
                <i class="fa-solid fa-paper-plane"></i> Gönder
              </button>
            </div>
            <div id="surveyFillMessage" class="message"></div>
          </form>
        `;
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">Anket yüklenirken hata oluştu.</div>';
      }
    }

    function validateAnswer(value, validation) {
      if (!value) return "";
      if (validation === "number" && !/^\d+$/.test(value)) return "Sadece sayı girin.";
      if (validation === "only_text" && /\d/.test(value)) return "Sadece metin girin, sayı kullanmayın.";
      if (validation === "uppercase" && value !== value.toUpperCase()) return "Büyük harfle yazın.";
      if (validation === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return "Geçerli bir e-posta girin.";
      if (validation === "phone" && !/^[\d\s\-()+]{7,15}$/.test(value)) return "Geçerli bir telefon numarası girin.";
      return "";
    }

    async function submitSurvey(id) {
      const msg = document.getElementById("surveyFillMessage");
      if (!msg) { console.error("surveyFillMessage bulunamadi"); return; }
      const answers = [];

      try {
        document.querySelectorAll("[data-qid]").forEach((block) => {
          const qid = block.dataset.qid;
          const textarea = block.querySelector(".survey-answer");
          if (textarea) {
            answers.push({ questionId: qid, value: textarea.value.trim() });
            return;
          }
          const radio = block.querySelector(".survey-answer-radio:checked");
          if (radio) {
            answers.push({ questionId: qid, value: radio.value });
          }
        });

        const requiredMissing = Array.from(document.querySelectorAll("[data-qid]")).some((block) => {
          const qid = block.dataset.qid;
          if (block.dataset.required !== "true") return false;
          const ans = answers.find((a) => a.questionId === qid);
          return !ans || !ans.value;
        });

        if (requiredMissing) {
          msg.textContent = "Zorunlu soruları yanıtlayın.";
          msg.className = "message error show";
          return;
        }

        for (const block of document.querySelectorAll("[data-qid]")) {
          const qid = block.dataset.qid;
          const validation = block.dataset.validation;
          if (!validation || validation === "none") continue;
          const ans = answers.find((a) => a.questionId === qid);
          if (ans && ans.value) {
            const err = validateAnswer(ans.value, validation);
            if (err) {
              msg.textContent = err;
              msg.className = "message error show";
              return;
            }
          }
        }

        const res = await fetch("/api/surveys/" + id + "/respond", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ answers }),
        });
        if (res.ok) {
          msg.textContent = "Yanıtlarınız kaydedildi!";
          msg.className = "message success show";
          setTimeout(() => renderUserSurveys(), 1000);
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch (e) {
        console.error("submitSurvey hatasi:", e);
        msg.textContent = "Bir hata oluştu: " + (e.message || "bilinmeyen hata");
        msg.className = "message error show";
      }
    }

    init();
  </script>
</body>
</html>
