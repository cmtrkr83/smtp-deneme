<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <title> KODM PANEL </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="dashboard-body">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="/assets/logo-kodm.png" alt="KODM" style="width:64px;height:64px;flex-shrink:0;border:none;background:none;box-shadow:none;border-radius:0;" />
        <div class="logo-text">
          KOCAELİ ODM
          <small>Yönetim Paneli</small>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="mobileLogoutBtn" style="display:none;">
          <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div style="flex:1"></div>
        <div class="topbar-user">
          <div class="avatar" id="userAvatar">K</div>
          <div>
            <div class="user-name" id="userName">Yükleniyor...</div>
            <div class="user-role" id="userRole">-</div>
            <div class="session-timer" id="sessionTimer" style="font-size:10px;color:#888;margin-top:1px;"></div>
          </div>
        </div>
        <div class="role-switcher" id="roleSwitcher" style="display:none;margin-right:12px;">
          <select id="roleSwitcherSelect" onchange="switchActiveRole(this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid #d1d5db;background:#fff;font-size:13px;cursor:pointer;"></select>
        </div>
        <button class="btn-logout" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Çıkış
        </button>
      </header>

      <!-- Content -->
      <div class="content-area" id="contentArea">
        <!-- Dynamic content loaded here -->
      </div>
    </div>
  </div>

  <!-- File Request Modal -->
  <div class="modal-overlay" id="frModal" style="display:none" onclick="if(event.target===this)closeFrModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 id="frModalTitle">Dosya Talebi Oluştur</h3>
        <button class="modal-close" onclick="closeFrModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Başlık</label>
          <input type="text" id="frTitle" class="form-control" placeholder="Dosya talebi başlığı" />
        </div>
        <div class="form-group">
          <label>Açıklama</label>
          <textarea id="frDescription" class="form-control" style="resize:vertical;min-height:60px;padding:10px 14px;" placeholder="İsteğe bağlı açıklama"></textarea>
        </div>
        <div class="form-group">
          <label>Hedef</label>
          <select id="frTargetType" class="form-control">
            <option value="all">Tüm Kullanıcılar</option>
            <option value="group">Grup</option>
            <option value="users">Belirli Kullanıcılar</option>
          </select>
        </div>
        <div class="form-group" id="frTargetGroup" style="display:none;">
          <label>Grup Seçin</label>
          <select id="frTargetGroupSelect" class="form-control">
            <option value="lise">Lise Grubu</option>
            <option value="ortaokul">Ortaokul Grubu</option>
            <option value="diger">Diğer</option>
          </select>
        </div>
        <div class="form-group" id="frTargetUsers" style="display:none;">
          <label>Kullanıcı E-postaları (virgülle ayırın)</label>
          <input type="text" id="frTargetUsersInput" class="form-control" placeholder="ornek1@mail.com, ornek2@mail.com" />
        </div>
        <div class="form-group">
          <label>Teslim Süresi (gün)</label>
          <input type="number" id="frExpiresDays" class="form-control" value="7" min="1" max="365" />
        </div>
        <div id="frMessage" class="message"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" style="width:auto;" onclick="closeFrModal()">İptal</button>
        <button class="btn btn-primary" style="width:auto;background:#8b0000;border-color:#8b0000;" id="frSaveBtn" onclick="saveFr()">Oluştur</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "/login.html";
    }

    let currentUser = null;
    let activeRole = null;
    let dashboardData = null;

    function asRoleQuery() {
      if (!activeRole) return "";
      return activeRole !== currentUser.role ? "?asRole=" + activeRole : "";
    }

    function buildSidebar(role) {
      const nav = document.getElementById("sidebarNav");
      const items = [];

      const allItems = [
        { page: "dashboard", icon: "fa-gauge-high", label: "Genel Bakış", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "users", icon: "fa-users", label: "Kullanıcılar", roles: ["admin"] },
        { page: "announcements", icon: "fa-bullhorn", label: "Duyurular", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "surveys", icon: "fa-square-poll-vertical", label: "Anketler", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "files", icon: "fa-folder-open", label: "Dosya Dağıtım", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "file-requests", icon: "fa-file-arrow-up", label: "Belge İstekleri", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "requests", icon: "fa-paper-plane", label: "Talep/İtiraz", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "logs", icon: "fa-clipboard-list", label: "Log Kayıtları", roles: ["admin"] },
        { separator: true, roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "school-profile", icon: "fa-school", label: "Okul Bilgilerim", roles: ["lise", "ortaokul", "diger"] },
        { page: "schools", icon: "fa-school", label: "Okullar", roles: ["admin"] },
        { page: "reports", icon: "fa-chart-bar", label: "Raporlar", roles: ["admin"] },
        { page: "settings", icon: "fa-sliders", label: "Ayarlar", roles: ["admin"] },
      ];

      allItems.forEach((item) => {
        if (!item.roles.includes(role)) return;
        if (item.separator) {
          items.push('<div class="nav-section-title">İşlemler</div>');
          return;
        }
        items.push(`<button class="nav-item" data-page="${item.page}"><i class="fa-solid ${item.icon}"></i> ${item.label}</button>`);
      });

      nav.innerHTML = items.join("");

      // Re-bind click events
      nav.querySelectorAll(".nav-item").forEach((item) => {
        item.addEventListener("click", () => {
          nav.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
          item.classList.add("active");
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("show");

    const page = item.dataset.page;
    if (page === "dashboard") renderDashboard();
    else if (page === "users") renderUsers();
    else if (page === "announcements") renderAnnouncements();
    else if (page === "logs") renderLogs();
    else if (page === "schools") renderSchools();
    else if (page === "school-profile") { showSchoolProfileForm(); document.querySelector('.nav-item.active')?.classList.remove('active'); }
    else if (page === "surveys") { renderSurveys(); }
    else if (page === "files") { renderFiles(); }
    else if (page === "file-requests") { renderFileRequests(); }
    else if (page === "requests") { renderRequests(); }
    else if (page === "reports") { renderReports(); }
    else renderPlaceholder(page);
        });
      });
    }

    const roleLabels = {
      admin: "Sistem Yöneticisi",
      lise: "Lise Grubu",
      ortaokul: "Ortaokul Grubu",
      diger: "Diğer",
    };

    // Sidebar toggle
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarBackdrop").classList.toggle("show");
    });
    document.getElementById("sidebarBackdrop").addEventListener("click", () => {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarBackdrop").classList.remove("show");
    });

    // Logout
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("mobileLogoutBtn")?.addEventListener("click", logout);

    window.switchActiveRole = async function (newRole) {
      activeRole = newRole;
      const lb = roleLabels;
      document.getElementById("userRole").textContent = lb[newRole] || newRole;
      try {
        const res = await fetch("/api/dashboard" + (newRole !== currentUser.role ? "?asRole=" + newRole : ""), {
          headers: { Authorization: "Bearer " + token },
        });
        if (res.ok) dashboardData = await res.json();
      } catch {}
      const activePage = document.querySelector(".nav-item.active");
      if (activePage) {
        const page = activePage.dataset.page;
        if (page === "dashboard") renderDashboard();
        else if (page === "announcements") renderAnnouncements();
        else if (page === "files") renderFiles();
        else if (page === "file-requests") renderFileRequests();
        else if (page === "surveys") renderSurveys();
        else if (page === "requests") renderRequests();
      }
    };

    // Fetch profile and dashboard data
    async function init() {
      try {
        const [profileRes, dashRes] = await Promise.all([
          fetch("/api/profile", { headers: { Authorization: "Bearer " + token } }),
          fetch("/api/dashboard" + asRoleQuery(), { headers: { Authorization: "Bearer " + token } }),
        ]);

        if (!profileRes.ok || !dashRes.ok) throw new Error("Unauthorized");

        currentUser = await profileRes.json();
        dashboardData = await dashRes.json();

        activeRole = currentUser.role;

        // Update topbar
        const initial = currentUser.email.charAt(0).toUpperCase();
        document.getElementById("userAvatar").textContent = initial;
        document.getElementById("userName").textContent = currentUser.email;
        document.getElementById("userRole").textContent = roleLabels[currentUser.role] || currentUser.role;

        // Role switcher
        const crossRoles = currentUser.crossRoles || [];
        if (crossRoles.length > 0) {
          const sel = document.getElementById("roleSwitcherSelect");
          const allRoles = [currentUser.role, ...crossRoles];
          const labels = { admin: "Sistem Yöneticisi", lise: "Lise Grubu", ortaokul: "Ortaokul Grubu", diger: "Diğer" };
          sel.innerHTML = "";
          allRoles.forEach((r) => {
            const opt = document.createElement("option");
            opt.value = r;
            opt.textContent = labels[r] || r;
            if (r === activeRole) opt.selected = true;
            sel.appendChild(opt);
          });
          document.getElementById("roleSwitcher").style.display = "";
        }

        startSessionTimer();

        buildSidebar(currentUser.role);

        const firstNav = document.querySelector(".nav-item");
        if (firstNav) firstNav.click();
        else renderDashboard();
      } catch {
        localStorage.removeItem("token");
        window.location.href = "/login.html";
      }
    }

    function renderDashboard() {
      const area = document.getElementById("contentArea");
      const data = dashboardData;
      if (!data) return;

      const roleLabel = roleLabels[data.role] || data.role;

      let html = `
        <div class="content-header">
          <h2>Genel Bakış</h2>
          <p>${roleLabel} paneline hoş geldiniz.</p>
        </div>
      `;

      // Stats
      if (data.stats) {
        html += `<div class="stats-grid">`;
        data.stats.forEach((s) => {
          html += `
            <div class="stat-card">
              <div class="stat-icon" style="background:${s.color}15;color:${s.color}">
                <i class="fa-solid ${s.icon}"></i>
              </div>
              <div class="stat-info">
                <div class="stat-value">${s.value}</div>
                <div class="stat-label">${s.label}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // Links
      if (data.links) {
        html += `<div class="section-title"><i class="fa-solid fa-link"></i> Hızlı Erişim</div>`;
        html += `<div class="cards-grid" id="quickLinks">`;
        const cardColors = [
          { bg: "rgba(59, 130, 246, 0.1)", color: "#2563eb" },
          { bg: "rgba(16, 185, 129, 0.1)", color: "#059669" },
          { bg: "rgba(245, 158, 11, 0.1)", color: "#d97706" },
          { bg: "rgba(139, 92, 246, 0.1)", color: "#7c3aed" },
          { bg: "rgba(236, 72, 153, 0.1)", color: "#db2777" },
          { bg: "rgba(14, 165, 233, 0.1)", color: "#0284c7" },
        ];
        data.links.forEach((l, i) => {
          const isNav = l.url.startsWith("/navigate/");
          const badge = l.badge > 0 ? `<span class="card-badge">${l.badge}</span>` : "";
          let hlStyle = "", iconBg = cardColors[i % cardColors.length];
          if (l.highlight) {
            hlStyle = 'background:#dc2626;border:2px solid #b91c1c;';
            iconBg = { bg: "#fff", color: "#dc2626" };
          }
          html += `
            <a href="${isNav ? 'javascript:void(0)' : l.url}" class="link-card${l.highlight ? ' highlight' : ''}" data-nav="${isNav ? l.url.replace('/navigate/', '') : ''}" style="${hlStyle}">
              <div class="card-icon" style="background:${iconBg.bg};color:${iconBg.color};"><i class="fa-solid ${l.icon}"></i>${badge}</div>
              ${l.highlight ? '<h4 style="color:#fff;">' + l.title + '</h4>' : '<h4>' + l.title + '</h4>'}
              ${l.highlight ? '<p style="color:#fca5a5;">' + l.desc + '</p>' : '<p>' + l.desc + '</p>'}
            </a>
          `;
        });
        html += `</div>`;
      }

      // Announcements (only for admin)
      if (currentUser.role === "admin" && data.announcements && data.announcements.length > 0) {
        html += `<div class="section-title"><i class="fa-solid fa-bullhorn"></i> Duyurular</div>`;
        html += `<div class="announcements-list">`;
        const targetLabels = { all: "Tümü", lise: "Lise", ortaokul: "Ortaokul", diger: "Diğer" };
        data.announcements.forEach((a) => {
          const isRead = a.read;
          const date = new Date(a.createdAt).toLocaleDateString("tr-TR");
          html += `
            <div class="announcement-item" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
              <div style="flex:1;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                  <span class="ann-tag ${a.target}">${targetLabels[a.target] || a.target}</span>
                  ${isRead
                    ? '<span style="font-size:11px;color:#16a34a;"><i class="fa-solid fa-check"></i> Okundu</span>'
                    : '<span style="font-size:11px;color:#d97706;"><i class="fa-solid fa-circle"></i> Okunmadı</span>'}
                </div>
                <h4>${a.title}</h4>
                <p>${a.content}</p>
                <div class="ann-date">${date}</div>
              </div>
              ${!isRead ? `<button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:12px;flex-shrink:0;" onclick="markAsRead('${a.id}')"><i class="fa-solid fa-check"></i> Okundu İşaretle</button>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      area.innerHTML = html;

      // Quick link navigation
      document.querySelectorAll("#quickLinks .link-card[data-nav]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          const page = el.dataset.nav;
          const navBtn = document.querySelector(`.nav-item[data-page="${page}"]`);
          if (navBtn) navBtn.click();
        });
      });
    }

    function escHtml(s) {
      if (!s) return "";
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    let sessionTimerInterval = null;

    function parseJwt(token) {
      try {
        return JSON.parse(atob(token.split(".")[1]));
      } catch (_) {
        return null;
      }
    }

    function startSessionTimer() {
      const decoded = parseJwt(token);
      if (!decoded || !decoded.exp) return;
      const el = document.getElementById("sessionTimer");
      if (!el) return;

      clearInterval(sessionTimerInterval);

      function update() {
        const remaining = decoded.exp * 1000 - Date.now();
        if (remaining <= 0) {
          el.textContent = "Oturum süresi doldu";
          el.style.color = "#ef4444";
          clearInterval(sessionTimerInterval);
          setTimeout(() => { localStorage.removeItem("token"); window.location.href = "/login.html"; }, 2000);
          return;
        }
        const totalSec = Math.floor(remaining / 1000);
        const min = String(Math.floor(totalSec / 60)).padStart(2, "0");
        const sec = String(totalSec % 60).padStart(2, "0");
        el.textContent = "Kalan süre: " + min + ":" + sec;
        el.style.color = totalSec < 60 ? "#ef4444" : totalSec < 300 ? "#f59e0b" : "#888";
      }

      update();
      sessionTimerInterval = setInterval(update, 1000);
    }

    async function markAsRead(id, source) {
      try {
        await fetch("/api/announcements/" + id + "/read", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
        });
        if (source === "announcements") {
          await renderSchoolAnnouncements();
        } else {
          const dashRes = await fetch("/api/dashboard" + asRoleQuery(), {
            headers: { Authorization: "Bearer " + token },
          });
          if (dashRes.ok) {
            dashboardData = await dashRes.json();
            renderDashboard();
          }
        }
      } catch {}
    }

    function renderPlaceholder(page) {
      const area = document.getElementById("contentArea");
      const titles = {
        users: "Kullanıcı Yönetimi",
        announcements: "Duyuru Yönetimi",
        logs: "Log Kayıtları",
        schools: "Okul Yönetimi",
        reports: "Raporlar",
        settings: "Ayarlar",
      };
      if (page === "users") { renderUsers(); return; }
      if (page === "announcements") { renderAnnouncements(); return; }
      if (page === "logs") { renderLogs(); return; }
      if (page === "schools") { renderSchools(); return; }
      area.innerHTML = `
        <div class="content-header">
          <h2>${titles[page] || page}</h2>
          <p>Bu bölüm hazırlanıyor.</p>
        </div>
        <div style="text-align:center;padding:60px 0;color:#ccc;">
          <i class="fa-solid fa-wrench" style="font-size:48px;margin-bottom:16px;display:block;"></i>
          <div style="font-size:14px;">Sayfa yapım aşamasındadır.</div>
        </div>
      `;
    }

    // ---- User Management ----

    async function renderUsers() {
      const area = document.getElementById("contentArea");
      area.innerHTML = `
        <div class="content-header" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h2>Kullanıcı Yönetimi</h2>
            <p>Sisteme erişebilecek kullanıcıları yönetin.</p>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" style="width:auto;padding:10px 20px;font-size:13px;" onclick="showAddUserModal()">
              <i class="fa-solid fa-plus"></i> Kullanıcı Ekle
            </button>
            <button class="btn btn-ghost" style="width:auto;padding:10px 20px;font-size:13px;" onclick="showImportModal()">
              <i class="fa-solid fa-file-excel"></i> Excel'den Yükle
            </button>
            <button class="btn btn-danger" style="width:auto;padding:10px 20px;font-size:13px;" onclick="showClearModal()">
              <i class="fa-solid fa-trash-can"></i> Tümünü Sil
            </button>
          </div>
        </div>
        <div class="users-table-wrapper">
          <table class="users-table">
            <thead>
              <tr>
                <th>E-posta</th>
                <th>Rol</th>
                <th>Ek Gruplar</th>
                <th>Kayıt Tarihi</th>
                <th>Son Giriş</th>
                <th style="text-align:right;">İşlemler</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="6" style="text-align:center;color:rgba(255,255,255,0.2);padding:40px;">Yükleniyor...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="usersPagination" style="display:flex;align-items:center;justify-content:center;gap:4px;padding:16px 0;"></div>
        <div class="modal-overlay" id="userModal" style="display:none" onclick="if(event.target===this)closeUserModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 id="modalTitle">Kullanıcı Ekle</h3>
              <button class="modal-close" onclick="closeUserModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label for="modalEmail">E-posta Adresi</label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-envelope icon"></i>
                  <input type="email" id="modalEmail" class="form-control" placeholder="ornek@mail.com" />
                </div>
              </div>
              <div class="form-group">
                <label for="modalRole">Rol</label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-user-tag icon"></i>
                  <select id="modalRole" class="form-control" style="padding-left:44px;-webkit-appearance:none;appearance:none;">
                    <option value="admin">Sistem Yöneticisi</option>
                    <option value="lise">Lise Grubu</option>
                    <option value="ortaokul">Ortaokul Grubu</option>
                    <option value="diger">Diğer</option>
                  </select>
                </div>
              </div>
              <div id="modalMessage" class="message"></div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" style="width:auto;" onclick="closeUserModal()">İptal</button>
              <button class="btn btn-primary" style="width:auto;" id="modalSaveBtn" onclick="saveUser()">Kaydet</button>
            </div>
          </div>
        </div>
        <div class="modal-overlay" id="deleteModal" style="display:none" onclick="if(event.target===this)closeDeleteModal()">
          <div class="modal" style="max-width:400px;">
            <div class="modal-header">
              <h3>Kullanıcıyı Sil</h3>
              <button class="modal-close" onclick="closeDeleteModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
              <p style="color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:8px;">
                <span id="deleteEmail" style="color:#fff;font-weight:500;"></span> kullanıcısını silmek istediğinize emin misiniz?
              </p>
              <div id="deleteMessage" class="message"></div>
            </div>
            <div class="modal-footer">

    let usersPage = 1;
    let usersAll = [];
    const USERS_PAGE_SIZE = 25;

    function goToUsersPage(page) {
      const total = Math.max(1, Math.ceil(usersAll.length / USERS_PAGE_SIZE));
      usersPage = Math.max(1, Math.min(total, page));
      renderUsersTable();
    }

    function renderUsersPagination() {
      const totalPages = Math.max(1, Math.ceil(usersAll.length / USERS_PAGE_SIZE));
      const nav = document.getElementById("usersPagination");
      if (!nav) return;
      if (totalPages <= 1) { nav.innerHTML = ""; return; }
      let html = "";
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(1)" ' + (usersPage === 1 ? 'disabled' : '') + '><i class="fa-solid fa-angles-left"></i></button>';
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(' + (usersPage - 1) + ')" ' + (usersPage === 1 ? 'disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>';
      html += '<span style="font-size:13px;color:#666;padding:0 8px;">' + usersPage + " / " + totalPages + "</span>";
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(' + (usersPage + 1) + ')" ' + (usersPage === totalPages ? 'disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>';
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(' + totalPages + ')" ' + (usersPage === totalPages ? 'disabled' : '') + '><i class="fa-solid fa-angles-right"></i></button>';
      html += '<span style="font-size:12px;color:#999;margin-left:12px;">' + usersAll.length + " kullanıcı</span>";
      nav.innerHTML = html;
    }

    function renderUsersTable() {
      const tbody = document.getElementById("usersTableBody");
      const start = (usersPage - 1) * USERS_PAGE_SIZE;
      const pageUsers = usersAll.slice(start, start + USERS_PAGE_SIZE);
      tbody.innerHTML = pageUsers.map((u) => {
        const created = u.created ? new Date(u.created).toLocaleDateString("tr-TR") : "-";
        const lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleDateString("tr-TR") + " " + new Date(u.lastLogin).toLocaleTimeString("tr-TR", {hour:"2-digit",minute:"2-digit"}) : "-";
        const canDelete = u.email !== currentUser.email;
        return `
          <tr>
            <td class="cell-email">${u.email}</td>
            <td>
                <select class="role-select" data-email="${u.email}" onchange="updateRole('${u.email}',this.value)">
                  <option value="admin" ${u.role==="admin"?"selected":""}>Sistem Yöneticisi</option>
                  <option value="lise" ${u.role==="lise"?"selected":""}>Lise Grubu</option>
                  <option value="ortaokul" ${u.role==="ortaokul"?"selected":""}>Ortaokul Grubu</option>
                  <option value="diger" ${u.role==="diger"?"selected":""}>Diğer</option>
                </select>
            </td>
            <td style="font-size:12px;">
              <div style="display:flex;flex-wrap:wrap;gap:4px 12px;">
              ${["lise","ortaokul","diger"].filter(r => r !== u.role).map(r => {
                const checked = (u.crossRoles||[]).includes(r) ? "checked" : "";
                return '<label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;white-space:nowrap;"><input type="checkbox" ' + checked + ' onchange="toggleCrossRole(\'' + u.email + '\',\'' + r + '\',this.checked)" style="margin:0;vertical-align:middle;"> <span>' + (r==="lise"?"Lise":r==="ortaokul"?"Ortaokul":"Diğer") + '</span></label>';
              }).join("")}
              </div>
            </td>
            <td class="cell-date">${created}</td>
            <td class="cell-date">${lastLogin}</td>
            <td class="cell-actions">
              ${canDelete ? `<button class="btn-icon btn-icon-danger" onclick="showDeleteModal('${u.email}')" title="Sil"><i class="fa-solid fa-trash-can"></i></button>` : '<span style="color:#aaa;font-size:12px;">(siz)</span>'}
            </td>
          </tr>
        `;
      }).join("");
      renderUsersPagination();
    }

      try {

    async function saveUser() {
      const email = document.getElementById("modalEmail").value.trim();
      const role = document.getElementById("modalRole").value;
      const msg = document.getElementById("modalMessage");
      const btn = document.getElementById("modalSaveBtn");

      if (!email) {
        msg.textContent = "E-posta adresi girin.";
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      btn.textContent = " Kaydediliyor...";

      try {
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ email, role }),
        });
        const data = await res.json();
        if (res.ok) {
          closeUserModal();
          await loadUsersTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        btn.textContent = "Kaydet";
      }
    }

    async function updateRole(email, role) {
      try {
        await fetch("/api/users/" + encodeURIComponent(email), {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ role }),
        });
      } catch {}
    }

    window.toggleCrossRole = async function (email, role, add) {
      try {
        const res = await fetch("/api/users/" + encodeURIComponent(email), {
          method: "GET",
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) return;
        const user = await res.json();
        let crossRoles = user.crossRoles || [];
        if (add) {
          if (!crossRoles.includes(role)) crossRoles.push(role);
        } else {
          crossRoles = crossRoles.filter((r) => r !== role);
        }
        await fetch("/api/users/" + encodeURIComponent(email), {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ crossRoles }),
        });
      } catch {}
    };

    async function importUsers() {
      const fileInput = document.getElementById("importFileInput");
      const msg = document.getElementById("importMessage");
      const btn = document.getElementById("importBtn");
      const resultDiv = document.getElementById("importResult");

      if (!fileInput.files || !fileInput.files[0]) {
        msg.className = "message error show";
        msg.textContent = "Lütfen bir Excel dosyası seçin.";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor...';
      msg.className = "message";
      msg.textContent = "";

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const res = await fetch("/api/users/import", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          resultDiv.style.display = "block";

            + '<div style="font-size:12px;color:#888;">' + data.updated + ' kullanıcı güncellendi</div></div></div>';
          if (data.errors && data.errors.length > 0) {
            resultDiv.innerHTML += '<div style="margin-top:8px;font-size:12px;color:#ef4444;">Hatalar: ' + data.errors.join(", ") + '</div>';
          }
          btn.textContent = ' Yükle';
          btn.disabled = false;
          loadUsersTable();
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Yükleme başarısız.";
          btn.innerHTML = '<i class="fa-solid fa-upload"></i> Yükle';
          btn.disabled = false;
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata oluştu: " + e.message;
        btn.innerHTML = '<i class="fa-solid fa-upload"></i> Yükle';
        btn.disabled = false;
      }

    async function editAnn(id) {
      try {
        const res = await fetch("/api/announcements" + asRoleQuery(), {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const ann = list.find((a) => a.id === id);
        if (!ann) return;
        editingAnnId = id;
        document.getElementById("annModalTitle").textContent = "Duyuru Düzenle";
        document.getElementById("annSaveBtn").textContent = "Güncelle";
        document.getElementById("annTitle").value = ann.title;
        document.getElementById("annContent").value = ann.content;
        document.getElementById("annTarget").value = ann.target;
        const remainingDays = Math.ceil((ann.expiresAt - Date.now()) / (24 * 60 * 60 * 1000));
        document.getElementById("annExpiry").value = Math.max(1, remainingDays);
        document.getElementById("annModalMessage").textContent = "";
        document.getElementById("annModalMessage").className = "message";
        document.getElementById("annModal").style.display = "flex";
        setTimeout(() => document.getElementById("annTitle").focus(), 100);
      } catch {}
    }

    async function saveAnnouncement() {
      const title = document.getElementById("annTitle").value.trim();
      const content = document.getElementById("annContent").value.trim();
      const target = document.getElementById("annTarget").value;
      const expiresInDays = parseInt(document.getElementById("annExpiry").value) || 7;
      const msg = document.getElementById("annModalMessage");
      const btn = document.getElementById("annSaveBtn");

      if (!title || !content) {
        msg.textContent = "Başlık ve içerik gerekli.";
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      btn.textContent = " Kaydediliyor...";

      try {
        const method = editingAnnId ? "PUT" : "POST";
        const url = editingAnnId ? "/api/announcements/" + editingAnnId : "/api/announcements";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ title, content, target, expiresInDays }),
        });
        const data = await res.json();
        if (res.ok) {
          closeAnnModal();
          await loadAnnouncementsTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        btn.textContent = editingAnnId ? "Güncelle" : "Kaydet";
      }
    }

          headers: { Authorization: "Bearer " + token },
        });
        await loadAnnouncementsTable();
      } catch {}
    }

    function getActionColor(action) {
      const colors = {
        login: "#22c55e",
        otp_request: "#6366f1",
        user_create: "#22c55e",
        user_delete: "#ef4444",
        user_role_change: "#f59e0b",
        announcement_create: "#22c55e",
        announcement_edit: "#f59e0b",
        announcement_delete: "#ef4444",
        announcement_read: "#6366f1",
      };
      return colors[action] || "#888";

    async function exportLogs() {
      try {
        const res = await fetch("/api/logs/export", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "sistem-log-" + Date.now() + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch {
        alert("Loglar indirilirken hata oluştu.");

    }

        });

        const list = await res.json();
        if (list.length === 0) {

          return;
        }
        tbody.innerHTML = list.map((f) => {
          const now = Date.now();
          const starts = new Date(f.startsAt).toLocaleDateString("tr-TR");

    async function uploadFile() {
      const msg = document.getElementById("uploadMsg");
      const fileInput = document.getElementById("fileInput");
      const desc = document.getElementById("fileDesc");
      const startsAt = document.getElementById("fileStartsAt");
      const expiresAt = document.getElementById("fileExpiresAt");
      const targetType = document.getElementById("fileTargetType");
      const targetGroup = document.getElementById("fileTargetGroup");
      const targetUsers = document.getElementById("fileTargetUsers");

      if (!fileInput.files || !fileInput.files[0]) {
        msg.className = "message error show"; msg.textContent = "Lütfen bir ZIP dosyası seçin."; return;
      }
      if (!desc.value.trim()) {
        msg.className = "message error show"; msg.textContent = "Açıklama zorunlu."; return;
      }
      if (!startsAt.value) {
        msg.className = "message error show"; msg.textContent = "Başlangıç tarihi zorunlu."; return;
      }
      if (!expiresAt.value) {
        msg.className = "message error show"; msg.textContent = "Bitiş tarihi zorunlu."; return;
      }
      if (new Date(startsAt.value).getTime() >= new Date(expiresAt.value).getTime()) {
        msg.className = "message error show"; msg.textContent = "Başlangıç tarihi bitiş tarihinden önce olmalıdır."; return;
      }
      if (fileInput.files[0].size > 10 * 1024 * 1024) {
        msg.className = "message error show"; msg.textContent = "Dosya boyutu 10 MB'i geçemez."; return;
      }
      if (!fileInput.files[0].name.toLowerCase().endsWith(".zip")) {
        msg.className = "message error show"; msg.textContent = "Sadece ZIP dosyası kabul edilir."; return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("description", desc.value.trim());
      formData.append("startsAt", new Date(startsAt.value).getTime());
      formData.append("expiresAt", new Date(expiresAt.value).getTime());
      formData.append("targetType", targetType.value);
      if (targetType.value === "group") formData.append("targetGroup", targetGroup.value);
      if (targetType.value === "users") formData.append("targetUsers", targetUsers.value);

      try {
        const res = await fetch("/api/files", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "message success show";
          msg.textContent = "Dosya başarıyla yüklendi!";
          setTimeout(() => renderAdminFiles(), 1000);
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Yükleme başarısız.";
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata oluştu: " + e.message;
      }
    }

      if (!confirm("Bu dosyayı silmek istediğinize emin misiniz?")) return;
      try {

    async function downloadFile(id) {
      try {
        const res = await fetch("/api/files/" + id + "/download", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || "Dosya indirilemedi.");
          return;
        }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const match = cd.match(/filename="?(.+?)"?$/);
        const filename = match ? match[1] : "dosya.zip";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("İndirme sırasında hata: " + e.message);
      }
    }

    async function submitRequest() {
      const msg = document.getElementById("createRequestMsg");
      const type = document.getElementById("reqType");
      const title = document.getElementById("reqTitle");
      const desc = document.getElementById("reqDesc");
      const docNo = document.getElementById("reqDocNo");
      const fileInput = document.getElementById("reqFile");

      if (!title.value.trim()) { msg.className = "message error show"; msg.textContent = "Baslik zorunlu."; return; }
      if (!desc.value.trim()) { msg.className = "message error show"; msg.textContent = "Aciklama zorunlu."; return; }
      if (fileInput.files[0] && fileInput.files[0].size > 10 * 1024 * 1024) {
        msg.className = "message error show"; msg.textContent = "Dosya boyutu 10 MB'i gecemez."; return;
      }

      const formData = new FormData();
      formData.append("type", type.value);
      formData.append("title", title.value.trim());
      formData.append("description", desc.value.trim());
      if (docNo.value.trim()) formData.append("officialDocNo", docNo.value.trim());
      if (fileInput.files[0]) formData.append("file", fileInput.files[0]);

      try {
        const res = await fetch("/api/requests", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "message success show";
          msg.textContent = "Talebiniz basariyla gonderildi!";
          setTimeout(() => renderUserRequests(), 1000);
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Gonderilemedi.";
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata olustu: " + e.message;
      }
    }

    async function deleteRequest(id, isUser) {
      if (!confirm("Bu talebi silmek istediginize emin misiniz?")) return;
      try {
        const res = await fetch("/api/requests/" + id, {

          alert(data.error || "Silinemedi.");
        }
      } catch (_) {}
    }

    async function downloadRequestAttachment(id) {
      try {
        const res = await fetch("/api/requests/" + id + "/attachment", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) { alert("Dosya indirilemedi."); return; }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const match = cd.match(/filename="?(.+?)"?$/);
        const filename = match ? match[1] : "dosya";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("Hata: " + e.message);
      }
    }

    function drawUserPieChart(users) {
      const canvas = document.getElementById("userPieChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      const cx = w / 2, cy = h / 2, r = 68;

      ctx.clearRect(0, 0, w, h);

      const segments = [
        { count: users.admin, color: "#6366f1", label: "Admin" },
        { count: users.lise, color: "#22c55e", label: "Lise" },
        { count: users.ortaokul, color: "#f59e0b", label: "Ortaokul" },
        { count: users.diger, color: "#ec4899", label: "Diğer" },
      ];
      const total = users.total || 1;
      let startAngle = -Math.PI / 2;

      segments.forEach((s) => {
        if (s.count === 0) return;
        const sliceAngle = (s.count / total) * 2 * Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        startAngle += sliceAngle;
      });

      // Center hole (donut)
      ctx.beginPath();
      ctx.arc(cx, cy, 36, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.fill();

      // Center text
      ctx.fillStyle = "#1a1a2e";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(total, cx, cy - 6);
      ctx.font = "10px sans-serif";
      ctx.fillStyle = "#888";
      ctx.fillText("Kullanıcı", cx, cy + 14);
    }

      try {

          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const targetLabels = { all: "Tümü", group: "Grup", users: "Özel" };
        tbody.innerHTML = list.map((s) => {
          const expired = s.expiresAt < Date.now();
          const targetStr = s.targetType === "group" ? (s.targetGroup === "lise" ? "Lise" : s.targetGroup === "ortaokul" ? "Ortaokul" : "Diğer") : targetLabels[s.targetType] || "Tümü";

          method: "DELETE",

      const isOpen = sel.value === "open_ended";

    }

    function collectSurveyData() {
      const questions = [];
      document.querySelectorAll(".question-block").forEach((block) => {
        const title = block.querySelector(".q-title")?.value?.trim();
        if (!title) return;
        const type = block.querySelector(".q-type")?.value || "open_ended";
        const required = block.querySelector(".q-required")?.checked !== false;
        const validation = block.querySelector(".q-validation")?.value || "none";
        const options = [];
        if (type !== "open_ended") {
          block.querySelectorAll(".q-option").forEach((o) => {
            const v = o.value.trim();
            if (v) options.push(v);
          });
        }
        questions.push({ title, type, required, validation, options });
      });
      return {
        title: document.getElementById("svTitle")?.value?.trim(),
        description: document.getElementById("svDesc")?.value?.trim(),
        targetType: document.getElementById("svTargetType")?.value || "all",
        targetGroup: document.getElementById("svTargetGroup")?.value || null,
        targetUsers: (document.getElementById("svTargetUsers")?.value || "").split(",").map((s) => s.trim()).filter(Boolean),
        expiresInDays: parseInt(document.getElementById("svExpiry")?.value) || 7,
        allowEdit: document.getElementById("svAllowEdit")?.value === "true",
        questions,
      };
    }

    function toggleTargetFields() {
      const type = document.getElementById("svTargetType")?.value;
      document.getElementById("svTargetGroupWrap").style.display = type === "group" ? "" : "none";
      document.getElementById("svTargetUsersWrap").style.display = type === "users" ? "" : "none";
    }

    async function saveSurvey() {
      const data = collectSurveyData();
      const msg = document.getElementById("surveyMessage");
      if (!data.title) {
        msg.textContent = "Anket başlığı gerekli.";
        msg.className = "message error show";
        return;
      }
      if (data.questions.length === 0) {
        msg.textContent = "En az bir soru ekleyin.";
        msg.className = "message error show";
        return;
      }
      for (const q of data.questions) {
        if (!q.title) {
          msg.textContent = "Tüm sorulara başlık girin.";
          msg.className = "message error show";
          return;
        }
        if (q.type !== "open_ended" && q.options.length < 1) {
          msg.textContent = "Çoktan seçmeli ve dereceli sorulara en az bir seçenek ekleyin.";
          msg.className = "message error show";
          return;
        }
      }

      try {
        const method = editSurveyId ? "PUT" : "POST";
        const url = editSurveyId ? "/api/surveys/" + editSurveyId : "/api/surveys";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          renderAdminSurveys();
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      }
    }

    function validateAnswer(value, validation) {
      if (!value) return "";
      if (validation === "number" && !/^\d+$/.test(value)) return "Sadece sayı girin.";
      if (validation === "only_text" && /\d/.test(value)) return "Sadece metin girin, sayı kullanmayın.";
      if (validation === "uppercase" && value !== value.toUpperCase()) return "Büyük harfle yazın.";
      if (validation === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return "Geçerli bir e-posta girin.";
      if (validation === "phone" && !/^[\d\s\-()+]{7,15}$/.test(value)) return "Geçerli bir telefon numarası girin.";
      return "";
    }

    async function submitSurvey(id) {
      const msg = document.getElementById("surveyFillMessage");
      if (!msg) { console.error("surveyFillMessage bulunamadi"); return; }
      const answers = [];

      try {
        document.querySelectorAll("[data-qid]").forEach((block) => {
          const qid = block.dataset.qid;
          const textarea = block.querySelector(".survey-answer");
          if (textarea) {
            answers.push({ questionId: qid, value: textarea.value.trim() });
            return;
          }
          const radio = block.querySelector(".survey-answer-radio:checked");
          if (radio) {
            answers.push({ questionId: qid, value: radio.value });
          }
        });

        const requiredMissing = Array.from(document.querySelectorAll("[data-qid]")).some((block) => {
          const qid = block.dataset.qid;
          if (block.dataset.required !== "true") return false;
          const ans = answers.find((a) => a.questionId === qid);
          return !ans || !ans.value;
        });

        if (requiredMissing) {
          msg.textContent = "Zorunlu soruları yanıtlayın.";
          msg.className = "message error show";
          return;
        }

        for (const block of document.querySelectorAll("[data-qid]")) {
          const qid = block.dataset.qid;
          const validation = block.dataset.validation;
          if (!validation || validation === "none") continue;
          const ans = answers.find((a) => a.questionId === qid);
          if (ans && ans.value) {
            const err = validateAnswer(ans.value, validation);
            if (err) {
              msg.textContent = err;
              msg.className = "message error show";
              return;
            }
          }
        }

        const res = await fetch("/api/surveys/" + id + "/respond", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ answers }),
        });
        if (res.ok) {
          msg.textContent = "Yanıtlarınız kaydedildi!";
          msg.className = "message success show";
          setTimeout(() => renderUserSurveys(), 1000);
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch (e) {
        console.error("submitSurvey hatasi:", e);
        msg.textContent = "Bir hata oluştu: " + (e.message || "bilinmeyen hata");
        msg.className = "message error show";
      }
    }

          return;
        }
        const targetLabels = { all: "Tümü", group: "Grup", users: "Özel" };
        container.innerHTML = list.map((fr) => {
          const expired = fr.expiresAt < Date.now();
          const targetStr = fr.targetType === "group" ? (fr.targetGroup === "lise" ? "Lise" : fr.targetGroup === "ortaokul" ? "Ortaokul" : "Diğer") : targetLabels[fr.targetType] || "Tümü";
          const subCount = fr.submissionCount || 0;
          return `
            <div class="announcement-item" style="cursor:pointer;${expired?'opacity:0.5;':''}" onclick="viewFrDetail('${fr.id}')">
              <span class="ann-tag ${fr.targetType}">${targetStr}</span>
              <h4>${escHtml(fr.title)}</h4>
              <p>${escHtml(fr.description) || "Açıklama yok"}</p>
              <span class="ann-date">${expired ? "Süresi doldu" : new Date(fr.expiresAt).toLocaleDateString("tr-TR")} · ${subCount} gönderi</span>
            </div>
          `;
        }).join("");
      } catch {
        document.getElementById("adminFrList").innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu.</div>';
      }
    }

    async function renderUserFileRequests() {
      const area = document.getElementById("contentArea");
      area.innerHTML = `
        <div class="content-header">
          <h2>Belge İstekleri</h2>
          <p>Yönetici tarafından istenen belgeleri görüntüleyin ve yükleyin.</p>
        </div>
        <div id="userFrList" style="text-align:center;padding:40px;color:#aaa;">Yükleniyor...</div>
      `;
      try {
        const res = await fetch("/api/file-requests" + asRoleQuery(), { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const container = document.getElementById("userFrList");
        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:60px 0;color:#ccc;"><i class="fa-solid fa-file-arrow-up" style="font-size:48px;margin-bottom:16px;display:block;"></i><div style="font-size:14px;">Size gönderilmiş dosya talebi bulunmuyor.</div></div>';
          return;
        }
        container.innerHTML = list.map((fr) => {
          const expired = fr.expiresAt < Date.now();
          return `
            <div class="announcement-item" style="cursor:pointer;${expired?'opacity:0.5;':''}" onclick="viewUserFrDetail('${fr.id}')">
              <span class="ann-tag ${fr.submitted ? 'all' : 'admin'}" style="${fr.submitted?'background:rgba(22,163,74,0.1);color:#16a34a;':'background:rgba(220,38,38,0.1);color:#dc2626;'}">${fr.submitted ? "Teslim Edildi" : "Bekliyor"}</span>
              <h4>${escHtml(fr.title)}</h4>
              <p>${escHtml(fr.description) || "Açıklama yok"}</p>
              <span class="ann-date">Son teslim: ${new Date(fr.expiresAt).toLocaleDateString("tr-TR")}</span>
            </div>
          `;
        }).join("");
      } catch {
        document.getElementById("userFrList").innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu.</div>';
      }
    }

    window.showCreateFrModal = function () {
      document.getElementById("frModalTitle").textContent = "Dosya Talebi Oluştur";
      document.getElementById("frSaveBtn").textContent = "Oluştur";
      document.getElementById("frTitle").value = "";
      document.getElementById("frDescription").value = "";
      document.getElementById("frTargetType").value = "all";
      document.getElementById("frTargetGroup").style.display = "none";
      document.getElementById("frTargetUsers").style.display = "none";
      document.getElementById("frExpiresDays").value = "7";
      document.getElementById("frMessage").textContent = "";
      document.getElementById("frMessage").className = "message";
      document.getElementById("frModal").style.display = "flex";
    };

    function closeFrModal() {
      document.getElementById("frModal").style.display = "none";
    }

    document.getElementById("frTargetType")?.addEventListener("change", function () {
      document.getElementById("frTargetGroup").style.display = this.value === "group" ? "" : "none";
      document.getElementById("frTargetUsers").style.display = this.value === "users" ? "" : "none";
    });

    async function saveFr() {
      const title = document.getElementById("frTitle").value.trim();
      const description = document.getElementById("frDescription").value.trim();
      const targetType = document.getElementById("frTargetType").value;
      const targetGroup = document.getElementById("frTargetGroupSelect").value;
      const targetUsersRaw = document.getElementById("frTargetUsersInput").value;
      const expiresInDays = parseInt(document.getElementById("frExpiresDays").value) || 7;
      const msg = document.getElementById("frMessage");
      const btn = document.getElementById("frSaveBtn");

      if (!title) {
        msg.textContent = "Başlık gerekli.";
        msg.className = "message error show";
        return;
      }

      const body = { title, description, targetType, expiresInDays };
      if (targetType === "group") body.targetGroup = targetGroup;
      if (targetType === "users") body.targetUsers = targetUsersRaw.split(",").map((e) => e.trim()).filter(Boolean);

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kaydediliyor...';
      try {
        const res = await fetch("/api/file-requests", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          closeFrModal();
          renderAdminFileRequests();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        btn.textContent = "Oluştur";
      }
    }

    window.viewFrDetail = async function (id) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div style="text-align:center;padding:60px;color:#aaa;"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;"></i><div style="margin-top:12px;">Yükleniyor...</div></div>';
      try {
        const res = await fetch("/api/file-requests/" + id, { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const fr = await res.json();
        const targetLabels = { all: "Tümü", group: "Grup", users: "Özel" };
        const targetStr = fr.targetType === "group" ? (fr.targetGroup === "lise" ? "Lise" : fr.targetGroup === "ortaokul" ? "Ortaokul" : "Diğer") : targetLabels[fr.targetType] || "Tümü";
        const expired = fr.expiresAt < Date.now();

        let subsHtml = "";
        if (fr.submissions && fr.submissions.length > 0) {
          subsHtml = fr.submissions.map((s) => `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8f9fb;border-radius:8px;margin-bottom:6px;font-size:13px;">
              <span style="font-weight:600;color:#1a1a2e;white-space:nowrap;min-width:120px;">${escHtml(s.userSchool || s.userEmail.split("@")[0])}</span>
              <span style="color:#888;font-size:11px;white-space:nowrap;">${new Date(s.submittedAt).toLocaleDateString("tr-TR")} ${new Date(s.submittedAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</span>
              <div style="display:flex;flex-wrap:wrap;gap:4px;flex:1;">
                ${s.files.map((f, fi) => `
                  <a href="#" onclick="downloadFileRequestFile('${fr.id}','${s.id}',${fi});return false;" style="color:#6366f1;font-size:12px;text-decoration:none;white-space:nowrap;">
                    <i class="fa-solid fa-download"></i> ${escHtml(f.originalName)} (${(f.size/1024).toFixed(1)} KB)
                  </a>
                `).join("<span style=\"color:#ddd;\"> | </span>")}
              </div>
            </div>
          `).join("");
        } else {
          subsHtml = '<div style="text-align:center;padding:20px;color:#aaa;">Henüz gönderi yok.</div>';
        }

        area.innerHTML = `
          <div style="margin-bottom:20px;">
            <button class="btn btn-ghost" style="width:auto;padding:10px 18px;font-size:13px;" onclick="renderAdminFileRequests()"><i class="fa-solid fa-arrow-left"></i> Geri</button>
            <button class="btn btn-primary" style="width:auto;padding:10px 18px;font-size:13px;float:right;margin-left:8px;background:#8b0000;border-color:#8b0000;" onclick="downloadAllFrFiles('${fr.id}')"><i class="fa-solid fa-file-zipper"></i> Toplu İndir</button>
            <button class="btn btn-danger" style="width:auto;padding:10px 18px;font-size:13px;float:right;" onclick="deleteFr('${fr.id}')"><i class="fa-solid fa-trash-can"></i> Talebi Sil</button>
          </div>
          <div class="content-header">
            <h2>${escHtml(fr.title)}</h2>
            <p>${escHtml(fr.description) || "Açıklama yok"}</p>
            <div style="margin-top:8px;font-size:13px;color:#888;">
              <span class="ann-tag ${fr.targetType}" style="font-size:10px;">${targetStr}</span>
              ${expired ? '<span style="color:#dc2626;margin-left:8px;">Süresi doldu</span>' : '<span style="color:#16a34a;margin-left:8px;">Son teslim: ' + new Date(fr.expiresAt).toLocaleDateString("tr-TR") + '</span>'}
            </div>
          </div>
          <div style="margin-top:16px;">
            <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">Gönderiler (${fr.submissions ? fr.submissions.length : 0})</h3>
            ${subsHtml}
          </div>
        `;
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu. <button class="btn btn-ghost" style="width:auto;margin-top:12px;" onclick="renderAdminFileRequests()">Geri</button></div>';
      }
    };

    window.viewUserFrDetail = async function (id) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div style="text-align:center;padding:60px;color:#aaa;"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;"></i><div style="margin-top:12px;">Yükleniyor...</div></div>';
      try {
        const res = await fetch("/api/file-requests/" + id + asRoleQuery(), { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const fr = await res.json();
        const expired = fr.expiresAt < Date.now();

        let mySub = null;
        if (fr.submissions && fr.submissions.length > 0) {
          mySub = fr.submissions[0];
        }

        area.innerHTML = `
          <div style="margin-bottom:20px;">
            <button class="btn btn-ghost" style="width:auto;padding:10px 18px;font-size:13px;" onclick="renderUserFileRequests()"><i class="fa-solid fa-arrow-left"></i> Geri</button>
          </div>
          <div class="content-header">
            <h2>${escHtml(fr.title)}</h2>
            <p>${escHtml(fr.description) || "Açıklama yok"}</p>
            <div style="margin-top:8px;font-size:13px;color:#888;">
              Son teslim: ${new Date(fr.expiresAt).toLocaleDateString("tr-TR")}
            </div>
          </div>
          ${mySub ? `
            <div style="background:#f8f9fb;border-radius:14px;padding:24px;">
              <h3 style="font-size:15px;font-weight:600;color:#16a34a;margin-bottom:12px;"><i class="fa-solid fa-check-circle"></i> Dosyalarınız Teslim Edildi</h3>
              <p style="font-size:13px;color:#888;margin-bottom:12px;">Teslim tarihi: ${new Date(mySub.submittedAt).toLocaleDateString("tr-TR")} ${new Date(mySub.submittedAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</p>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${mySub.files.map((f) => `
                  <div style="padding:8px 14px;background:#fff;border:1px solid #e2e4e9;border-radius:8px;font-size:13px;">
                    <i class="fa-solid fa-file-zipper"></i> ${escHtml(f.originalName)} (${(f.size/1024).toFixed(1)} KB)
                  </div>
                `).join("")}
              </div>
            </div>
          ` : (expired ? `
            <div style="text-align:center;padding:40px;color:#dc2626;">
              <i class="fa-solid fa-clock" style="font-size:32px;display:block;margin-bottom:8px;"></i>
              Bu talebin süresi dolmuş.
            </div>
          ` : `
            <div style="background:#f8f9fb;border-radius:14px;padding:24px;">
              <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">Dosya Yükle</h3>
              <p style="font-size:13px;color:#888;margin-bottom:16px;">Yalnızca ZIP dosyaları (max 10 MB). Birden fazla dosya seçebilirsiniz.</p>
              <form id="frUploadForm">
                <input type="file" id="frFileInput" multiple accept=".zip" style="margin-bottom:12px;" />
                <div id="frUploadMessage" class="message"></div>
                <button type="submit" class="btn btn-primary" style="width:auto;padding:10px 20px;background:#8b0000;border-color:#8b0000;">
                  <i class="fa-solid fa-upload"></i> Gönder
                </button>
              </form>
            </div>
          `)}
        `;

        if (!mySub && !expired) {
          document.getElementById("frUploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("frFileInput");
            const msg = document.getElementById("frUploadMessage");
            const btn = e.target.querySelector("button[type=submit]");

            if (!input.files || input.files.length === 0) {
              msg.textContent = "En az bir ZIP dosyası seçin.";
              msg.className = "message error show";
              return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor...';

            const formData = new FormData();
            for (const f of input.files) formData.append("files", f);

            try {
              const res = await fetch("/api/file-requests/" + id + "/submit", {
                method: "POST",
                headers: { Authorization: "Bearer " + token },
                body: formData,
              });
              const data = await res.json();
              if (res.ok) {
                msg.textContent = "Dosyalar başarıyla gönderildi!";
                msg.className = "message success show";
                setTimeout(() => viewUserFrDetail(id), 1000);
              } else {
                msg.textContent = data.error || "Hata oluştu.";
                msg.className = "message error show";
              }
            } catch {
              msg.textContent = "Bağlantı hatası.";
              msg.className = "message error show";
            } finally {
              btn.disabled = false;
              btn.innerHTML = '<i class="fa-solid fa-upload"></i> Gönder';
            }
          });
        }
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu. <button class="btn btn-ghost" style="width:auto;margin-top:12px;" onclick="renderUserFileRequests()">Geri</button></div>';
      }
    };

    window.deleteFr = async function (id) {
      if (!confirm("Bu dosya talebini silmek istediğinize emin misiniz?")) return;
      try {
        const res = await fetch("/api/file-requests/" + id, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });
        if (res.ok) renderAdminFileRequests();
      } catch {}
    };

    init();
  </script>
</body>
</html>
