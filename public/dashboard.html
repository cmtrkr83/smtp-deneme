            + '<div style="width:80px;height:18px;background:#f0f0f5;border-radius:4px;overflow:hidden;flex-shrink:0;">'
            + '<div style="height:100%;width:' + pct + '%;background:#f59e0b;border-radius:4px;"></div></div>'
            + '<span style="width:30px;font-size:12px;font-weight:600;color:var(--text);text-align:right;">' + f.downloads + '</span></div>';
        });
      }
      html += '</div></div></div>';
      html += '<div style="text-align:center;padding:12px;color:#bbb;font-size:11px;">Raporlar gercek zamanli verilerle olusturulmustur.</div>';

      // 7) Anket ilce raporu
      const surveyed = (d.surveyStats || []).filter((s) => s.id);
      html += '<div class="report-card" style="margin-bottom:28px;"><h4><i class="fa-solid fa-map-location-dot"></i> Anket İlçe Raporu</h4>';
      if (surveyed.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:#ccc;font-size:13px;">Henuz anket bulunmuyor.</div>';
      } else {
        html += '<div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0;"><div style="flex:1;min-width:220px;max-width:480px;"><select id="districtSurveySelect" class="form-control" onchange="loadDistrictStats()">'
          + surveyed.map((s, i) => '<option value="' + s.id + '">' + escHtml(s.title) + '</option>').join("")
          + '</select></div>'
          + '<div class="chart-radio" role="radiogroup" aria-label="İlçe görünümü">'
          + '<label><input type="radio" name="districtView" value="table" checked onchange="setDistrictView(\'table\')" /><span><i class="fa-solid fa-table"></i> Tablo</span></label>'
          + '<label><input type="radio" name="districtView" value="bar" onchange="setDistrictView(\'bar\')" /><span><i class="fa-solid fa-chart-column"></i> Sütun</span></label>'
          + '<label><input type="radio" name="districtView" value="line" onchange="setDistrictView(\'line\')" /><span><i class="fa-solid fa-chart-line"></i> Çizgi</span></label>'
          + '</div></div>'
          + '<div id="districtStatsContent" style="text-align:center;padding:20px;color:var(--muted);">Yükleniyor...</div>';
      }
      html += '</div>';

      container.innerHTML = html;

        { count: d.users.admin, color: "#6366f1", label: "Admin" },

        { count: d.users.ortaokul, color: "#f59e0b", label: "Ortaokul" },

      drawSegmentedDonut("schoolPieChart", [
        { count: sch.resmi, color: "#16a34a", label: "Resmi" },
        { count: sch.ozel, color: "#d97706", label: "Özel" },

    // İlçe görünümü: tablo/sütun/çizgi — veri bir kez çekilir, sekmeler yeniden çizim yapar
    window.districtView = window.districtView || "table";
    window._districtStats = null;
    function setDistrictView(v) {
      window.districtView = v;
      renderDistrictView();
    }
    function renderDistrictView() {
      const box = document.getElementById("districtStatsContent");
      const d = window._districtStats;
      if (!box || !d) return;
      const v = window.districtView || "table";
      try {
        document.querySelectorAll('input[name="districtView"]').forEach((r) => { r.checked = (r.value === v); });
      } catch (_) {}
      let h = districtSummary(d);
      if (v === "bar") h += districtBarChart(d);
      else if (v === "line") h += districtLineChart(d);
      else h += districtTable(d);
      box.innerHTML = h;
      box.style.textAlign = "";
    }
    function districtSummary(d) {
      return '<div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;text-align:left;">'
        + '<span style="font-size:13px;color:var(--text-2);">Hedef: <b>' + d.total + '</b></span>'
        + '<span style="font-size:13px;color:#22c55e;">Yanıtlayan: <b>' + d.submitted + '</b></span>'
        + '<span style="font-size:13px;color:#ef4444;">Yanıtlamayan: <b>' + (d.total - d.submitted) + '</b></span>'
        + '<span style="font-size:13px;color:var(--text);">Genel: <b>%' + d.rate + '</b></span></div>';
    }
    function districtTable(d) {
      let h = '<div class="users-table-wrapper"><table class="users-table"><thead><tr>'
        + '<th>İlçe</th><th>Hedef</th><th>Yanıtlayan</th><th>Yanıtlamayan</th><th>Oran</th></tr></thead><tbody>';
      d.districts.forEach((x) => {
        const barColor = x.rate >= 70 ? "#22c55e" : x.rate >= 40 ? "#f59e0b" : "#ef4444";
        h += '<tr><td class="cell-email">' + escHtml(x.district) + '</td>'
          + '<td>' + x.total + '</td>'
          + '<td style="color:#22c55e;font-weight:600;">' + x.submitted + '</td>'
          + '<td style="color:#ef4444;">' + x.pending + '</td>'
          + '<td style="min-width:140px;"><div style="display:flex;align-items:center;gap:8px;">'
          + '<div style="flex:1;height:16px;background:#f0f0f5;border-radius:4px;overflow:hidden;">'
          + '<div style="height:100%;width:' + x.rate + '%;background:' + barColor + ';border-radius:4px;"></div></div>'
          + '<span style="font-size:12px;font-weight:600;">%' + x.rate + '</span></div></td></tr>';
      });
      h += '</tbody></table></div>';
      return h;
    }
    function districtBarChart(d) {
      // Gruplu sütunlar: yanıtlayan (yeşil) + yanıtlamayan (kırmızı), saf SVG
      const districts = d.districts || [];
      if (!districts.length) return '<div style="padding:20px;color:var(--muted);">Grafik için veri yok.</div>';
      const W = 720, H = 300, padL = 40, padB = 72, padT = 30;
      const plotH = H - padT - padB, plotW = W - padL - 16;
      const max = Math.max(...districts.map((x) => x.total), 1);
      const slot = plotW / districts.length;
      const bw = Math.max(6, Math.min(20, (slot - 16) / 2));
      const y = (v) => padT + plotH - (v / max) * plotH;
      let g = "";
      [0, 0.5, 1].forEach((f) => {
        const yy = y(max * f).toFixed(1);
        g += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - 8) + '" y2="' + yy + '" class="chart-grid"/>'
          + '<text x="' + (padL - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" class="chart-axis-text">' + Math.round(max * f) + '</text>';
      });
      let bars = "";
      districts.forEach((x, i) => {
        const cx = padL + slot * i + slot / 2;
        const sh = (x.submitted / max) * plotH;
        const ph = ((x.total - x.submitted) / max) * plotH;
        const lx = cx.toFixed(1), ly = (H - padB + 16).toFixed(1);
        bars += '<rect x="' + (cx - bw - 2).toFixed(1) + '" y="' + (padT + plotH - sh).toFixed(1) + '" width="' + bw + '" height="' + Math.max(sh, 2).toFixed(1) + '" rx="3" fill="#22c55e"><title>' + escHtml(x.district) + ': ' + x.submitted + ' yanıtlayan</title></rect>'
          + '<rect x="' + (cx + 2).toFixed(1) + '" y="' + (padT + plotH - ph).toFixed(1) + '" width="' + bw + '" height="' + Math.max(ph, 2).toFixed(1) + '" rx="3" fill="#ef4444"><title>' + escHtml(x.district) + ': ' + (x.total - x.submitted) + ' yanıtlamayan</title></rect>'
          + '<text x="' + lx + '" y="' + ly + '" text-anchor="end" transform="rotate(-35 ' + lx + ' ' + ly + ')" class="chart-bar-label">' + escHtml(x.district) + '</text>';
      });
      const legend = '<div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12px;color:var(--text-2);">'
        + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#22c55e;margin-right:6px;"></span>Yanıtlayan</span>'
        + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#ef4444;margin-right:6px;"></span>Yanıtlamayan</span></div>';
      return '<div class="chart-scroll"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="İlçe yanıtlayan yanıtlamayan sütun grafiği">' + g + bars + '</svg></div>' + legend;
    }
    function districtLineChart(d) {
      // Çizgi: ilçe yanıtlama oranı % (alan dolgulu, saf SVG)
      const districts = d.districts || [];
      if (!districts.length) return '<div style="padding:20px;color:var(--muted);">Grafik için veri yok.</div>';
      const W = 720, H = 280, padL = 40, padB = 62, padT = 26;
      const plotH = H - padT - padB, plotW = W - padL - 16;
      const slot = plotW / districts.length;
      const X = (i) => padL + slot * i + slot / 2;
      const Y = (r) => padT + (1 - r / 100) * plotH;
      let g = "";
      [0, 25, 50, 75, 100].forEach((v) => {
        const yy = Y(v).toFixed(1);
        g += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - 8) + '" y2="' + yy + '" class="chart-grid"/>'
          + '<text x="' + (padL - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" class="chart-axis-text">%' + v + '</text>';
      });
      const pts = districts.map((x, i) => X(i).toFixed(1) + "," + Y(x.rate).toFixed(1)).join(" ");
      const area = "M" + X(0).toFixed(1) + "," + Y(districts[0].rate).toFixed(1)
        + districts.map((x, i) => "L" + X(i).toFixed(1) + "," + Y(x.rate).toFixed(1)).join("")
        + "L" + X(districts.length - 1).toFixed(1) + "," + (padT + plotH) + "L" + X(0).toFixed(1) + "," + (padT + plotH) + "Z";
      let dots = "";
      districts.forEach((x, i) => {
        const lx = X(i).toFixed(1), ly = (H - padB + 16).toFixed(1);
        dots += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(x.rate).toFixed(1) + '" r="4" fill="#6366f1"><title>' + escHtml(x.district) + ': %' + x.rate + '</title></circle>'
          + '<text x="' + X(i).toFixed(1) + '" y="' + (Y(x.rate) - 9).toFixed(1) + '" text-anchor="middle" class="chart-point-label">%' + x.rate + '</text>'
          + '<text x="' + lx + '" y="' + ly + '" text-anchor="end" transform="rotate(-35 ' + lx + ' ' + ly + ')" class="chart-bar-label">' + escHtml(x.district) + '</text>';
      });
      return '<div class="chart-scroll"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="İlçe yanıtlama oranı çizgi grafiği">'
        + '<defs><linearGradient id="distArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/></linearGradient></defs>'
        + g + '<path d="' + area + '" fill="url(#distArea)"/>'
        + '<polyline points="' + pts + '" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
        + dots + '</svg></div>';
    }

    function drawSegmentedDonut(canvasId, segments, total, centerLabel) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      const cx = w / 2, cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      const t = total || 1;
      const visible = segments.filter((s) => s.count > 0);
      const gap = visible.length > 1 ? 0.07 : 0;
      const ringR = 52, ringW = 30;
      let startAngle = -Math.PI / 2;

      visible.forEach((s) => {
        const sliceAngle = (s.count / t) * 2 * Math.PI;
        const a0 = startAngle + gap / 2;
        const a1 = startAngle + sliceAngle - gap / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, ringR, a0, Math.max(a1, a0 + 0.02));
        ctx.strokeStyle = s.color;
        ctx.lineWidth = ringW;
        ctx.lineCap = "butt";
        ctx.stroke();
        startAngle += sliceAngle;
      });

      // Center text
      const isDarkChart = document.documentElement.dataset.theme === "dark";
      ctx.fillStyle = isDarkChart ? "#e9edf5" : "#1a1a2e";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(t, cx, cy - 6);
      ctx.font = "10px sans-serif";
      ctx.fillStyle = isDarkChart ? "#8d96a9" : "#888";
      ctx.fillText(centerLabel, cx, cy + 14);
    }

    function addQuestion() {
      const container = document.getElementById("questionsContainer");
      const qCount = container.querySelectorAll(".question-block").length;

    function removeQuestion(btn) {
      const block = btn.closest(".question-block");
      const container = document.getElementById("questionsContainer");
      if (container.querySelectorAll(".question-block").length <= 1) return;
      block.remove();
      reindexQuestions();
    }

    function reindexQuestions() {
      const container = document.getElementById("questionsContainer");
      container.querySelectorAll(".question-block").forEach((block, i) => {
        const label = block.querySelector("span:first-child");
        if (label) label.textContent = "Soru " + (i + 1);
      });
    }

    function changeQuestionType(sel) {
      const block = sel.closest(".question-block");
      const container = block.querySelector(".q-options-container");
      const validation = block.querySelector(".q-validation");
      const addBtn = block.querySelector(".add-option-btn");
      if (!container) return;
      const isOpen = sel.value === "open_ended";
      container.style.display = isOpen ? "none" : "block";
      if (validation) validation.style.display = isOpen ? "" : "none";
      // Likert bilgi notunu sadece likert tipinde göster
      const existingMsg = container.querySelector(".likert-info");
      if (sel.value === "likert") {
        const placeholder = container.querySelector(".options-placeholder, p:not(.likert-info)");
        if (placeholder && !placeholder.classList.contains("likert-info")) placeholder.remove();
        if (!existingMsg) {
          const info = document.createElement("p");
          info.className = "likert-info";
          info.style.cssText = "font-size:12px;color:var(--muted);margin-top:4px;";
          info.textContent = "Dereceli sorular 1 (En Düşük) - 5 (En Yüksek) arası otomatik puanlanır.";
          container.insertBefore(info, addBtn);
        }
        container.querySelectorAll(".q-option").forEach((el) => el.closest("div")?.remove());
        if (addBtn) addBtn.style.display = "none";
      } else {
        if (existingMsg) existingMsg.remove();
        if (addBtn) addBtn.style.display = "";
        if (sel.value === "multiple_choice" || sel.value === "checkbox") {
          if (container.querySelectorAll(".q-option").length === 0 && !container.querySelector(".options-placeholder")) {
            const p = document.createElement("p");
            p.className = "options-placeholder";
            p.style.cssText = "font-size:12px;color:var(--muted);margin-top:4px;";
            p.textContent = "Çoktan seçmeli veya çoklu seçim sorularında seçenek ekleyin.";
            container.insertBefore(p, addBtn);
          }
        }
      }
    }

    function addOption(btn) {
      const container = btn.closest(".q-options-container");
      if (!container) return;
      const placeholder = container.querySelector(".options-placeholder");
      if (placeholder) placeholder.remove();
      const optionCount = container.querySelectorAll(".q-option").length;
      const div = document.createElement("div");
      div.style.cssText = "display:flex;gap:8px;align-items:center;margin-top:6px;";
      div.innerHTML = `
        <input type="text" class="q-option" value="" style="flex:1;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;outline:none;font-family:inherit;" placeholder="Seçenek ${optionCount + 1}" />
        <button class="btn-icon btn-icon-danger" onclick="removeOption(this)" style="width:28px;height:28px;font-size:12px;"><i class="fa-solid fa-xmark"></i></button>
      `;
      container.insertBefore(div, btn);
      div.querySelector(".q-option").focus();
    }

    function removeOption(btn) {
      btn.closest("div").remove();
    }

    function collectSurveyData() {
      const questions = [];
      document.querySelectorAll(".question-block").forEach((block) => {
        const title = block.querySelector(".q-title")?.value?.trim();
        if (!title) return;
        const type = block.querySelector(".q-type")?.value || "open_ended";
        const required = block.querySelector(".q-required")?.checked !== false;
        const validation = type === "open_ended" ? (block.querySelector(".q-validation")?.value || "none") : "none";
        const options = [];
        if (type === "multiple_choice" || type === "checkbox") {
          block.querySelectorAll(".q-option").forEach((o) => {
            const v = o.value.trim();
            if (v) options.push(v);
          });
        }
        const item = { title, type, required, validation, options };
        const qid = block.dataset.qid;
        if (qid) item.id = qid;
        questions.push(item);
      });
      const svSel = collectTargetSelection("sv");
      return {
        title: document.getElementById("svTitle")?.value?.trim(),
        description: document.getElementById("svDesc")?.value?.trim(),
        targetType: document.getElementById("svTargetType")?.value || "all",
        targetOwnership: svSel.ownership,
        targetRoles: svSel.roles,
        targetUsers: (document.getElementById("svTargetUsers")?.value || "").split(",").map((s) => s.trim()).filter(Boolean),
        expiresAt: (() => { const r = readExpiryInput("svExpiry"); return r.error ? NaN : r.at; })(),
        allowEdit: document.getElementById("svAllowEdit")?.value === "true",
        questions,
      };
    }

    async function saveSurvey() {
      const data = collectSurveyData();
      const msg = document.getElementById("surveyMessage");
      if (!data.title) {
        msg.textContent = "Anket başlığı gerekli.";
        msg.className = "message error show";
        return;
      }
      if (data.questions.length === 0) {
        msg.textContent = "En az bir soru ekleyin.";
        msg.className = "message error show";
        return;
      }
      if (!Number.isFinite(data.expiresAt)) {
        msg.textContent = "Geçerli bir bitiş tarihi seçin (gelecekte olmalı).";
        msg.className = "message error show";
        return;
      }
      for (const q of data.questions) {
        if (!q.title) {
          msg.textContent = "Tüm sorulara başlık girin.";
          msg.className = "message error show";
          return;
        }
        if ((q.type === "multiple_choice" || q.type === "checkbox") && q.options.length < 1) {
          msg.textContent = "Çoktan seçmeli / çoklu seçim sorularına en az bir seçenek ekleyin.";
          msg.className = "message error show";
          return;
        }
      }

      const saveBtn = document.querySelector('button[onclick="saveSurvey()"]');
      if (saveBtn) { saveBtn.disabled = true; setAddBtnLabel(saveBtn, "Kaydediliyor..."); }

      try {
        const method = editSurveyId ? "PUT" : "POST";
        const url = editSurveyId ? "/api/surveys/" + editSurveyId : "/api/surveys";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          renderAdminSurveys();
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        if (saveBtn) { saveBtn.disabled = false; setAddBtnLabel(saveBtn, editSurveyId ? "Güncelle" : "Kaydet"); }
      }
    }

    function sortSurveyStatus(key) {
      if (surveyStatusSort.key === key) {
        surveyStatusSort.dir = surveyStatusSort.dir === 1 ? -1 : 1;
      } else {
        surveyStatusSort = { key, dir: 1 };
      }
      renderSurveyStatusRows();
    }

    function renderSurveyStatusRows() {
      const tbody = document.getElementById("surveyStatusBody");
      if (!tbody) return;
      const { key, dir } = surveyStatusSort;
      const rows = [...surveyStatusUsers];
      if (key) {
        const strVal = (u, k) => ((u[k] || "").toString().toLocaleLowerCase("tr"));
        rows.sort((a, b) => {
          let cmp = 0;
          if (key === "submitted") cmp = (a.submitted === b.submitted) ? 0 : (a.submitted ? 1 : -1);
          else if (key === "submittedAt") cmp = (a.submittedAt || 0) - (b.submittedAt || 0);
          else if (key === "role") cmp = ((roleLabels[a.role] || a.role) > (roleLabels[b.role] || b.role)) ? 1 : (((roleLabels[a.role] || a.role) < (roleLabels[b.role] || b.role)) ? -1 : 0);
          else cmp = (strVal(a, key) > strVal(b, key)) ? 1 : ((strVal(a, key) < strVal(b, key)) ? -1 : 0);
          return cmp * dir;
        });
      }
      ["schoolName", "district", "email", "role", "submitted", "submittedAt"].forEach((k) => {
        const el = document.getElementById("ssSort-" + k);
        if (el) el.textContent = (key === k) ? (dir === 1 ? " ▲" : " ▼") : "";
      });
      tbody.innerHTML = rows.length === 0
        ? '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px;">Henüz kullanıcı yok.</td></tr>'
        : rows.map((u) => `

            <td class="cell-date">${u.submittedAt ? new Date(u.submittedAt).toLocaleDateString("tr-TR") : "-"}</td>
          </tr>
        `).join("");
    }

    function validateAnswer(value, validation) {
      if (!value) return "";
      if (validation === "number" && !/^\d+$/.test(value)) return "Sadece sayı girin.";
      if (validation === "only_text" && /\d/.test(value)) return "Sadece metin girin, sayı kullanmayın.";
      if (validation === "uppercase" && value !== value.toUpperCase()) return "Büyük harfle yazın.";
      if (validation === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return "Geçerli bir e-posta girin.";
      if (validation === "phone" && !/^[\d\s\-()+]{7,15}$/.test(value)) return "Geçerli bir telefon numarası girin.";
      return "";
    }

    async function submitSurvey(id) {
      const msg = document.getElementById("surveyFillMessage");
      if (!msg) { console.error("surveyFillMessage bulunamadi"); return; }
      const answers = [];
      const submitBtn = document.querySelector('button[onclick*="submitSurvey"]');
      if (submitBtn) { submitBtn.disabled = true; }

      try {
        document.querySelectorAll("#surveyForm .announcement-item[data-qid]").forEach((block) => {
          const qid = block.dataset.qid;
          const textarea = block.querySelector(".survey-answer");
          if (textarea) {
            answers.push({ questionId: qid, value: textarea.value.trim() });
            return;
          }
          const checkboxes = block.querySelectorAll(".survey-answer-checkbox");
          if (checkboxes.length > 0) {
            const selected = Array.from(checkboxes).filter((c) => c.checked).map((c) => c.value);
            answers.push({ questionId: qid, value: selected });
            return;
          }
          const radio = block.querySelector(".survey-answer-radio:checked");
          if (radio) {
            answers.push({ questionId: qid, value: radio.value });
          }
        });

        const requiredMissing = Array.from(document.querySelectorAll("#surveyForm .announcement-item[data-qid]")).some((block) => {
          const qid = block.dataset.qid;
          if (block.dataset.required !== "true") return false;
          const ans = answers.find((a) => a.questionId === qid);
          if (!ans) return true;
          if (Array.isArray(ans.value)) return ans.value.length === 0;
          return !ans.value;
        });

        if (requiredMissing) {
          msg.textContent = "Zorunlu soruları yanıtlayın.";
          msg.className = "message error show";
          return;
        }

        for (const block of document.querySelectorAll("#surveyForm .announcement-item[data-qid]")) {
          const qid = block.dataset.qid;
          const validation = block.dataset.validation;
          if (!validation || validation === "none") continue;
          const ans = answers.find((a) => a.questionId === qid);
          if (ans && ans.value) {
            const err = validateAnswer(ans.value, validation);
            if (err) {
              msg.textContent = err;
              msg.className = "message error show";
              return;
            }
          }
        }

        const res = await fetch("/api/surveys/" + id + "/respond", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ answers }),
        });
        if (res.ok) {
          msg.textContent = "Yanıtlarınız kaydedildi!";
          msg.className = "message success show";
          setTimeout(() => renderUserSurveys(), 1000);
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch (e) {
        console.error("submitSurvey hatasi:", e);
        msg.textContent = "Bir hata oluştu: " + (e.message || "bilinmeyen hata");
        msg.className = "message error show";
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    // ---- File Requests ----

    function renderFileRequests() {
      if (currentUser.role === "admin") renderAdminFileRequests();
      else renderUserFileRequests();
    }

    async function renderAdminFileRequests() {
      const area = document.getElementById("contentArea");
      area.innerHTML = `
        <div class="content-header" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h2>Belge İstekleri</h2>
            <p>Kullanıcılardan belge isteyin ve gönderimleri görüntüleyin.</p>
          </div>
          <button type="button" class="add-btn" onclick="showCreateFrModal()">
            <span class="add-btn__text">Talep Oluştur</span>
            <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line y2="19" y1="5" x2="12" x1="12"></line><line y2="12" y1="12" x2="19" x1="5"></line></svg></span>
          </button>
        </div>
        <div id="adminFrList" style="text-align:center;padding:40px;color:var(--muted);">Yükleniyor...</div>
      `;
      try {
        const res = await fetch("/api/file-requests", { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const container = document.getElementById("adminFrList");
        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:60px 0;color:#ccc;"><i class="fa-solid fa-file-arrow-up" style="font-size:48px;margin-bottom:16px;display:block;"></i><div style="font-size:14px;">Henüz dosya talebi oluşturulmamış.</div></div>';
          return;
        }
        const targetLabels = { all: "Tümü", group: "Grup", users: "Özel" };
        container.innerHTML = list.map((fr) => {
          const expired = fr.expiresAt < Date.now();
          const targetStr = fr.targetType === "group" ? groupLabels(fr) : targetLabels[fr.targetType] || "Tümü";
          const subCount = fr.submissionCount || 0;
          return `
            <div class="announcement-item" style="cursor:pointer;${expired?'background:rgba(139,0,0,0.08);':'background:rgba(22,163,74,0.08);'}" onclick="viewFrDetail('${fr.id}')">
              <span class="ann-tag ${fr.targetType}">${targetStr}</span>
              <h4>${escHtml(fr.title)}</h4>
              <p>${escHtml(fr.description) || "Açıklama yok"}</p>
              <span class="ann-date">${expired ? "Süresi doldu" : new Date(fr.expiresAt).toLocaleDateString("tr-TR")} · ${subCount} gönderi</span>
            </div>
          `;
        }).join("");
      } catch {
        document.getElementById("adminFrList").innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu.</div>';
      }
    }

        <div class="content-header">
          <h2>Belge İstekleri</h2>
          <p>Yönetici tarafından istenen belgeleri görüntüleyin ve yükleyin.</p>
        </div>
        <div id="userFrList" style="text-align:center;padding:40px;color:var(--muted);">Yükleniyor...</div>
      `;
      try {
        const res = await fetch("/api/file-requests" + asRoleQuery(), { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const container = document.getElementById("userFrList");
        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:60px 0;color:#ccc;"><i class="fa-solid fa-file-arrow-up" style="font-size:48px;margin-bottom:16px;display:block;"></i><div style="font-size:14px;">Size gönderilmiş dosya talebi bulunmuyor.</div></div>';
          return;
        }
        container.innerHTML = list.map((fr) => {

              <p>${escHtml(fr.description) || "Açıklama yok"}</p>

      window.showCreateFrModal = function () {
      document.getElementById("frModalTitle").textContent = "Dosya Talebi Oluştur";
      setAddBtnLabel(document.getElementById("frSaveBtn"), "Oluştur");
      document.getElementById("frTitle").value = "";
      document.getElementById("frDescription").value = "";
      document.getElementById("frTargetType").value = "all";
      document.getElementById("frTarget").innerHTML = targetSelectorHtml("fr", { ownership: "all", roles: [] });
      document.getElementById("frTargetGroup").style.display = "none";
      document.getElementById("frTargetUsers").style.display = "none";
      document.getElementById("frExpiresDays").value = "7";
      document.getElementById("frMessage").textContent = "";
      document.getElementById("frMessage").className = "message";
      document.getElementById("frModal").style.display = "flex";
    };

    function closeFrModal() {
      document.getElementById("frModal").style.display = "none";
    }

    document.getElementById("frTargetType")?.addEventListener("change", function () {
      document.getElementById("frTargetGroup").style.display = this.value === "group" ? "" : "none";
      document.getElementById("frTargetUsers").style.display = this.value === "users" ? "" : "none";
    });

    async function saveFr() {
      const title = document.getElementById("frTitle").value.trim();
      const description = document.getElementById("frDescription").value.trim();
      const targetType = document.getElementById("frTargetType").value;
      const frSel = collectTargetSelection("fr");
      const targetUsersRaw = document.getElementById("frTargetUsersInput").value;
      const expiresInDays = parseInt(document.getElementById("frExpiresDays").value) || 7;
      const msg = document.getElementById("frMessage");
      const btn = document.getElementById("frSaveBtn");

      if (!title) {
        msg.textContent = "Başlık gerekli.";
        msg.className = "message error show";
        return;
      }

      const body = { title, description, targetType, expiresInDays };
      if (targetType === "group") {
        body.targetOwnership = frSel.ownership;
        body.targetRoles = frSel.roles;
      }
      if (targetType === "users") body.targetUsers = targetUsersRaw.split(",").map((e) => e.trim()).filter(Boolean);

      btn.disabled = true;
      setAddBtnLabel(btn, "Kaydediliyor...");
      try {
        const res = await fetch("/api/file-requests", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          closeFrModal();
          renderAdminFileRequests();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        setAddBtnLabel(btn, "Oluştur");
      }
    }

    window.viewFrDetail = async function (id) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;"></i><div style="margin-top:12px;">Yükleniyor...</div></div>';
      try {
        const res = await fetch("/api/file-requests/" + id, { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const fr = await res.json();
        const targetLabels = { all: "Tümü", group: "Grup", users: "Özel" };
        const targetStr = fr.targetType === "group" ? groupLabels(fr) : targetLabels[fr.targetType] || "Tümü";
        const expired = fr.expiresAt < Date.now();

        let subsHtml = "";
        if (fr.submissions && fr.submissions.length > 0) {
          subsHtml = fr.submissions.map((s) => `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8f9fb;border-radius:8px;margin-bottom:6px;font-size:13px;">
              <span style="font-weight:600;color:var(--text);white-space:nowrap;min-width:120px;">${escHtml(s.userSchool || s.userEmail.split("@")[0])}${s.userDistrict ? ' (' + escHtml(s.userDistrict) + ')' : ''}</span>
              <span style="color:var(--muted);font-size:11px;white-space:nowrap;">${new Date(s.submittedAt).toLocaleDateString("tr-TR")} ${new Date(s.submittedAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</span>
              <div style="display:flex;flex-wrap:wrap;gap:4px;flex:1;">
                ${s.files.map((f, fi) => `
                  <a href="#" onclick="downloadFileRequestFile('${fr.id}','${s.id}',${fi});return false;" style="color:#6366f1;font-size:12px;text-decoration:none;white-space:nowrap;">
                    <i class="fa-solid fa-download"></i> ${escHtml(f.originalName)} (${(f.size/1024).toFixed(1)} KB)
                  </a>
                `).join("<span style=\"color:#ddd;\"> | </span>")}
              </div>
            </div>
          `).join("");
        } else {
          subsHtml = '<div style="text-align:center;padding:20px;color:var(--muted);">Henüz gönderi yok.</div>';
        }

        area.innerHTML = `
          <div style="margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="add-btn add-btn--sm add-btn--gray" onclick="renderAdminFileRequests()">
              <span class="add-btn__text">Geri</span>
              <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></span>
            </button>
            <button type="button" class="add-btn add-btn--teal" onclick="downloadAllFrFiles('${fr.id}')">
              <span class="add-btn__text">Toplu İndir</span>
              <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line y2="12" y1="5" x2="12" x1="12"></line><polyline points="6 13 12 19 18 13"></polyline><line y2="21" y1="21" x2="4" x1="20"></line></svg></span>
            </button>
            <button type="button" class="add-btn add-btn--sm add-btn--red" onclick="deleteFr('${fr.id}')">
              <span class="add-btn__text">Talebi Sil</span>
              <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line y2="12" y1="12" x2="19" x1="5"></line></svg></span>
            </button>
          </div>
          <div class="content-header">
            <h2>${escHtml(fr.title)}</h2>
            <p>${escHtml(fr.description) || "Açıklama yok"}</p>
            <div style="margin-top:8px;font-size:13px;color:var(--muted);">
              <span class="ann-tag ${fr.targetType}" style="font-size:10px;">${targetStr}</span>
              ${expired ? '<span style="color:#dc2626;margin-left:8px;">Süresi doldu</span>' : '<span style="color:#16a34a;margin-left:8px;">Son teslim: ' + new Date(fr.expiresAt).toLocaleDateString("tr-TR") + '</span>'}
            </div>
          </div>
          <div style="margin-top:16px;">
            <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">Gönderiler (${fr.submissions ? fr.submissions.length : 0})</h3>
            ${subsHtml}
          </div>
        `;
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu. <button class="btn btn-ghost" style="width:auto;margin-top:12px;" onclick="renderAdminFileRequests()">Geri</button></div>';
      }
    };

    window.viewUserFrDetail = async function (id) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;"></i><div style="margin-top:12px;">Yükleniyor...</div></div>';
      try {
        const res = await fetch("/api/file-requests/" + id + asRoleQuery(), { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error();
        const fr = await res.json();
        const expired = fr.expiresAt < Date.now();

        let mySub = null;
        if (fr.submissions && fr.submissions.length > 0) {
          mySub = fr.submissions[0];
        }

        area.innerHTML = `
          <div style="margin-bottom:20px;">
            <button type="button" class="add-btn add-btn--sm add-btn--gray" onclick="renderUserFileRequests()">
              <span class="add-btn__text">Geri</span>
              <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></span>
            </button>
          </div>
          <div class="content-header">
            <h2>${escHtml(fr.title)}</h2>
            <p>${escHtml(fr.description) || "Açıklama yok"}</p>
            <div style="margin-top:8px;font-size:13px;color:var(--muted);">
              Son teslim: ${new Date(fr.expiresAt).toLocaleDateString("tr-TR")}
            </div>
          </div>
          ${mySub ? `
            <div style="background:#f8f9fb;border-radius:14px;padding:24px;">
              <h3 style="font-size:15px;font-weight:600;color:#16a34a;margin-bottom:12px;"><i class="fa-solid fa-check-circle"></i> Dosyalarınız Teslim Edildi</h3>
              <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Teslim tarihi: ${new Date(mySub.submittedAt).toLocaleDateString("tr-TR")} ${new Date(mySub.submittedAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</p>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${mySub.files.map((f, fi) => `
                  <a href="#" onclick="downloadFileRequestFile('${fr.id}','${mySub.id}',${fi});return false;" style="padding:8px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;text-decoration:none;" title="İndir">
                    <i class="fa-solid fa-file-zipper"></i> ${escHtml(f.originalName)} (${(f.size/1024).toFixed(1)} KB) <i class="fa-solid fa-download" style="font-size:11px;color:#6366f1;"></i>
                  </a>
                `).join("")}
              </div>
            </div>
          ` : (expired ? `
            <div style="text-align:center;padding:40px;color:#dc2626;">
              <i class="fa-solid fa-clock" style="font-size:32px;display:block;margin-bottom:8px;"></i>
              Bu talebin süresi dolmuş.
            </div>
          ` : `
            <div style="background:#f8f9fb;border-radius:14px;padding:24px;">
              <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">Dosya Yükle</h3>
              <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Yalnızca ZIP dosyaları (max 10 MB). Birden fazla dosya seçebilirsiniz.</p>
              <form id="frUploadForm">
                <input type="file" id="frFileInput" multiple accept=".zip" style="margin-bottom:12px;" />
                <div id="frUploadMessage" class="message"></div>
                <button type="submit" class="add-btn add-btn--sm add-btn--teal">
                  <span class="add-btn__text">Gönder</span>
                  <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line y2="19" y1="12" x2="12" x1="12"></line><polyline points="6 11 12 5 18 11"></polyline><line y2="21" y1="21" x2="4" x1="20"></line></svg></span>
                </button>
              </form>
            </div>
          `)}
        `;

        if (!mySub && !expired) {
          document.getElementById("frUploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("frFileInput");
            const msg = document.getElementById("frUploadMessage");
            const btn = e.target.querySelector("button[type=submit]");

            if (!input.files || input.files.length === 0) {
              msg.textContent = "En az bir ZIP dosyası seçin.";
              msg.className = "message error show";
              return;
            }

            btn.disabled = true;
            setAddBtnLabel(btn, "Yükleniyor...");

            const formData = new FormData();
            for (const f of input.files) formData.append("files", f);

            try {
              const res = await fetch("/api/file-requests/" + id + "/submit", {
                method: "POST",
                headers: { Authorization: "Bearer " + token },
                body: formData,
              });
              const data = await res.json();
              if (res.ok) {
                msg.textContent = "Dosyalar başarıyla gönderildi!";
                msg.className = "message success show";
                setTimeout(() => viewUserFrDetail(id), 1000);
              } else {
                msg.textContent = data.error || "Hata oluştu.";
                msg.className = "message error show";
              }
            } catch {
              msg.textContent = "Bağlantı hatası.";
              msg.className = "message error show";
            } finally {
              btn.disabled = false;
              setAddBtnLabel(btn, "Gönder");
            }
          });
        }
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Yüklenirken hata oluştu. <button class="btn btn-ghost" style="width:auto;margin-top:12px;" onclick="renderUserFileRequests()">Geri</button></div>';
      }
    };

    window.deleteFr = async function (id) {
      showConfirmModal({
        title: "Dosya Talebini Sil",
        message: "Bu dosya talebini silmek istediğinize emin misiniz?",
        confirmText: "Sil",
        onConfirm: async () => {
          try {
            const res = await apiFetch("/api/file-requests/" + id, { method: "DELETE" });
            if (res.ok) {
              showToast("Dosya talebi silindi.", "success");
              renderAdminFileRequests();
            } else if (res.status !== 401) {
              showToast("Dosya talebi silinemedi.", "error");
            }
          } catch {
            showToast("Bağlantı hatası.", "error");
          }
        },
      });
    };

    init();
  </script>
