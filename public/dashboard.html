  <style>
    /* Toast bildirimleri (ekleme, mevcut stilleri ezmez) */
    #toastWrap { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, 90vw); }
    .toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: toast-in .25s ease; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #2563eb; }
    .toast.warning { background: #d97706; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  </style>
  <script>
    // Varsayılan her zaman açık tema; kullanıcı koyu temaya geçerse tercihi hatırlanır.
    try {
      document.documentElement.dataset.theme = localStorage.getItem("kodm-theme") === "dark" ? "dark" : "light";
    } catch (e) { document.documentElement.dataset.theme = "light"; }

  <div class="modal-overlay" id="frModal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="frModalTitle" onclick="if(event.target===this)closeFrModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 id="frModalTitle">Dosya Talebi Oluştur</h3>
        <button class="modal-close" onclick="closeFrModal()" aria-label="Kapat"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Başlık</label>
          <input type="text" id="frTitle" class="form-control" placeholder="Dosya talebi başlığı" />
        </div>
        <div class="form-group">
          <label>Açıklama</label>
          <textarea id="frDescription" class="form-control" style="resize:vertical;min-height:60px;padding:10px 14px;" placeholder="İsteğe bağlı açıklama"></textarea>
        </div>
        <div class="form-group">
          <label>Hedef</label>
          <select id="frTargetType" class="form-control">
            <option value="all">Tüm Kullanıcılar</option>
            <option value="group">Grup</option>
            <option value="users">Belirli Kullanıcılar</option>
          </select>
        </div>
        <div class="form-group" id="frTargetGroup" style="display:none;">
          <label>Hedef (tür + gruplar)</label>
          <div id="frTarget"></div>
        </div>
        <div class="form-group" id="frTargetUsers" style="display:none;">
          <label>Kullanıcı E-postaları (virgülle ayırın)</label>
          <input type="text" id="frTargetUsersInput" class="form-control" placeholder="ornek1@mail.com, ornek2@mail.com" />
        </div>
        <div class="form-group">
          <label>Teslim Süresi (gün)</label>
          <input type="number" id="frExpiresDays" class="form-control" value="7" min="1" max="365" />
        </div>
        <div id="frMessage" class="message"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="add-btn add-btn--sm add-btn--gray" onclick="closeFrModal()">
          <span class="add-btn__text">İptal</span>
          <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>
        </button>

          <span class="add-btn__text">Oluştur</span>
          <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line y2="19" y1="5" x2="12" x1="12"></line><line y2="12" y1="12" x2="19" x1="5"></line></svg></span>
        </button>
      </div>
    </div>

  <script>
    // Oturum koruması: token yoksa panele girilmez, girişe atılır. Tüm istekler Bearer token taşır.
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.replace("/login.html");
    }

    let currentUser = null;
    let activeRole = null;
    let dashboardData = null;

    // Rol geçişi: kendi rolündeyken boş döner, başka role bakılırken ?asRole= ekler
    function asRoleQuery() {
      if (!activeRole) return "";
      return activeRole !== currentUser.role ? "?asRole=" + activeRole : "";
    }

    // Sidebar: role göre Genel Bakış + Modüller + İşlemler gruplarını kurar, tıklamada ilgili sayfayı loader eşliğinde açar
    function buildSidebar(role) {
      const nav = document.getElementById("sidebarNav");
      const overviewItems = [
        { page: "dashboard", icon: "fa-gauge-high", label: "Genel Bakış", roles: ["admin", "lise", "ortaokul", "diger"] },
      ];
      const moduleItems = [
        { page: "announcements", icon: "fa-bullhorn", label: "Duyurular", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "surveys", icon: "fa-square-poll-vertical", label: "Veri Toplama", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "files", icon: "fa-folder-open", label: "Dosya Dağıtım", roles: ["admin", "lise", "ortaokul", "diger"] },
        { page: "file-requests", icon: "fa-file-arrow-up", label: "Belge İstekleri", roles: ["admin", "lise", "ortaokul", "diger"] },

    const roleLabels = {
      admin: "Sistem Yöneticisi",
      lise: "Lise Grubu",
      ortaokul: "Ortaokul Grubu",
      diger: "Diğer",
    };

    // Grup hedef etiketi: rol gruplari + resmi/ozel ownership gruplari
    function groupLabel(g) {
      if (g === "lise") return "Lise";
      if (g === "ortaokul") return "Ortaokul";
      if (g === "diger") return "Diğer";
      if (g === "resmi") return "Resmi Okullar";
      if (g === "ozel") return "Özel Okullar";
      if (g === "all") return "Tümü";
      return g || "-";
    }

    // Coklu grup etiketi: yeni tur x rol modelinde "Resmi • Lise + Ortaokul",
    // eski kayitlarda grup listesi birlesimi
    function groupLabels(item) {
      if (item && item.targetOwnership !== undefined && item.targetOwnership !== null) {
        const own = item.targetOwnership === "all" ? "Tümü" : groupLabel(item.targetOwnership);
        const roles = Array.isArray(item.targetRoles) ? item.targetRoles : [];
        if (roles.length === 0) return own === "Tümü" ? "Tüm Gruplar" : own;
        return own + " • " + roles.map(groupLabel).join(" + ");
      }
      const arr = [];
      const push = (g) => { if (g && !arr.includes(g)) arr.push(g); };
      (item.targetGroups || item.targets || []).forEach(push);
      push(item.targetGroup);
      push(item.target);
      return arr.length > 0 ? arr.map(groupLabel).join(" + ") : "-";
    }

    const TARGET_OWNERSHIP_OPTIONS = [
      { value: "all", label: "Tümü (resmi + özel)" },
      { value: "resmi", label: "Sadece resmi" },
      { value: "ozel", label: "Sadece özel" },
    ];
    const TARGET_ROLE_OPTIONS = [
      { value: "lise", label: "Lise" },
      { value: "ortaokul", label: "Ortaokul" },
      { value: "diger", label: "Diğer" },
    ];

    // Tur x rol secici: once tur (resmi/ozel/tumu), sonra roller (coklu)
    function targetSelectorHtml(prefix, sel) {
      const ownership = (sel && sel.ownership) || "all";
      const roles = (sel && sel.roles) || [];
      return `
        <select class="${prefix}-ownership" style="width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--surface);color:var(--text);">
          ${TARGET_OWNERSHIP_OPTIONS.map((o) => `<option value="${o.value}" ${ownership === o.value ? "selected" : ""}>${o.label}</option>`).join("")}
        </select>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
          ${TARGET_ROLE_OPTIONS.map((o) => `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;padding:7px 10px;border:1px solid var(--border);border-radius:8px;">
              <input type="checkbox" class="${prefix}-role-cb" value="${o.value}" ${roles.includes(o.value) ? "checked" : ""} style="accent-color:#8b0000;width:15px;height:15px;" />
              ${o.label}
            </label>
          `).join("")}
        </div>
        <p style="font-size:11px;color:var(--muted);margin:6px 0 0;">Rol seçilmezse o türdeki tüm gruplar dahildir.</p>
      `;
    }

    function collectTargetSelection(prefix) {
      const rawOwn = document.querySelector("." + prefix + "-ownership")?.value || "all";
      const roles = Array.from(document.querySelectorAll("." + prefix + "-role-cb"))
        .filter((c) => c.checked)
        .map((c) => c.value);
      return { ownership: ["resmi", "ozel"].includes(rawOwn) ? rawOwn : "all", roles };
    }

    // Kaydi secici formatina cevir (eski kayitlar icin geriye uyumlu esleme)
    function normalizeTarget(item) {
      if (item && item.targetOwnership !== undefined && item.targetOwnership !== null) {
        return { ownership: item.targetOwnership || "all", roles: item.targetRoles || [] };
      }
      const groups = [...(item.targetGroups || item.targets || [])];
      if (item.targetGroup) groups.unshift(item.targetGroup);
      if (item.target && item.target !== "all") groups.unshift(item.target);
      const roles = [...new Set(groups.filter((g) => ["lise", "ortaokul", "diger"].includes(g)))];
      const owns = groups.filter((g) => ["resmi", "ozel"].includes(g));
      if (owns.length === 1 && roles.length === 0) return { ownership: owns[0], roles: [] };
      return { ownership: "all", roles };
    }

    // Sidebar toggle

    // Fetch profile and dashboard data
    async function init() {

    // Takvim yardımcıları: saf fonksiyonlar (ızgara + tarih biçimi + aralık eşleşmesi)
    const CAL_MONTHS_TR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    function fmtDDMMYYYY(ymd) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || "");
      if (!m) return "";
      return m[3] + "-" + m[2] + "-" + m[1];
    }
    function ymdLocal(y, m0, d) {
      return y + "-" + String(m0 + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    }
    function calCells(year, month0) {
      // Pazartesi başlı 6x7 sabit ızgara (ay kaç çekerse çeksin kayma yok)
      const first = new Date(year, month0, 1);
      const lead = (first.getDay() + 6) % 7;
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const dt = new Date(year, month0, 1 - lead + i);
        cells.push({ ymd: ymdLocal(dt.getFullYear(), dt.getMonth(), dt.getDate()), day: dt.getDate(), dim: dt.getMonth() !== month0 });
      }
      return cells;
    }
    function eventsOnDay(ymd, events) {
      // Dize karşılaştırma: YYYY-MM-DD sözlüksel sıralanır, Date ayrıştırma yok (TZ tuzağı yok)
      return (events || []).filter((e) => e.startDate <= ymd && ymd <= e.endDate);
    }
    function upcomingEvents(events, todayYmd) {
      // Bitmemiş etkinlikler (bitiş >= bugün), tarihe göre ilk 3
      return (events || [])
        .filter((e) => e.endDate >= todayYmd)
        .sort((a, b) => String(a.startDate).localeCompare(String(b.startDate)))
        .slice(0, 3);
    }
    function validateEventInput({ title, start, end }) {
      // Kaydetmeden önce istemci engeli (sunucu aynı kuralları 400 ile korur)
      if (!String(title || "").trim()) return "Başlık gerekli.";
      const ymd = /^\d{4}-\d{2}-\d{2}$/;
      if (!ymd.test(start || "") || (end && !ymd.test(end))) return "Tarih biçimi hatalı.";
      if ((end || start) < start) return "Bitiş tarihi başlangıçtan önce olamaz.";
      return "";
    }
    function nowYm() {
      const n = new Date();
      return { y: n.getFullYear(), m: n.getMonth() };
    }
    window._events = window._events || [];
    window.calCursor = window.calCursor || null;
    window.calSelected = window.calSelected || null;
    async function fetchEvents() {
      try {
        const res = await apiFetch("/api/events" + asRoleQuery());
        if (!res.ok) return;
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.events || []);
        window._events = list.slice().sort((a, b) => String(a.startDate).localeCompare(String(b.startDate)));
      } catch (_) {}
    }
    function calMove(dir) {
      const c = window.calCursor || nowYm();
      const d = new Date(c.y, c.m + dir, 1);
      window.calCursor = { y: d.getFullYear(), m: d.getMonth() };
      renderCalendar();
    }
    function calToday() {
      window.calCursor = nowYm();
      const n = new Date();
      window.calSelected = ymdLocal(n.getFullYear(), n.getMonth(), n.getDate());
      renderCalendar();
    }
    function calSelect(ymd, el) {
      // Seçimi güncelle; dokunmatikte popup'ı açık tut (yeniden çizim yok)
      window.calSelected = ymd;
      try {
        document.querySelectorAll("#calGrid .cal-day").forEach((b) => {
          b.classList.toggle("is-selected", b.dataset.ymd === ymd);
          if (b !== el) b.classList.remove("pop-open");
        });
        if (el) el.classList.toggle("pop-open");
      } catch (_) {}
    }
    function calRangeLabel(ev) {
      if (!ev.endDate || ev.endDate === ev.startDate) return fmtDDMMYYYY(ev.startDate);
      return fmtDDMMYYYY(ev.startDate) + " – " + fmtDDMMYYYY(ev.endDate);
    }
    function renderCalendar() {
      const box = document.getElementById("calBox");
      if (!box) return;
      const n = new Date();
      const today = ymdLocal(n.getFullYear(), n.getMonth(), n.getDate());
      if (!window.calCursor) window.calCursor = { y: n.getFullYear(), m: n.getMonth() };
      if (!window.calSelected) window.calSelected = today;
      const isAdmin = currentUser && currentUser.role === "admin";
      const { y, m } = window.calCursor;
      const days = calCells(y, m).map((c) => {
        const evs = eventsOnDay(c.ymd, window._events);
        const cls = ["cal-day"];
        if (c.dim) cls.push("is-dim");
        if (c.ymd === today) cls.push("is-today");
        if (c.ymd === window.calSelected) cls.push("is-selected");
        if (evs.length) cls.push("has-event");
        const pop = evs.length
          ? `<span class="cal-pop" role="status"><h5>${fmtDDMMYYYY(c.ymd)}</h5>` + evs.map((ev) =>
            `<div class="cal-pop-item"><strong>${escHtml(ev.title)}</strong><div class="cal-pop-date">${calRangeLabel(ev)}</div>`
            + (ev.description ? `<div>${escHtml(ev.description)}</div>` : "") + `</div>`).join("") + `</span>`
          : "";
        return `<button type="button" class="${cls.join(" ")}" data-ymd="${c.ymd}" onclick="calSelect('${c.ymd}', this)" aria-label="${c.day} ${CAL_MONTHS_TR[m]}${evs.length ? ", " + evs.length + " etkinlik" : ""}">${c.day}${pop}</button>`;
      }).join("");
      box.innerHTML = `
        <div class="cal-head">
          <div class="cal-title">${CAL_MONTHS_TR[m]} ${y}</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${isAdmin ? `<button type="button" class="add-btn add-btn--xs" onclick="showEventModal()" aria-label="Etkinlik ekle"><span class="add-btn__text">Ekle</span><span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line y2="19" y1="5" x2="12" x1="12"></line><line y2="12" y1="12" x2="19" x1="5"></line></svg></span></button>` : ""}
            <div class="cal-nav">
              <button type="button" class="cal-today-btn" onclick="calToday()">Bugün</button>
              <button type="button" class="cal-nav-btn" onclick="calMove(-1)" aria-label="Önceki ay">‹</button>
              <button type="button" class="cal-nav-btn" onclick="calMove(1)" aria-label="Sonraki ay">›</button>
            </div>
          </div>
        </div>
        <div class="cal-grid" id="calGrid" role="grid" aria-label="Takvim">
          ${["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"].map((d) => `<div class="cal-dow">${d}</div>`).join("")}
          ${days}
        </div>
        <div class="cal-upcoming" id="calUpcoming"></div>`;
      renderUpcoming();
    }

    // Yaklaşanlar: bitmemiş ilk 3 etkinlik; düzenle/sil ikonları yalnızca adminde
    function renderUpcoming() {
      const el = document.getElementById("calUpcoming");
      if (!el) return;

            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(ev.title)}</div>
              ${ev.description ? `<div style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(ev.description)}</div>` : ""}
            </div>
            ${isAdmin ? `<button class="btn-icon" onclick="showEventModal('${ev.id}')" title="Düzenle" aria-label="Etkinliği düzenle"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-icon btn-icon-danger" onclick="deleteEvent('${ev.id}')" title="Sil" aria-label="Etkinliği sil"><i class="fa-solid fa-trash-can"></i></button>` : ""}
          </div>`).join("");
      }
      el.innerHTML = h;
    }

    // Merkezi API çağrısı: token ekler, 401'de oturum uyarısı + girişe yönlendirir (pilot: duyurular)
    // Otomatik loader: 250ms'yi aşan isteklerde overlay'i kendiliğinden gösterir (flicker önler)
    async function apiFetch(url, options) {
      _autoLoaderStart();
      try {
        const opts = Object.assign({}, options || {});
        opts.headers = Object.assign({}, opts.headers || {}, { Authorization: "Bearer " + token });
        const res = await fetch(url, opts);
        if (res.status === 401 && !window._sessionExpired) {
          window._sessionExpired = true;
          try { showToast("Oturumunuzun süresi doldu, giriş sayfasına yönlendiriliyorsunuz.", "warning"); } catch (_) {}
          setTimeout(() => { try { localStorage.removeItem("token"); } catch (_) {} window.location.replace("/login.html"); }, 1200);
        }
        return res;
      } finally {
        _autoLoaderStop();
      }
    }

    // Peg Top global loader (Uiverse): tam ekran overlay, sayfa geçişlerinde kullan
    // Otomatik mod: apiFetch + navigate sarmalayıcıları sayacı yönetir; manuel çağrı da desteklenir
    let _globalLoaderTimer = null;
    let _loaderDepth = 0;
    let _loaderDelay = null;
    function _loaderShowNow(text) {
      try {
        const ov = document.getElementById("globalLoader");
        if (!ov) return;
        const t = document.getElementById("globalLoaderText");
        if (t && text) t.textContent = text;
        ov.classList.add("show");
        ov.setAttribute("aria-hidden", "false");
        clearTimeout(_globalLoaderTimer);
        // Kilitlenmeye karşı 15 sn güvenlik kapatması
        _globalLoaderTimer = setTimeout(hideGlobalLoader, 15000);
      } catch (_) {}
    }
    function showGlobalLoader(text) {
      _loaderDepth++;
      _loaderShowNow(text);
    }
    function hideGlobalLoader() {
      try {
        _loaderDepth = Math.max(0, _loaderDepth - 1);
        if (_loaderDepth > 0) return;
        const ov = document.getElementById("globalLoader");
        if (!ov) return;
        ov.classList.remove("show");
        ov.setAttribute("aria-hidden", "true");
        clearTimeout(_globalLoaderTimer);
        clearTimeout(_loaderDelay);
        _loaderDelay = null;
      } catch (_) {}
    }
    function _autoLoaderStart() {
      _loaderDepth++;
      if (_loaderDelay) return;
      _loaderDelay = setTimeout(() => {
        if (_loaderDepth > 0) _loaderShowNow();
      }, 250);
    }
    function _autoLoaderStop() {
      _loaderDepth = Math.max(0, _loaderDepth - 1);
      if (_loaderDepth === 0) {
        clearTimeout(_loaderDelay);
        _loaderDelay = null;
        try {
          const ov = document.getElementById("globalLoader");
          if (ov) { ov.classList.remove("show"); ov.setAttribute("aria-hidden", "true"); }
          clearTimeout(_globalLoaderTimer);
        } catch (_) {}
      }
    }
    // Sayfa geçiş sarmalayıcı: render bitene kadar overlay açık kalır
    async function withGlobalLoader(fn, text) {
      showGlobalLoader(text);
      try {
        await fn();
      } finally {
        hideGlobalLoader();
      }
    }

    // Bitis tarihi yardimcilari (datetime-local <-> timestamp, yerel saat)
    function toDateTimeLocalValue(ts) {
      const d = new Date(Number(ts));
      if (!Number.isFinite(d.getTime())) return "";
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
    }
    function defaultExpiryValue() {
      return toDateTimeLocalValue(Date.now() + 7 * 24 * 60 * 60 * 1000);
    }
    function readExpiryInput(id) {
      const el = document.getElementById(id);
      const v = el && el.value;
      if (!v) return { error: "Bitiş tarihi seçin." };
      const ts = new Date(v).getTime();
      if (!Number.isFinite(ts)) return { error: "Geçersiz bitiş tarihi." };
      if (ts <= Date.now()) return { error: "Bitiş tarihi gelecekte olmalı." };
      return { at: ts };
    }

        if (!wrap) {
          wrap = document.createElement("div");

          wrap.setAttribute("aria-live", "polite");

          document.body.appendChild(wrap);
        }
        const el = document.createElement("div");
        el.className = "toast " + (["success", "error", "info", "warning"].includes(type) ? type : "info");
        el.setAttribute("role", "status");
        const icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-circle-exclamation" : type === "warning" ? "fa-triangle-exclamation" : "fa-circle-info";
        el.innerHTML = '<i class="fa-solid ' + icon + '"></i><span></span>';
        el.querySelector("span").textContent = String(msg || "");
        wrap.appendChild(el);
        setTimeout(() => { try { el.remove(); } catch (_) {} }, 3000);
      } catch (_) {}
    }

    // Tema: açık/koyu seçimi localStorage'da saklanır, switch konumu buna göre eşitlenir
    function applyTheme(t) {
      const theme = t === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem("kodm-theme", theme); } catch (e) {}
      const cb = document.getElementById("themeToggle");
      if (cb && "checked" in cb) cb.checked = theme === "dark";
      const label = cb ? cb.closest(".theme-switch") : null;
      if (label) label.title = theme === "dark" ? "Açık temaya geç" : "Koyu temaya geç";
    }

    function toggleTheme() {
      const cb = document.getElementById("themeToggle");
      if (cb && "checked" in cb) applyTheme(cb.checked ? "dark" : "light");
      else applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    }

    applyTheme(document.documentElement.dataset.theme);

    // Modal erişilebilirliği: statik overlay'lere dialog rolü + Escape ile kapatma
    (function modalA11y() {
      function labelOverlay(ov) {
        if (!ov || ov.hasAttribute("role")) return;
        ov.setAttribute("role", "dialog");
        ov.setAttribute("aria-modal", "true");
        const h = ov.querySelector(".modal-header h3");
        if (h && !ov.hasAttribute("aria-labelledby")) {
          if (!h.id) h.id = ov.id + "-title";
          ov.setAttribute("aria-labelledby", h.id);
        }
        ov.querySelectorAll(".modal-close:not([aria-label])").forEach((b) => b.setAttribute("aria-label", "Kapat"));
      }
      function enhanceAll() {
        document.querySelectorAll(".modal-overlay").forEach(labelOverlay);
      }
      enhanceAll();
      new MutationObserver(enhanceAll).observe(document.body, { childList: true, subtree: true });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        const closers = { frModal: "closeFrModal", userModal: "closeUserModal", deleteModal: "closeDeleteModal", annModal: "closeAnnModal", readModal: "closeReadModal", confirmModal: "closeConfirmModal" };
        for (const [id, fn] of Object.entries(closers)) {
          const ov = document.getElementById(id);
          if (ov && ov.style.display !== "none" && typeof window[fn] === "function") { window[fn](); break; }
        }
      });
    })();

    let sessionTimerInterval = null;

    function parseJwt(token) {
      try {
        return JSON.parse(atob(token.split(".")[1]));
      } catch (_) {
        return null;
      }
    }

    function startSessionTimer() {
      const decoded = parseJwt(token);
      if (!decoded || !decoded.exp) return;
      const el = document.getElementById("sessionTimer");
      if (!el) return;

      clearInterval(sessionTimerInterval);

      function update() {
        const remaining = decoded.exp * 1000 - Date.now();
        if (remaining <= 0) {
          el.textContent = "Oturum süresi doldu";
          el.style.color = "#ef4444";
          clearInterval(sessionTimerInterval);
          setTimeout(() => { localStorage.removeItem("token"); window.location.href = "/login.html"; }, 2000);
          return;
        }
        const totalSec = Math.floor(remaining / 1000);
        const min = String(Math.floor(totalSec / 60)).padStart(2, "0");
        const sec = String(totalSec % 60).padStart(2, "0");
        el.textContent = "Kalan süre: " + min + ":" + sec;
        el.style.color = totalSec < 60 ? "#ef4444" : totalSec < 300 ? "#f59e0b" : "#888";
      }

      update();
      sessionTimerInterval = setInterval(update, 1000);
    }

    async function downloadBackup() {
      const msg = document.getElementById("backupMessage");
      const sections = [...document.querySelectorAll(".bk-sec:checked")].map((c) => c.value);
      if (sections.length === 0) {
        if (msg) { msg.textContent = "En az bir bölüm seçin."; msg.className = "message error show"; }
        return;
      }
      try {
        const res = await apiFetch("/api/backup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sections }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          if (res.status !== 401 && msg) { msg.textContent = data.error || "Yedek alınamadı."; msg.className = "message error show"; }
          return;
        }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const match = cd.match(/filename="?(.+?)"?$/);
        const filename = match ? match[1] : "yedek.zip";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Yedek indirildi.", "success");
      } catch {
        if (msg) { msg.textContent = "Bağlantı hatası."; msg.className = "message error show"; }
      }
    }

    async function restoreBackup() {
      const msg = document.getElementById("backupMessage");
      const input = document.getElementById("bkFile");
      if (!input || !input.files || input.files.length === 0) {
        if (msg) { msg.textContent = "Önce yedek dosyası seçin."; msg.className = "message error show"; }
        return;
      }
      showConfirmModal({
        title: "Yedeği Geri Yükle",
        message: "Yedekteki bölümler mevcut verilerin üzerine yazılacak. Önce otomatik güvenlik kopyası alınır. Devam edilsin mi?",
        confirmText: "Geri Yükle",
        onConfirm: async () => {
          try {
            const formData = new FormData();
            formData.append("file", input.files[0]);
            const res = await apiFetch("/api/backup/restore", { method: "POST", body: formData });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
              showToast("Geri yüklendi: " + (data.restored || []).join(", "), "success");
              setTimeout(() => window.location.reload(), 1200);
            } else if (res.status !== 401 && msg) {
              msg.textContent = data.error || "Geri yükleme başarısız.";
              msg.className = "message error show";
            }
          } catch {
            if (msg) { msg.textContent = "Bağlantı hatası."; msg.className = "message error show"; }
          }
        },
      });
    }

    async function loadSettings() {
      const msg = document.getElementById("settingsMessage");
      try {
        const res = await apiFetch("/api/settings");
        if (!res.ok) throw new Error();
        const s = await res.json();
        paintMaintenance(s.maintenance === true);

        }
      } catch {

      } finally {

      }
    }

    let editEmail = null;

    let usersPage = 1;
    let usersAll = [];
    let usersOwnershipFilter = "";
    let usersSearch = "";
    let usersSort = { key: null, dir: 1 };
    const USERS_PAGE_SIZE = 25;

    function getFilteredUsers() {
      let list;
      if (!usersOwnershipFilter) list = [...usersAll];
      else if (usersOwnershipFilter === "bos") list = usersAll.filter((u) => !((u.profile || {}).ownership));
      else list = usersAll.filter((u) => ((u.profile || {}).ownership || "") === usersOwnershipFilter);
      const q = (usersSearch || "").toLocaleLowerCase("tr").trim();
      if (q) {
        list = list.filter((u) => {
          const hay = [u.email, u.role, (u.profile || {}).schoolName, (u.profile || {}).district]
            .map((s) => (s || "").toString().toLocaleLowerCase("tr")).join(" ");
          return hay.includes(q);
        });
      }
      const { key, dir } = usersSort;
      if (key) {
        const trLow = (s) => (s || "").toString().toLocaleLowerCase("tr");
        const roleOrder = { admin: "sistem yoneticisi", lise: "lise grubu", ortaokul: "ortaokul grubu", diger: "diger" };
        const val = (u) => {
          if (key === "schoolName" || key === "district") return trLow((u.profile || {})[key]);
          if (key === "ownership") return trLow((u.profile || {}).ownership);
          if (key === "role") return roleOrder[u.role] || u.role;
          if (key === "created" || key === "lastLogin") return u[key] || 0;
          return trLow(u[key]);
        };
        list.sort((a, b) => {
          const va = val(a), vb = val(b);
          const cmp = (typeof va === "number" && typeof vb === "number")
            ? (va - vb)
            : String(va).localeCompare(String(vb), "tr");
          return (cmp === 0 ? 0 : (cmp > 0 ? 1 : -1)) * dir;
        });
      }
      return list;
    }

    function sortUsers(key) {
      if (usersSort.key === key) {
        usersSort.dir = usersSort.dir === 1 ? -1 : 1;
      } else {
        usersSort = { key, dir: 1 };
      }
      usersPage = 1;
      renderUsersTable();
    }

      usersOwnershipFilter = val || "";
      usersPage = 1;
      renderUsersTable();
    }

      usersSearch = val || "";
      usersPage = 1;

      const totalPages = Math.max(1, Math.ceil(filtered.length / USERS_PAGE_SIZE));
      const nav = document.getElementById("usersPagination");
      if (!nav) return;
      if (totalPages <= 1) { nav.innerHTML = ""; return; }
      let html = "";
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(1)" ' + (usersPage === 1 ? 'disabled' : '') + '><i class="fa-solid fa-angles-left"></i></button>';
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(' + (usersPage - 1) + ')" ' + (usersPage === 1 ? 'disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>';
      html += '<span style="font-size:13px;color:var(--text-2);padding:0 8px;">' + usersPage + " / " + totalPages + "</span>";
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(' + (usersPage + 1) + ')" ' + (usersPage === totalPages ? 'disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>';
      html += '<button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:12px;" onclick="goToUsersPage(' + totalPages + ')" ' + (usersPage === totalPages ? 'disabled' : '') + '><i class="fa-solid fa-angles-right"></i></button>';

    function renderUsersTable() {
      const tbody = document.getElementById("usersTableBody");
      if (!tbody) return;
      const filtered = getFilteredUsers();
      ["email", "role", "schoolName", "district", "ownership", "created", "lastLogin"].forEach((k) => {
        const el = document.getElementById("usSort-" + k);
        if (el) el.textContent = (usersSort.key === k) ? (usersSort.dir === 1 ? " ▲" : " ▼") : "";
      });
      const start = (usersPage - 1) * USERS_PAGE_SIZE;
      const pageUsers = filtered.slice(start, start + USERS_PAGE_SIZE);
      tbody.innerHTML = pageUsers.map((u) => {
        const created = u.created ? new Date(u.created).toLocaleDateString("tr-TR") : "-";
        const lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleDateString("tr-TR") + " " + new Date(u.lastLogin).toLocaleTimeString("tr-TR", {hour:"2-digit",minute:"2-digit"}) : "-";
        const canDelete = u.email !== currentUser.email;
        return `
          <tr>
            <td class="cell-email">${u.email}</td>
            <td>
                <select class="role-select" data-email="${u.email}" onchange="updateRole('${u.email}',this.value)">
                  <option value="admin" ${u.role==="admin"?"selected":""}>Sistem Yöneticisi</option>
                  <option value="lise" ${u.role==="lise"?"selected":""}>Lise Grubu</option>
                  <option value="ortaokul" ${u.role==="ortaokul"?"selected":""}>Ortaokul Grubu</option>
                  <option value="diger" ${u.role==="diger"?"selected":""}>Diğer</option>
                </select>
            </td>
            <td class="cell-email" style="font-size:12px;">${escHtml((u.profile||{}).schoolName || "-")}</td>
            <td style="font-size:12px;">${escHtml((u.profile||{}).district || "-")}</td>
            <td>
                <select class="role-select" data-email="${u.email}" onchange="updateOwnership('${u.email}',this.value)" title="Resmi / Özel">
                  <option value="" ${!((u.profile||{}).ownership)?"selected":""}>-</option>
                  <option value="resmi" ${((u.profile||{}).ownership)==="resmi"?"selected":""}>Resmi</option>
                  <option value="ozel" ${((u.profile||{}).ownership)==="ozel"?"selected":""}>Özel</option>
                </select>
            </td>
            <td style="font-size:12px;">
              <div style="display:flex;flex-wrap:wrap;gap:4px 12px;">
              ${["lise","ortaokul","diger"].filter(r => r !== u.role).map(r => {
                const checked = (u.crossRoles||[]).includes(r) ? "checked" : "";
                return '<label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;white-space:nowrap;"><input type="checkbox" ' + checked + ' onchange="toggleCrossRole(\'' + u.email + '\',\'' + r + '\',this.checked)" style="margin:0;vertical-align:middle;"> <span>' + (r==="lise"?"Lise":r==="ortaokul"?"Ortaokul":"Diğer") + '</span></label>';
              }).join("")}
              </div>
            </td>
            <td class="cell-date">${created}</td>
            <td class="cell-date">${lastLogin}</td>
            <td class="cell-actions">
              ${canDelete ? `<button class="btn-icon btn-icon-danger" onclick="showDeleteModal('${u.email}')" title="Sil"><i class="fa-solid fa-trash-can"></i></button>` : '<span style="color:var(--muted);font-size:12px;">(siz)</span>'}
            </td>
          </tr>
        `;
      }).join("");
      renderUsersPagination();
    }

    async function saveUser() {
      const email = document.getElementById("modalEmail").value.trim();
      const role = document.getElementById("modalRole").value;
      const ownership = document.getElementById("modalOwnership").value;
      const msg = document.getElementById("modalMessage");
      const btn = document.getElementById("modalSaveBtn");

      if (!email) {
        msg.textContent = "E-posta adresi girin.";
        msg.className = "message error show";
        return;
      }
      if (role !== "admin" && !ownership) {
        msg.textContent = "Okul türü seçin (Resmi / Özel).";
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      setAddBtnLabel(btn, "Kaydediliyor...");

      try {
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ email, role, ownership }),
        });
        const data = await res.json();
        if (res.ok) {
          closeUserModal();
          await loadUsersTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        setAddBtnLabel(btn, "Kaydet");
      }
    }

    async function updateRole(email, role) {
      try {
        await fetch("/api/users/" + encodeURIComponent(email), {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ role }),
        });
      } catch {}
    }

    async function updateOwnership(email, ownership) {
      try {
        const res = await fetch("/api/users/" + encodeURIComponent(email), {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ ownership }),
        });
        if (res.ok) {
          const u = usersAll.find((x) => x.email === email);
          if (u) {
            u.profile = { ...(u.profile || {}), ownership: ownership || "" };
            renderUsersTable();
          }
        }
      } catch {}
    }

    window.toggleCrossRole = async function (email, role, add) {
      try {
        const res = await fetch("/api/users/" + encodeURIComponent(email), {
          method: "GET",
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) return;
        const user = await res.json();
        let crossRoles = user.crossRoles || [];
        if (add) {
          if (!crossRoles.includes(role)) crossRoles.push(role);
        } else {
          crossRoles = crossRoles.filter((r) => r !== role);
        }
        await fetch("/api/users/" + encodeURIComponent(email), {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ crossRoles }),
        });
      } catch {}
    };

    async function importUsers() {
      const fileInput = document.getElementById("importFileInput");
      const msg = document.getElementById("importMessage");
      const btn = document.getElementById("importBtn");
      const resultDiv = document.getElementById("importResult");

      if (!fileInput.files || !fileInput.files[0]) {
        msg.className = "message error show";
        msg.textContent = "Lütfen bir Excel dosyası seçin.";
        return;
      }

      btn.disabled = true;
      btn.disabled = true;
      setAddBtnLabel(btn, "Yükleniyor...");
      msg.className = "message";
      msg.textContent = "";

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const res = await fetch("/api/users/import", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          resultDiv.style.display = "block";
          resultDiv.innerHTML = '<div style="display:flex;align-items:center;gap:12px;"><i class="fa-solid fa-check-circle" style="font-size:24px;color:#22c55e;"></i>'
            + '<div><div style="font-weight:600;color:#15803d;">' + data.added + ' yeni kullanıcı eklendi</div>'
            + '<div style="font-size:12px;color:var(--muted);">' + data.updated + ' kullanıcı güncellendi</div></div></div>';
          if (data.errors && data.errors.length > 0) {
            resultDiv.innerHTML += '<div style="margin-top:8px;font-size:12px;color:#ef4444;">Hatalar: ' + data.errors.join(", ") + '</div>';
          }
          setAddBtnLabel(btn, "Yükle");
          btn.disabled = false;
          loadUsersTable();
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Yükleme başarısız.";
          setAddBtnLabel(btn, "Yükle");
          btn.disabled = false;
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata oluştu: " + e.message;
        setAddBtnLabel(btn, "Yükle");
        btn.disabled = false;
      }
    }

      btn.disabled = true;

    async function loadAnnouncementsTable() {
      const tbody = document.getElementById("annTableBody");
      try {
        const res = await apiFetch("/api/announcements" + asRoleQuery());
        if (!res.ok) throw new Error();
        const list = await res.json();
        readData = list;
        const targetLabels = { all: "Tümü", lise: "Lise", ortaokul: "Ortaokul", diger: "Diğer", resmi: "Resmi Okullar", ozel: "Özel Okullar" };
        tbody.innerHTML = list.map((a) => {
          const expires = new Date(a.expiresAt).toLocaleDateString("tr-TR");
          const expired = a.expiresAt < Date.now();
          const readCount = a.readCount || (a.readBy ? a.readBy.length : 0);
          const readDetail = a.readBy && a.readBy.length > 0
            ? a.readBy.join(", ")
            : "Henüz okunmadı";
          return `
            <tr style="${expired ? 'background:rgba(139,0,0,0.08);' : 'background:rgba(22,163,74,0.08);'}">
              <td class="cell-email">${escHtml(a.title)}</td>
              <td><span class="ann-tag ${a.target === 'all' ? 'admin' : a.target}" style="font-size:11px;">${(a.targets && a.targets.length > 1) ? groupLabels(a) : (targetLabels[a.target] || a.target)}</span></td>
              <td class="cell-date">${expired ? 'Süresi doldu' : expires}</td>
              <td class="cell-date">
                ${readCount > 0
                  ? `<a href="#" onclick="showReadDetail('${a.id}');return false;" style="color:#6366f1;text-decoration:none;">${readCount} kişi</a>`
                  : '0 kişi'}
              </td>
              <td class="cell-actions">
                <button class="btn-icon" onclick="editAnn('${a.id}')" title="Düzenle"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-icon btn-icon-danger" onclick="deleteAnn('${a.id}')" title="Sil"><i class="fa-solid fa-trash-can"></i></button>
              </td>
            </tr>
          `;
        }).join("");
      } catch {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#dc2626;padding:40px;">Duyurular yüklenirken hata oluştu.</td></tr>';
      }
    }

    async function editAnn(id) {
      try {
        const res = await fetch("/api/announcements" + asRoleQuery(), {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        const ann = list.find((a) => a.id === id);
        if (!ann) return;
        editingAnnId = id;
        document.getElementById("annModalTitle").textContent = "Duyuru Düzenle";
        setAddBtnLabel(document.getElementById("annSaveBtn"), "Güncelle");
        document.getElementById("annTitle").value = ann.title;
        document.getElementById("annContent").value = ann.content;
        document.getElementById("annTargetWrap").innerHTML = targetSelectorHtml("ann", normalizeTarget(ann));
        document.getElementById("annExpiry").value = toDateTimeLocalValue(ann.expiresAt);
        document.getElementById("annModalMessage").textContent = "";
        document.getElementById("annModalMessage").className = "message";
        document.getElementById("annModal").style.display = "flex";
        setTimeout(() => document.getElementById("annTitle").focus(), 100);
      } catch {}
    }

    async function saveAnnouncement() {
      const title = document.getElementById("annTitle").value.trim();
      const content = document.getElementById("annContent").value.trim();
      const annSel = collectTargetSelection("ann");
      const exp = readExpiryInput("annExpiry");
      const msg = document.getElementById("annModalMessage");
      const btn = document.getElementById("annSaveBtn");

      if (!title || !content) {
        msg.textContent = "Başlık ve içerik gerekli.";
        msg.className = "message error show";
        return;
      }
      if (exp.error) {
        msg.textContent = exp.error;
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      setAddBtnLabel(btn, "Kaydediliyor...");

      try {
        const method = editingAnnId ? "PUT" : "POST";
        const url = editingAnnId ? "/api/announcements/" + editingAnnId : "/api/announcements";
        const payload = { title, content, targetOwnership: annSel.ownership, targetRoles: annSel.roles, expiresAt: exp.at };
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          closeAnnModal();
          await loadAnnouncementsTable();
        } else {
          msg.textContent = data.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        setAddBtnLabel(btn, editingAnnId ? "Güncelle" : "Kaydet");
      }
    }

    async function deleteAnn(id) {
      showConfirmModal({
        title: "Duyuruyu Sil",
        message: "Bu duyuruyu silmek istediğinize emin misiniz?",
        confirmText: "Sil",
        onConfirm: async () => {
          try {
            const res = await apiFetch("/api/announcements/" + id, { method: "DELETE" });
            if (res.ok) {
              showToast("Duyuru silindi.", "success");
              await loadAnnouncementsTable();
            } else if (res.status !== 401) {
              showToast("Duyuru silinemedi.", "error");
            }
          } catch {
            showToast("Bağlantı hatası.", "error");
          }
        },
      });
    }

        if (total === 0) {
          html = statsHtml + `
            <div style="text-align:center;padding:60px 0;color:#ccc;">

          // Dağılım halkaları: rol payları + tür payları (SVG donut, ortada toplam)
          const CIRC = 2 * Math.PI * 70;
          const buildDonut = (segs) => {
            let acc = 0;
            const rings = segs.map((s) => {
              const len = Math.max((s.count / total) * CIRC - 4, 2);
              const el = `<circle cx="90" cy="90" r="70" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${len.toFixed(1)} ${(CIRC - len).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" stroke-linecap="round" transform="rotate(-90 90 90)"></circle>`;
              acc += (s.count / total) * CIRC;
              return el;
            }).join("");

              <div class="donut-legend-row"><span class="donut-dot" style="background:${s.color};"></span>${s.label}<span class="donut-count">${s.count}</span></div>

            { label: "Diğer", count: diger.length, color: "#ec4899" },

            { label: "Resmi", count: resmiCount, color: "#16a34a" },
            { label: "Özel", count: ozelCount, color: "#d97706" },
            { label: "Belirsiz", count: total - resmiCount - ozelCount, color: "#9ca3af" },
          ].filter((s) => s.count > 0));

          html = `

              ${statsHtml}
              <div class="donut-panel">
                <div class="section-title" style="margin-bottom:0;"><i class="fa-solid fa-chart-pie"></i> Dağılım</div>

                    <svg width="120" height="120" viewBox="0 0 180 180" role="img" aria-label="Okul grup dağılımı">
                      ${roleDonut.rings}
                      <text x="90" y="88" text-anchor="middle" class="donut-center-value">${total}</text>
                      <text x="90" y="106" text-anchor="middle" class="donut-center-label">Okul</text>
                    </svg>
                    <div class="donut-legend">${roleDonut.legend}</div>
                  </div>
                  <div class="donut-item">
                    <div class="donut-sub">Tür Dağılımı</div>
                    <svg width="120" height="120" viewBox="0 0 180 180" role="img" aria-label="Okul tür dağılımı">
                      ${typeDonut.rings}
                      <text x="90" y="88" text-anchor="middle" class="donut-center-value">${total}</text>
                      <text x="90" y="106" text-anchor="middle" class="donut-center-label">Okul</text>
                    </svg>
                    <div class="donut-legend">${typeDonut.legend}</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="schools-toolbar">
              <span id="schoolsCount" class="schools-count" role="status" aria-live="polite"></span>
            </div>
            <div class="schools-list-panel">
              <div id="schoolsList"></div>
              <div id="schoolsPagination" class="schools-pagination"></div>
            </div>
          `;
        }
        document.getElementById("schoolsContent").innerHTML = html;
        // Tür filtresi değişince liste önbelleği yenilenir, sayfa başa döner
        window._schoolsFiltered = users;
        window.schoolsPage = 1;
        renderSchoolsList();

      }

    // Okul arama + sayfalama: arama tüm türe uygulanır, sayfa 25'lik dilimlerle listelenir (Türkçe uyumlu)
    function setSchoolsSearch(val) {
      window.schoolsSearchText = (val || "").toLocaleLowerCase("tr");
      window.schoolsPage = 1;
      renderSchoolsList();
    }
    function goToSchoolsPage(n) {
      window.schoolsPage = n;
      renderSchoolsList(true);
    }
    function renderSchoolsList(scroll) {
      const listEl = document.getElementById("schoolsList");
      if (!listEl) return;
      const pgEl = document.getElementById("schoolsPagination");
      const countEl = document.getElementById("schoolsCount");
      const q = (window.schoolsSearchText || "").trim();
      const base = window._schoolsFiltered || [];
      const vis = q ? base.filter((u) => schoolSearchKey(u).includes(q)) : [...base];
      const totalPages = Math.max(1, Math.ceil(vis.length / SCHOOLS_PAGE_SIZE));
      const page = Math.min(Math.max(1, window.schoolsPage || 1), totalPages);
      window.schoolsPage = page;
      const start = (page - 1) * SCHOOLS_PAGE_SIZE;
      const slice = vis.slice(start, start + SCHOOLS_PAGE_SIZE);
      const parts = [
        ["lise", "Lise Grubu", "fa-school", "#d97706", slice.filter((u) => u.role === "lise")],
        ["ortaokul", "Ortaokul Grubu", "fa-school", "#0d9488", slice.filter((u) => u.role === "ortaokul")],
        ["diger", "Diğer", "fa-users", "#ec4899", slice.filter((u) => u.role === "diger")],
      ];
      listEl.innerHTML = vis.length === 0
        ? '<div style="text-align:center;padding:40px;color:var(--muted);">Aramaya uyan okul bulunamadı.</div>'
        : parts.map(([key, title, icon, color, list]) => schoolGroupBlock(key, title, icon, color, list)).join("");
      if (countEl) {
        countEl.textContent = vis.length === 0
          ? "Sonuç yok"
          : `Toplam ${vis.length} okul • ${start + 1}–${Math.min(start + SCHOOLS_PAGE_SIZE, vis.length)} arası • Sayfa ${page}/${totalPages}`;
      }
      if (pgEl) {
        if (totalPages <= 1) {
          pgEl.innerHTML = "";
        } else {
          const lo = Math.max(1, Math.min(page - 2, totalPages - 4));
          const hi = Math.min(totalPages, lo + 4);
          let nums = "";
          for (let n = lo; n <= hi; n++) {
            nums += `<button class="pg-btn" onclick="goToSchoolsPage(${n})"${n === page ? ' aria-current="page"' : ""} aria-label="Sayfa ${n}">${n}</button>`;
          }
          pgEl.innerHTML = `<button class="pg-btn" onclick="goToSchoolsPage(${page - 1})"${page <= 1 ? " disabled" : ""} aria-label="Önceki sayfa">‹ Önceki</button>`
            + nums
            + `<button class="pg-btn" onclick="goToSchoolsPage(${page + 1})"${page >= totalPages ? " disabled" : ""} aria-label="Sonraki sayfa">Sonraki ›</button>`;
        }
      }
      if (scroll) { try { listEl.scrollIntoView({ block: "start" }); } catch (_) {} }
    }

    async function saveSchoolProfile() {
      const data = {
        schoolName: document.getElementById("spSchoolName").value.trim(),
        schoolCode: currentUser.email.split("@")[0],
        city: document.getElementById("spCity").value.trim(),
        district: document.getElementById("spDistrict").value.trim(),
        principalName: document.getElementById("spPrincipalName").value.trim(),
        principalPhone: document.getElementById("spPrincipalPhone").value.trim(),
        schoolPhone: document.getElementById("spSchoolPhone").value.trim(),
        studentCount: document.getElementById("spStudentCount").value.trim(),
        teacherCount: document.getElementById("spTeacherCount").value.trim(),
        classCount: document.getElementById("spClassCount").value.trim(),
      };
      const msg = document.getElementById("spMessage");
      const btn = document.getElementById("spSaveBtn");

      if (!data.schoolName) {
        msg.textContent = "Okul adı gerekli.";
        msg.className = "message error show";
        return;
      }

      btn.disabled = true;
      setAddBtnLabel(btn, "Kaydediliyor...");

      try {
        const res = await fetch("/api/profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          currentUser.profile = data;
          closeSchoolProfileForm();
          renderDashboard();
        } else {
          const err = await res.json();
          msg.textContent = err.error || "Hata oluştu.";
          msg.className = "message error show";
        }
      } catch {
        msg.textContent = "Bağlantı hatası.";
        msg.className = "message error show";
      } finally {
        btn.disabled = false;
        setAddBtnLabel(btn, "Kaydet");
      }
    }

    async function loadAdminFilesTable() {
      const tbody = document.getElementById("adminFilesBody");
      try {
        const res = await fetch("/api/files" + asRoleQuery(), {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const list = await res.json();
        if (list.length === 0) {
          document.getElementById("adminFilesWrap").innerHTML = '<div style="text-align:center;padding:60px 0;color:#ccc;"><i class="fa-solid fa-folder-open" style="font-size:48px;margin-bottom:16px;display:block;"></i><div style="font-size:14px;">Henüz dosya yüklenmemiş.</div></div>';
          return;
        }
        tbody.innerHTML = list.map((f) => {
          const now = Date.now();
          const starts = new Date(f.startsAt).toLocaleDateString("tr-TR");
          const expires = new Date(f.expiresAt).toLocaleDateString("tr-TR");
          const uploaded = new Date(f.uploadedAt).toLocaleDateString("tr-TR");
          const notStarted = f.startsAt > now;
          const expired = f.expiresAt <= now;
          let statusLabel, statusColor;
          if (notStarted) { statusLabel = "Henüz Başlamadı"; statusColor = "#f59e0b"; }
          else if (expired) { statusLabel = "Süresi Doldu"; statusColor = "#ef4444"; }
          else { statusLabel = "Aktif"; statusColor = "#22c55e"; }
          const targetLabel = f.targetType === "all" ? "Tüm Kullanıcılar"
            : f.targetType === "group" ? groupLabels(f)
            : (f.targetUsers || []).join(", ");
          const rowBg = (!notStarted && !expired) ? 'background:rgba(22,163,74,0.08);' : 'background:rgba(139,0,0,0.08);';
          return `
            <tr style="${rowBg}">
              <td style="font-weight:600;">
                <i class="fa-solid fa-file-zipper" style="color:#f59e0b;margin-right:8px;"></i>
                ${escHtml(f.originalName)}
                <div style="font-size:11px;color:var(--muted);font-weight:400;">${(f.size / 1024).toFixed(1)} KB - ${uploaded}</div>
              </td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(f.description)}</td>
              <td style="font-size:12px;">${escHtml(targetLabel)}</td>
              <td style="font-size:12px;">
                <div>Baş: ${starts}</div>
                <div style="color:${statusColor};">Bit: ${expires}</div>
                <div style="font-size:11px;color:${statusColor};font-weight:600;margin-top:2px;">${statusLabel}</div>
              </td>
              <td style="font-size:12px;"><a href="#" onclick="renderFileStatus('${f.id}');return false;" style="color:#6366f1;text-decoration:none;">${f.downloadCount} kez</a></td>
              <td class="cell-actions">
                <button class="btn-icon" onclick="downloadFile('${f.id}')" title="İndir"><i class="fa-solid fa-download"></i></button>
                <button class="btn-icon btn-icon-danger" onclick="deleteFile('${f.id}')" title="Sil"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `;
        }).join("");
      } catch {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#dc2626;padding:40px;">Dosyalar yüklenirken hata oluştu.</td></tr>';
      }
    }

    async function uploadFile() {
      const msg = document.getElementById("uploadMsg");
      const fileInput = document.getElementById("fileInput");
      const desc = document.getElementById("fileDesc");
      const startsAt = document.getElementById("fileStartsAt");
      const expiresAt = document.getElementById("fileExpiresAt");
      const targetType = document.getElementById("fileTargetType");
      const fileSel = collectTargetSelection("file");
      const targetUsers = document.getElementById("fileTargetUsers");

      if (!fileInput.files || !fileInput.files[0]) {
        msg.className = "message error show"; msg.textContent = "Lütfen bir ZIP dosyası seçin."; return;
      }
      if (!desc.value.trim()) {
        msg.className = "message error show"; msg.textContent = "Açıklama zorunlu."; return;
      }
      if (!startsAt.value) {
        msg.className = "message error show"; msg.textContent = "Başlangıç tarihi zorunlu."; return;
      }
      if (!expiresAt.value) {
        msg.className = "message error show"; msg.textContent = "Bitiş tarihi zorunlu."; return;
      }
      if (new Date(startsAt.value).getTime() >= new Date(expiresAt.value).getTime()) {
        msg.className = "message error show"; msg.textContent = "Başlangıç tarihi bitiş tarihinden önce olmalıdır."; return;
      }
      if (fileInput.files[0].size > 10 * 1024 * 1024) {
        msg.className = "message error show"; msg.textContent = "Dosya boyutu 10 MB'i geçemez."; return;
      }
      if (!fileInput.files[0].name.toLowerCase().endsWith(".zip")) {
        msg.className = "message error show"; msg.textContent = "Sadece ZIP dosyası kabul edilir."; return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("description", desc.value.trim());
      formData.append("startsAt", new Date(startsAt.value).getTime());
      formData.append("expiresAt", new Date(expiresAt.value).getTime());
      formData.append("targetType", targetType.value);
      if (targetType.value === "group") {
        formData.append("targetOwnership", fileSel.ownership);
        formData.append("targetRoles", JSON.stringify(fileSel.roles));
      }
      if (targetType.value === "users") formData.append("targetUsers", targetUsers.value);

      const uploadBtn = document.querySelector('button[onclick="uploadFile()"]');
      if (uploadBtn) { uploadBtn.disabled = true; setAddBtnLabel(uploadBtn, "Yükleniyor..."); }

      try {
        const res = await fetch("/api/files", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "message success show";
          msg.textContent = "Dosya başarıyla yüklendi!";
          setTimeout(() => renderAdminFiles(), 1000);
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Yükleme başarısız.";
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata oluştu: " + e.message;
      } finally {
        if (uploadBtn) { uploadBtn.disabled = false; setAddBtnLabel(uploadBtn, "Yükle"); }
      }
    }

    async function downloadFile(id) {
      try {
        const res = await fetch("/api/files/" + id + "/download", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || "Dosya indirilemedi.");
          return;
        }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const match = cd.match(/filename="?(.+?)"?$/);
        const filename = match ? match[1] : "dosya.zip";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("İndirme sırasında hata: " + e.message);
      }
    }

    async function hydrateAttachments(root) {
      // Ek önizleme: korumalı dosyaları token'lı blob olarak yükler (doğrudan link 401 verirdi)
      // Önceki önizleme URL'lerini serbest bırak (contentArea her render'da yenilenir, blob'lar RAM'de kalmasın)
      try {
        const holder = root || document.getElementById("contentArea");
        if (holder && Array.isArray(holder._blobUrls)) {
          holder._blobUrls.forEach((u) => { try { URL.revokeObjectURL(u); } catch (_) {} });
        }
        if (holder) holder._blobUrls = [];
      } catch (_) {}
      const nodes = (root || document).querySelectorAll(".attach-preview[data-attach-id]");
      for (const el of nodes) {
        if (el.dataset.loaded === "1") continue;
        el.dataset.loaded = "1";
        const id = el.dataset.attachId;
        const type = el.dataset.attachType;
        try {
          const res = await fetch("/api/requests/" + id + "/attachment?preview=1", {
            headers: { Authorization: "Bearer " + token },
          });
          if (!res.ok) continue;
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          try {
            const holder = root || document.getElementById("contentArea");
            if (holder && Array.isArray(holder._blobUrls)) holder._blobUrls.push(url);
          } catch (_) {}
          if (type === "image") {
            const img = document.createElement("img");
            img.src = url;
            img.alt = "Ek";
            img.style.cssText = "width:100%;max-height:180px;object-fit:cover;display:block;";
            el.appendChild(img);
          } else {
            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.style.cssText = "width:100%;height:100%;border:0;border-radius:8px;";
            el.appendChild(iframe);
          }
        } catch {}
      }
    }

    async function previewAttachment(id, type) {
      try {
        const res = await fetch("/api/requests/" + id + "/attachment?preview=1", {
          headers: { Authorization: "Bearer " + token },

        if (!res.ok) { alert("Dosya yuklenemedi."); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

          w.document.write('<html><head><title>Onizleme</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#222;}img{max-width:100%;max-height:100vh;object-fit:contain;}</style></head><body><img src="' + url + '" /></body></html>');
          setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 60000);
        }
      } catch (e) {
        alert("Hata: " + e.message);
      }
    }

    async function submitRequest() {
      const msg = document.getElementById("createRequestMsg");
      const type = document.getElementById("reqType");
      const title = document.getElementById("reqTitle");
      const desc = document.getElementById("reqDesc");
      const docNo = document.getElementById("reqDocNo");
      const fileInput = document.getElementById("reqFile");

      if (!title.value.trim()) { msg.className = "message error show"; msg.textContent = "Baslik zorunlu."; return; }
      if (!desc.value.trim()) { msg.className = "message error show"; msg.textContent = "Aciklama zorunlu."; return; }
      if (fileInput.files[0] && fileInput.files[0].size > 10 * 1024 * 1024) {
        msg.className = "message error show"; msg.textContent = "Dosya boyutu 10 MB'i gecemez."; return;
      }

      const formData = new FormData();
      formData.append("type", type.value);
      formData.append("title", title.value.trim());
      formData.append("description", desc.value.trim());
      if (docNo.value.trim()) formData.append("officialDocNo", docNo.value.trim());
      if (fileInput.files[0]) formData.append("file", fileInput.files[0]);

      const submitBtn = document.querySelector('#createRequestMsg')?.parentElement?.querySelector('button[onclick="submitRequest()"]')
        || document.querySelector('button[onclick="submitRequest()"]');
      if (submitBtn) { submitBtn.disabled = true; setAddBtnLabel(submitBtn, "Gonderiliyor..."); }

      try {
        const res = await fetch("/api/requests", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "message success show";
          msg.textContent = "Talebiniz basariyla gonderildi!";
          setTimeout(() => renderUserRequests(), 1000);
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Gonderilemedi.";
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Bir hata olustu: " + e.message;
      } finally {
        if (submitBtn) { submitBtn.disabled = false; setAddBtnLabel(submitBtn, "Gonder"); }
      }
    }

    async function deleteRequest(id, isUser) {
      showConfirmModal({
        title: "Talebi Sil",
        message: "Bu talebi silmek istediğinize emin misiniz?",
        confirmText: "Sil",
        onConfirm: async () => {
          try {
            const res = await apiFetch("/api/requests/" + id, { method: "DELETE" });
            if (res.ok) {
              showToast("Talep silindi.", "success");
              if (isUser) renderUserRequests();
              else renderAdminRequests();
            } else if (res.status !== 401) {
              const data = await res.json().catch(() => ({}));
              showToast(data.error || "Silinemedi.", "error");
            }
          } catch {
            showToast("Bağlantı hatası.", "error");
          }
        },
      });
    }

    async function downloadRequestAttachment(id) {
      try {
        const res = await fetch("/api/requests/" + id + "/attachment", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) { alert("Dosya indirilemedi."); return; }
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const match = cd.match(/filename="?(.+?)"?$/);
        const filename = match ? match[1] : "dosya";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("Hata: " + e.message);
      }
    }

                  <span class="add-btn__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></span>
                </button>
                <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;">
                  <input type="checkbox" id="respondClose" checked /> Cevapla ve Kapat
                </label>
              </div>
            </div>
          `;
        }

        html += '</div>';
        area.innerHTML = html;
        hydrateAttachments(area);
      } catch {
        area.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">Talep detayı yüklenirken hata oluştu.</div>';
      }
    }

    async function respondToRequest(id) {
      const msg = document.getElementById("respondMsg");
      const text = document.getElementById("respondText");
      const close = document.getElementById("respondClose");

      if (!text.value.trim()) { msg.className = "message error show"; msg.textContent = "Cevap mesaji zorunlu."; return; }

      try {
        const res = await fetch("/api/requests/" + id + "/respond", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({ message: text.value.trim(), close: close.checked }),
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "message success show";
          msg.textContent = "Cevap gonderildi!";
          setTimeout(() => renderAdminRequestDetail(id), 1000);
        } else {
          msg.className = "message error show";
          msg.textContent = data.error || "Gonderilemedi.";
        }
      } catch (e) {
        msg.className = "message error show";
        msg.textContent = "Hata: " + e.message;
      }
    }

    // ---- Reports ----

    async function renderReports() {
      const area = document.getElementById("contentArea");
      area.innerHTML = `
        <div class="content-header">
          <h2><i class="fa-solid fa-chart-bar"></i> Raporlar</h2>
          <p>Sistem istatistikleri ve kullanım analizleri.</p>
        </div>
        <div id="reportsContent" style="text-align:center;padding:60px;color:var(--muted);">Yükleniyor...</div>
      `;
      try {
        const res = await fetch("/api/reports", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderReportsContent(data);
      } catch {
        document.getElementById("reportsContent").innerHTML = '<div style="color:#dc2626;padding:40px;">Raporlar yüklenirken hata oluştu.</div>';
      }
    }

      // 1) User + school distribution pies (sol yarida yan yana iki kart)
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">';
      const legendRow = (r, pct) => '<div style="display:grid;grid-template-columns:12px minmax(0,1fr) 44px 56px;align-items:center;gap:10px;margin-bottom:8px;">'

      html += '<div class="report-card"><h4><i class="fa-solid fa-users"></i> Kullanici Dagilimi</h4><div style="display:flex;flex-direction:column;align-items:center;gap:12px;">'

      const roles = [
        { label: "Admin", count: d.users.admin, color: "#6366f1" },
        { label: "Lise", count: d.users.lise, color: "#22c55e" },

      roles.forEach((r) => {
        const pct = d.users.total > 0 ? Math.round((r.count / d.users.total) * 100) : 0;
        html += legendRow(r, pct);
      });
      html += '</div></div></div>';

      // 1b) School distribution pie (türe göre)
      const schools = d.schools || { total: 0, resmi: 0, ozel: 0, belirsiz: 0 };
      html += '<div class="report-card"><h4><i class="fa-solid fa-school"></i> Okul Dagilimi</h4><div style="display:flex;flex-direction:column;align-items:center;gap:12px;">'
        + '<canvas id="schoolPieChart" width="160" height="160"></canvas><div style="width:100%;">';

      html += '</div>';

      // 2) Daily activity (last 7 days)
      html += '<div class="report-card"><h4><i class="fa-solid fa-chart-line"></i> Son 7 Gun Aktivite</h4><div style="margin-top:8px;">';

      d.dailyActivity.forEach((a) => {

        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">'

      const maxMonth = Math.max(...d.monthlyActivity.map((a) => a.count), 1);
      d.monthlyActivity.forEach((a) => {
        const pct = (a.count / maxMonth) * 100;
        html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">'
          + '<span style="font-size:10px;font-weight:600;color:var(--text);margin-bottom:4px;">' + a.count + '</span>'
          + '<div style="width:100%;height:' + pct + '%;background:linear-gradient(180deg,#6366f1,#818cf8);border-radius:4px 4px 0 0;min-height:4px;"></div>'

      // 4) Top actions + top logins (sag yarida yan yana iki kart)
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">';
      const barRow = (label, count, max, color) => {
        const pct = max > 0 ? (count / max) * 100 : 0;

          + '<div style="height:18px;background:#f0f0f5;border-radius:4px;overflow:hidden;">'
          + '<div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:4px;"></div></div>'
          + '<span style="font-size:12px;font-weight:600;color:var(--text);text-align:right;">' + count + '</span></div>';
      };
      html += '<div class="report-card"><h4><i class="fa-solid fa-bolt"></i> En Cok Yapilan Islemler</h4><div style="margin-top:8px;">';
      const topActions = d.activityByAction.slice(0, 8);
      const maxAction = Math.max(...topActions.map((a) => a.count), 1);
      const actionColors = ["#6366f1","#22c55e","#f59e0b","#ef4444","#a855f7","#06b6d4","#ec4899","#14b8a6"];
      topActions.forEach((a, i) => {
        html += barRow(a.label, a.count, maxAction, actionColors[i % actionColors.length]);

      html += '</div></div>';

      // 4b) Top login users
      html += '<div class="report-card"><h4><i class="fa-solid fa-right-to-bracket"></i> En Cok Giris Yapanlar</h4><div style="margin-top:8px;">';

        html += '<div style="padding:20px;text-align:center;color:#ccc;font-size:13px;">Henuz giris yapilmamis.</div>';
      } else {
        const maxLogin = Math.max(...topLogins.map((x) => x.count), 1);
        const loginColors = ["#22c55e","#6366f1","#f59e0b","#ef4444","#a855f7","#06b6d4","#ec4899","#14b8a6"];
        topLogins.forEach((x, i) => {
          html += barRow(x.school, x.count, maxLogin, loginColors[i % loginColors.length]);

      html += '</div></div>';
      html += '</div></div>';

      // Third row
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;">';

      html += '<div class="report-card"><h4><i class="fa-solid fa-square-poll-vertical"></i> Anket Yanitlama Oranlari</h4><div style="margin-top:8px;">';
      if (d.surveyStats.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:#ccc;font-size:13px;">Henuz anket bulunmuyor.</div>';
      } else {
        d.surveyStats.forEach((s) => {

            + '<span style="color:var(--text-2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(s.title) + '</span>'
            + '<span style="color:var(--muted);">' + s.respCount + '/' + s.targetCount + '</span></div>'
            + '<div style="height:20px;background:#f0f0f5;border-radius:6px;overflow:hidden;">'
            + '<div style="height:100%;width:' + s.rate + '%;background:' + barColor + ';border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;min-width:fit-content;padding:0 6px;">' + s.rate + '%</div></div></div>';
        });
      }
      html += '</div></div>';

      // 6) Top files
      html += '<div class="report-card"><h4><i class="fa-solid fa-file-zipper"></i> En Cok Indirilen Dosyalar</h4><div style="margin-top:8px;">';
      if (d.topFiles.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:#ccc;font-size:13px;">Henuz dosya yuklenmemis.</div>';
      } else {
        const maxDl = Math.max(...d.topFiles.map((f) => f.downloads), 1);
        d.topFiles.forEach((f) => {
