<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <title>Veri 41</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/style.css?v=3" />
  <script>
    // Karşılama ekranı her zaman açık tema kullanır.
    document.documentElement.dataset.theme = "light";
  </script>
</head>
<body>
  <div class="peg-loader-overlay" id="globalLoader" role="status" aria-live="polite" aria-hidden="true">
    <div class="peg-loader-box">
      <div class="peg-loader" aria-hidden="true">
        <svg id="pegtopone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g><path d="M63,37c-6.7-4-4-27-13-27s-6.3,23-13,27-27,4-27,13,20.3,9,27,13,4,27,13,27,6.3-23,13-27,27-4,27-13-20.3-9-27-13Z" fill="currentColor"></path></g></svg>
        <svg id="pegtoptwo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g><path d="M63,37c-6.7-4-4-27-13-27s-6.3,23-13,27-27,4-27,13,20.3,9,27,13,4,27,13,27,6.3-23,13-27,27-4,27-13-20.3-9-27-13Z" fill="currentColor"></path></g></svg>
        <svg id="pegtopthree" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g><path d="M63,37c-6.7-4-4-27-13-27s-6.3,23-13,27-27,4-27,13,20.3,9,27,13,4,27,13,27,6.3-23,13-27,27-4,27-13-20.3-9-27-13Z" fill="currentColor"></path></g></svg>
      </div>
      <div class="peg-loader-text">Yükleniyor...</div>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <div style="width:128px;height:128px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border:none;background:none;box-shadow:none;border-radius:0;">
          <img src="/assets/logo-kodm.png" alt="KODM" style="width:128px;height:128px;display:block;" />
        </div>
        <h1>Hoş Geldiniz</h1>
        <p id="status" role="status" aria-live="polite">Yükleniyor...</p>
      </div>
      <div id="buttons" style="display:flex;flex-direction:column;gap:12px;align-items:center;">
        <a href="/login.html" class="btn btn-primary" style="text-decoration:none;max-width:240px;background:#b91c1c;border-color:#b91c1c;">
          <i class="fa-solid fa-right-to-bracket"></i> Giriş Yap
        </a>
      </div>
    </div>
  </div>
  <script>
    const token = localStorage.getItem("token");
    const statusEl = document.getElementById("status");
    const buttons = document.getElementById("buttons");
    function showGlobalLoader() {
      try {
        const ov = document.getElementById("globalLoader");
        if (ov) { ov.classList.add("show"); ov.setAttribute("aria-hidden", "false"); }
      } catch (_) {}
    }
    function hideGlobalLoader() {
      try {
        const ov = document.getElementById("globalLoader");
        if (ov) { ov.classList.remove("show"); ov.setAttribute("aria-hidden", "true"); }
      } catch (_) {}
    }

    if (token) {
      statusEl.textContent = "Oturum kontrol ediliyor...";
      buttons.style.display = "none";
      showGlobalLoader();
      fetch("/api/verify-token", {
        headers: { Authorization: "Bearer " + token },
      })
        .then((r) => r.json())
        .then((data) => {
          hideGlobalLoader();
          if (data.valid) {
            window.location.replace("/dashboard.html");
            return;
          }
          if (data.valid === false) {
            localStorage.removeItem("token");
          }
          statusEl.textContent = "Giriş yaparak devam edin.";
          buttons.style.display = "flex";
        })
        .catch(() => {
          hideGlobalLoader();
          statusEl.textContent = "Bağlantı hatası. Giriş yaparak devam edin.";
          buttons.style.display = "flex";
        });
    } else {
      statusEl.textContent = "Giriş yaparak devam edin.";
    }
  </script>
</body>
</html>
